  --bg:#F2F3F5;--card:#FFFFFF;--ink:#24272E;--soft:#5F6670;--hair:#E1E4E8;
  --sheet:#C23D56;--sheet-pale:#EDBFC8;--sheet-tint:#FBECEF;

}
@media (prefers-color-scheme:dark){:root{
  --bg:#1B1D21;--card:#25282E;--ink:#E9EBEE;--soft:#A3A9B2;--hair:#373B43;

  --wet:#5DB6AC;--wet-tint:#1F3532;--lead:#D7DADF;

*{box-sizing:border-box;margin:0;padding:0}
html{-webkit-text-size-adjust:100%;background:var(--bg)}
body{font:16px/1.7 var(--sans);color:var(--ink);background:var(--bg);-webkit-tap-highlight-color:transparent}
body.lock{overflow:hidden}
button,input,textarea{font:inherit;color:inherit}
button{background:none;border:0;cursor:pointer;text-align:left}
:focus-visible{outline:2px solid var(--sheet);outline-offset:2px;border-radius:6px}
.wrap{max-width:560px;margin:0 auto;padding:calc(18px + env(safe-area-inset-top)) 18px calc(92px + env(safe-area-inset-bottom))}

h3{font:700 16.5px/1.45 var(--serif)}
.sub{color:var(--soft);font-size:14px}
.count{font-size:17px;margin-top:8px}

.tip{background:var(--card);border:1px solid var(--hair);border-radius:12px;padding:12px 14px;margin-top:14px;font-size:14.5px}

.tip .x{float:right;color:var(--soft);padding:0 0 6px 10px}
.warn{border-color:var(--sheet-pale);background:var(--sheet-tint)}

.quick .wide{grid-column:1/-1;min-height:0}
.sheet{background:var(--card);border:1px solid var(--sheet-pale);border-top:3px solid var(--sheet);border-radius:3px;padding:4px 14px 8px}

.row:last-child{border-bottom:0}

.bubs i.w{background:var(--sheet);border-color:var(--sheet)}
.legend{display:flex;flex-wrap:wrap;gap:4px 14px;font-size:12.5px;color:var(--soft);margin-top:8px}

.legend i.ok{background:var(--lead);border-color:var(--lead)}
.legend i.w{background:var(--sheet);border-color:var(--sheet)}
.plan{background:var(--card);border-radius:12px;padding:14px 16px;border:1px solid var(--hair)}
.tag{font:500 12.5px/1.6 var(--sans);color:var(--wet);background:var(--wet-tint);border-radius:999px;padding:2px 9px;margin-left:6px;vertical-align:2px;white-space:nowrap}
.tasks{list-style:none;margin-top:6px}
.chk{display:flex;gap:10px;width:100%;padding:7px 0;align-items:flex-start;line-height:1.55}
.box{flex:none;width:20px;height:20px;border:1.6px solid var(--soft);border-radius:5px;margin-top:2px;position:relative}
.chk[aria-pressed=true] .box{background:var(--wet);border-color:var(--wet)}
.chk[aria-pressed=true] .box::after{content:"";position:absolute;left:5.5px;top:1.5px;width:5px;height:10px;border:solid #fff;border-width:0 2px 2px 0;transform:rotate(45deg)}
.chk[aria-pressed=true] .tt{color:var(--soft);text-decoration:line-through}
.goal{font-size:14px;color:var(--soft);margin-top:6px}
details.day{margin-top:8px}
details.day>summary{cursor:pointer;padding:10px 14px;background:var(--card);border:1px solid var(--hair);border-radius:12px;list-style:none;font-weight:600}
details.day>summary::-webkit-details-marker{display:none}
details.day>summary small{font-weight:400;color:var(--soft);margin-left:8px}
details.day[open]>summary{border-radius:12px 12px 0 0;border-bottom:0}
details.day .plan{border-radius:0 0 12px 12px;border-top:1px dashed var(--hair)}
.list{background:var(--card);border-radius:12px;border:1px solid var(--hair)}
.li{display:flex;align-items:center;gap:12px;width:100%;padding:12px 16px;border-bottom:1px solid var(--hair);min-height:58px}
.li:last-child{border-bottom:0}
.tx{flex:1;min-width:0}
.tx b{display:block;font-weight:600}
.tx small{color:var(--soft);font-size:13px;display:block}
.bar{height:4px;background:var(--hair);border-radius:2px;margin-top:6px;overflow:hidden}
.bar span{display:block;height:100%;background:var(--lead)}
.go{color:var(--soft);font-size:20px}
.btns{display:flex;gap:8px;flex:none}
.mini{font-size:14px;padding:6px 13px;border-radius:999px;border:1px solid var(--hair);background:var(--bg);white-space:nowrap}
.mini[aria-pressed=true]{background:var(--wet-tint);border-color:var(--wet);color:var(--wet)}
.pri{display:block;width:100%;text-align:center;background:var(--ink);color:var(--bg);border-radius:12px;padding:13px;font-weight:600;margin-top:12px}
.sec{display:block;width:100%;text-align:center;border:1px solid var(--hair);background:var(--card);border-radius:12px;padding:12px;margin-top:10px}
.danger{color:var(--sheet)}
.search{width:100%;padding:11px 14px;border-radius:12px;border:1px solid var(--hair);background:var(--card);font-size:16px;margin-top:14px;-webkit-appearance:none}
.sr .li{min-height:0}
.hl{background:var(--sheet-tint);color:var(--sheet);border-radius:3px;padding:0 1px}
#ov{position:fixed;inset:0;background:var(--bg);overflow-y:auto;-webkit-overflow-scrolling:touch;z-index:20;padding-bottom:calc(28px + env(safe-area-inset-bottom))}
#ov[hidden]{display:none}
.oh{position:sticky;top:0;z-index:2;display:flex;align-items:center;gap:6px;background:var(--bg);padding:calc(6px + env(safe-area-inset-top)) 10px 6px;border-bottom:1px solid var(--hair)}
.oh h2{flex:1;margin:0;font-size:16px;text-align:center;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.back{padding:9px 6px;color:var(--sheet);font-weight:600;min-width:70px}
.ohr{min-width:70px;text-align:right;font-variant-numeric:tabular-nums;color:var(--soft);font-size:14px}
.ohr button{color:var(--sheet);font-weight:600;padding:9px 4px}
.ob{max-width:560px;margin:0 auto;padding:16px 18px}
.chips{display:flex;flex-wrap:wrap;gap:6px}
.chip{font-size:12.5px;padding:2px 9px;border-radius:999px;background:var(--card);border:1px solid var(--hair);color:var(--soft)}
.chip.zt{color:var(--sheet);border-color:var(--sheet-pale)}
.stem{font-size:18px;line-height:1.75;margin:14px 0 6px}
.hint{font-size:13.5px;color:var(--soft);margin-bottom:12px}
.opt{display:flex;gap:12px;align-items:flex-start;width:100%;background:var(--card);border:1.5px solid var(--hair);border-radius:12px;padding:12px 14px;margin-top:10px;line-height:1.6}
.bb{flex:none;min-width:34px;height:24px;border:1.5px solid var(--sheet);color:var(--sheet);border-radius:12px;display:grid;place-items:center;font-size:14px;font-weight:600;margin-top:1px}
.opt.on .bb{background:var(--lead);border-color:var(--lead);color:var(--bg)}
.opt.right{border-color:var(--wet);background:var(--wet-tint)}
.opt.right .bb{background:var(--wet);border-color:var(--wet);color:#fff}
.opt.bad{border-color:var(--sheet);background:var(--sheet-tint)}
.opt.bad .bb{background:var(--sheet);border-color:var(--sheet);color:#fff}
.fb{border-left:3px solid var(--wet);background:var(--card);padding:12px 14px;border-radius:0 10px 10px 0;margin-top:16px}
.fb.no{border-left-color:var(--sheet)}
.fbh{font-weight:700;margin-bottom:4px}
.fb.ok .fbh{color:var(--wet)}
.fb.no .fbh{color:var(--sheet)}
.fb p+p{margin-top:6px}
.qnav{display:grid;grid-template-columns:1fr auto 1fr;gap:8px;margin-top:18px}
.qnav button{padding:12px 10px;border-radius:12px;border:1px solid var(--hair);background:var(--card);text-align:center}
.qnav .nx{background:var(--ink);color:var(--bg);border-color:var(--ink);font-weight:600}
.qnav button:disabled{opacity:.4}
.qnav .fav[aria-pressed=true]{color:#B07A12;border-color:#E2C27A}
.src{font-size:13px;color:var(--soft);margin-top:8px}
.kp{background:var(--card);border:1px solid var(--hair);border-radius:12px;padding:14px 16px;margin-top:10px}
.kp p{margin-top:6px}
.kp .mini{margin-top:10px}
.flash{background:var(--card);border:1px solid var(--hair);border-radius:14px;padding:22px 18px;margin-top:8px;min-height:46vh}
.flash h2{margin:12px 0 4px;font-size:21px}
.flash p{margin-top:8px}
.two{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin-top:20px}
.two button{padding:13px;border-radius:12px;text-align:center;border:1px solid var(--hair);background:var(--bg);font-weight:600}
.two .pri{margin:0}
.big{font:700 48px/1.1 var(--serif);font-variant-numeric:tabular-nums;margin:12px 0 4px}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(46px,1fr));gap:8px;margin-top:12px}
.grid button{height:44px;border:1.5px solid var(--sheet-pale);border-radius:10px;text-align:center;font-variant-numeric:tabular-nums;font-size:14px}
.grid button.on{background:var(--lead);color:var(--bg);border-color:var(--lead)}
.grid button.cur{outline:2px solid var(--sheet);outline-offset:1px}
.grid-sec{font-size:13.5px;color:var(--soft);margin-top:16px}
.tbl{width:100%;border-collapse:collapse;background:var(--card);border-radius:12px;overflow:hidden;font-size:14.5px}
.tbl th,.tbl td{padding:9px 10px;border-bottom:1px solid var(--hair);text-align:right;font-variant-numeric:tabular-nums}
.tbl th:first-child,.tbl td:first-child{text-align:left}
.tbl th{font-weight:600;color:var(--soft);font-size:13px}
.tbl tr:last-child td{border-bottom:0}
.days{display:flex;gap:6px;align-items:flex-end;height:110px;background:var(--card);border:1px solid var(--hair);border-radius:12px;padding:12px}
.days div{flex:1;text-align:center;font-size:11px;color:var(--soft);display:flex;flex-direction:column;justify-content:flex-end;height:100%}
.days span{display:block;background:var(--lead);border-radius:3px 3px 0 0;min-height:2px;margin:0 auto 3px;width:70%}
.days em{font-style:normal;color:var(--ink);font-variant-numeric:tabular-nums}
.stats{display:grid;grid-template-columns:repeat(3,1fr);gap:10px;margin-top:14px}
.stats div{background:var(--card);border:1px solid var(--hair);border-radius:12px;padding:10px 12px}
.stats b{display:block;font:700 22px/1.2 var(--serif);font-variant-numeric:tabular-nums}
.stats small{color:var(--soft);font-size:12.5px}
textarea{width:100%;height:200px;border:1px solid var(--hair);border-radius:12px;padding:10px;background:var(--card);font-size:16px;margin-top:10px}
.prose p{margin-top:8px}
.prose{font-size:15px}
#tabs{position:fixed;left:0;right:0;bottom:0;z-index:10;display:flex;justify-content:center;background:var(--card);border-top:1px solid var(--hair);padding-bottom:env(safe-area-inset-bottom)}
#tabs button{flex:1;max-width:112px;height:58px;padding-top:20px;text-align:center;font-size:14.5px;color:var(--soft);position:relative}
#tabs button::before{content:"";position:absolute;top:9px;left:50%;width:16px;height:9px;margin-left:-8px;border-radius:5px;border:1.5px solid var(--sheet-pale)}
#tabs button[aria-current=page]{color:var(--ink);font-weight:700}
#tabs button[aria-current=page]::before{background:var(--lead);border-color:var(--lead)}
#toast{position:fixed;left:50%;bottom:calc(84px + env(safe-area-inset-bottom));transform:translateX(-50%);background:var(--ink);color:var(--bg);padding:9px 16px;border-radius:999px;font-size:14px;opacity:0;pointer-events:none;transition:opacity .2s;z-index:50;max-width:88vw;text-align:center}
#toast.show{opacity:1}
.noscript{padding:24px;font-size:16px}

<script id="data" type="application/json">{"meta":{"exam":"2026-11-14T09:00:00+08:00","mock":{"n":100,"min":90,"j":20,"s":60,"m":20},"about":"题库分三类，每道题解析开头都写了出处。\n往年真题：射阳、亭湖、大丰等盐城本地事业单位和政府购买服务岗的考题，来自网上的考生回忆版和资料汇编，不是官方公布的原卷。答案经过逐题复核，个别回忆版题干可能和原题有出入。\n自产题：按公基常考点编写，覆盖法律、政治、经济、公文、人文、省情县情。\n时政：覆盖 2025 年 11 月到 2026 年 10 月的国内外大事，来源是新华网、人民网、中国政府网等官方报道。\n官方公告只写笔试科目为「综合知识」，没写题型、题量和时长，模拟考的题量和时间是按同类考试设的，以准考证为准。笔试政策咨询：射阳县人才服务中心 0515-82352565。","build":"2026-11-05 19:15"},"mods":[{"k":"law","name":"法律"},{"k":"politics","name":"政治理论"},{"k":"current","name":"时政"},{"k":"econ","name":"经济"},{"k":"mgmt","name":"管理与公文"},{"k":"culture","name":"人文科技"},{"k":"region","name":"省情县情"},{"k":"zt","name":"往年真题"},{"k":"exam","name":"考场策略"}],"qs":[{"i":1,"m":"zt","t":"s","q":"张某在商场中看中了一款价格5600元的苹果手机，这里货币执行的是（　）。","o":["价值尺度","流通手段","贮藏手段","支付手段"],"a":"A","e":"来源：2018年射阳县事业单位《公共基础知识》真题（网络汇编版）。价值尺度指货币衡量和表现一切商品价值大小的作用，表现为价格标签——标价5600元正是价值尺度。流通手段是充当交换媒介；支付手段用于清偿债务、支付租金工资；贮藏手段是退出流通保存财富。","s":"射阳2018"},{"i":2,"m":"zt","t":"s","q":"对下列农业知识的掌握有误的一项是（　）。","o":["农作物肥料的三要素是氮、磷、钾","种植棉花，苗肥要『轻』，蕾肥要『控』，花铃肥要『重』","一般小麦的亩产量高于水稻，水稻的亩产量高于玉米","美国是世界上最大的谷物生产国"],"a":"C","e":"来源：2018年射阳县事业单位《公共基础知识》真题（网络汇编版）。我国小麦一般亩产800斤左右，水稻平均亩产约1200斤，玉米亩产可超1000斤——C项颠倒了小麦与水稻的亩产关系。A、B、D均为正确表述。","s":"射阳2018"},{"i":3,"m":"zt","t":"s","q":"以下说法正确的是（　）。","o":["存在主义是十九世纪流行于西方的哲学思潮","玛雅文化以南美洲的秘鲁为中心","世界第二次工业革命的主要标志是蒸汽机的广泛使用","十八世纪欧洲启蒙运动的中心在法国"],"a":"D","e":"来源：2018年射阳县事业单位《公共基础知识》真题（网络汇编版）。存在主义兴起于20世纪；玛雅文化分布在中美洲（今墨西哥一带）；第一次工业革命标志是蒸汽机，第二次是电的广泛应用；法国是启蒙运动中心，D正确。","s":"射阳2018"},{"i":4,"m":"zt","t":"s","q":"『拔苗助长』与『庖丁解牛』这两个成语共同说明的道理是（　）。","o":["物质决定意识，意识对物质有巨大的反作用","人具有主观能动性，可以自觉地认识与创造规律","实践决定认识","发挥主观能动性必须以尊重客观规律为基础"],"a":"D","e":"来源：2018年射阳县事业单位《公共基础知识》真题（网络汇编版）。拔苗助长违背规律必然失败，庖丁解牛顺应规律游刃有余——共同说明发挥主观能动性必须以尊重客观规律为基础。规律是客观的，不能被『创造』，B错误。","s":"射阳2018"},{"i":5,"m":"zt","t":"j","q":"中国特色社会主义最本质的特征是中国共产党领导。（　）","o":["正确","错误"],"a":"A","e":"来源：2019年1月盐城市亭湖区事业单位《公共基础知识》真题（回忆版）。《宪法》第一条：中国共产党领导是中国特色社会主义最本质的特征。常考固定表述，直接背过。","s":"亭湖2019"},{"i":6,"m":"zt","t":"j","q":"进入新时代，我国经济已经由高速增长阶段转向高质量发展阶段。（　）","o":["正确","错误"],"a":"A","e":"来源：2019年1月亭湖区事业单位真题（回忆版）。党的十九大报告原文：我国经济已由高速增长阶段转向高质量发展阶段。『高速转高质量』是固定表述。","s":"亭湖2019"},{"i":7,"m":"zt","t":"j","q":"唯物主义都承认社会存在决定社会意识。（　）","o":["正确","错误"],"a":"B","e":"来源：2019年1月亭湖区事业单位真题（回忆版）。只有辩证唯物主义（含历史唯物主义）才承认社会存在决定社会意识；古代朴素、近代形而上学唯物主义在历史观上仍是唯心的。『都承认』是绝对化陷阱。","s":"亭湖2019"},{"i":8,"m":"zt","t":"j","q":"价格机制的四大功能包括信息功能、调节功能、竞争工具和分配功能。（　）","o":["正确","错误"],"a":"A","e":"来源：2019年1月亭湖区事业单位真题（回忆版）。价格机制四大功能：信息、调节、竞争工具、分配。纯记忆点。","s":"亭湖2019"},{"i":9,"m":"zt","t":"j","q":"现代企业制度的典型形式是公司制，其两种主要形式是股份有限公司和无限责任公司。（　）","o":["正确","错误"],"a":"B","e":"来源：2019年1月亭湖区事业单位真题（回忆版）。公司制的两种主要形式是有限责任公司和股份有限公司，不含无限责任公司。『有限』与『无限』之辨是高频陷阱。","s":"亭湖2019"},{"i":10,"m":"zt","t":"s","q":"物质的唯一特性是（　）。","o":["绝对性","相对性","客观实在性","科学性"],"a":"C","e":"来源：2019年1月亭湖区事业单位真题（回忆版，答案为整理者复核）。物质的唯一特性是客观实在性——列宁的物质定义。『唯一特性=客观实在性』与『根本属性=运动』要分开记。","s":"亭湖2019"},{"i":11,"m":"zt","t":"s","q":"下列属于理性认识形式的是（　）。","o":["感觉","知觉","判断","表象"],"a":"C","e":"来源：2019年1月亭湖区事业单位真题（回忆版，答案为整理者复核）。感性认识三形式：感觉、知觉、表象；理性认识三形式：概念、判断、推理。选C判断。","s":"亭湖2019"},{"i":12,"m":"zt","t":"s","q":"毛泽东在（　）中鲜明地表达了实事求是、群众路线和独立自主的根本观点。","o":["《反对本本主义》","《改造我们的学习》","《反对党八股》","《整顿党的作风》"],"a":"A","e":"来源：2019年1月亭湖区事业单位真题（回忆版，答案为整理者复核）。1930年《反对本本主义》提出『没有调查，没有发言权』，是党的思想路线（实事求是、群众路线、独立自主）的雏形。","s":"亭湖2019"},{"i":13,"m":"zt","t":"s","q":"我们党提出建设社会主义市场经济体制是在（　）。","o":["党的十一届三中全会","党的十二大","党的十四大","党的十六大"],"a":"C","e":"来源：2019年1月亭湖区事业单位真题（回忆版，答案为整理者复核）。1992年党的十四大明确提出建立社会主义市场经济体制的改革目标。","s":"亭湖2019"},{"i":14,"m":"zt","t":"s","q":"我国的政体是（　）。","o":["人民民主专政制度","人民代表大会制度","中国共产党领导的多党合作和政治协商制度","民族区域自治制度"],"a":"B","e":"来源：2019年1月亭湖区事业单位真题（回忆版，答案为整理者复核）。政体即根本政治制度＝人民代表大会制度；国体＝人民民主专政。与『根本制度＝社会主义制度』三者辨析是高频考点。","s":"亭湖2019"},{"i":15,"m":"zt","t":"s","q":"党的十九大报告指出，现阶段我国的基本国情是（　）。","o":["我国经济总量稳居世界第二位","我国是世界最大发展中国家","我国仍处于并将长期处于社会主义初级阶段","我国已经是社会主义强国"],"a":"C","e":"来源：2019年1月亭湖区事业单位真题（回忆版，答案为整理者复核）。基本国情＝仍处于并将长期处于社会主义初级阶段。两个『没有变』之一，固定表述。","s":"亭湖2019"},{"i":16,"m":"zt","t":"s","q":"下列行为中最接近于完全竞争模式的一项是（　）。","o":["飞机制造业","烟草业","日用小商品制造业","汽车制造业"],"a":"C","e":"来源：2019年1月亭湖区事业单位真题（回忆版，答案为整理者复核）。完全竞争市场的条件：厂商数量多、产品同质、进出自由、信息完全。日用小商品行业最接近；飞机、汽车是寡头/垄断竞争，烟草是国家专卖。","s":"亭湖2019"},{"i":17,"m":"zt","t":"s","q":"我国省级行政区的设立最早始于（　）。","o":["唐朝","元朝","明朝","清朝"],"a":"B","e":"来源：2019年1月亭湖区事业单位真题（回忆版，答案为整理者复核）。元朝实行行省制度，是省级行政区划的开端。","s":"亭湖2019"},{"i":18,"m":"zt","t":"j","q":"昆曲是现存的最古老的剧种之一，是我国最早被确认的非物质文化遗产。（　）","o":["正确","错误"],"a":"A","e":"来源：2020年12月盐城市亭湖区事业单位《公共基础知识》真题（回忆版，答案为整理者复核）。2001年昆曲入选联合国教科文组织首批『人类口述和非物质遗产代表作』，是我国最早入选的非遗，被称为『百戏之祖』。","s":"亭湖2020"},{"i":19,"m":"zt","t":"j","q":"规范性公文的生效日期应是公文起草完成的时间。（　）","o":["正确","错误"],"a":"B","e":"来源：2020年12月亭湖区事业单位真题（回忆版，答案为整理者复核）。公文的生效日期以成文日期（领导人签发或会议通过后确定的日期）为准，与起草完成时间无关。","s":"亭湖2020"},{"i":20,"m":"zt","t":"j","q":"哲学是人们对整个世界的总体看法和根本观点，是一种世界观，而不是方法论。（　）","o":["正确","错误"],"a":"B","e":"来源：2020年12月亭湖区事业单位真题（回忆版，答案为整理者复核）。哲学是系统化理论化的世界观，同时是世界观和方法论的统一——『而不是方法论』错。","s":"亭湖2020"},{"i":21,"m":"zt","t":"j","q":"一切行政行为都具有单方意志性，这是行政行为与民事行为的本质区别之一。（　）","o":["正确","错误"],"a":"B","e":"来源：2020年12月亭湖区事业单位真题（回忆版，答案为整理者复核）。行政行为一般具有单方意志性，但『一切』绝对化——如行政合同（双方行政行为）即需双方协商一致。见『一切/所有/必须』先想绝对化陷阱。","s":"亭湖2020"},{"i":22,"m":"zt","t":"j","q":"民法典是新中国第一部以『法典』命名的法律。（　）","o":["正确","错误"],"a":"A","e":"来源：2020年12月亭湖区事业单位真题（回忆版，答案为整理者复核）。2020年通过的《中华人民共和国民法典》是新中国第一部以『法典』命名的法律，2021年1月1日施行。固定表述。","s":"亭湖2020"},{"i":23,"m":"zt","t":"j","q":"我国宋朝科学家沈括认为地球是一个圆球，『天体圆如弹丸，地如鸡中黄』，提出了『浑天说』。（　）","o":["正确","错误"],"a":"B","e":"来源：2020年12月亭湖区事业单位真题（回忆版，答案为整理者复核）。『浑天如鸡子，地如鸡中黄』出自东汉张衡的浑天说；沈括是北宋《梦溪笔谈》作者，『浑天说』不是他提出的。张衡＝浑天说，这题就是考人物对应。","s":"亭湖2020"},{"i":24,"m":"zt","t":"j","q":"中国共产党领导的多党合作制不是一党制而是多党制。（　）","o":["正确","错误"],"a":"B","e":"来源：2020年12月亭湖区事业单位真题（回忆版，答案为整理者复核）。中国共产党领导的多党合作和政治协商制度既不是一党制，也不是西方竞争型的多党制，是中国特色的新型政党制度。『不是A就是B』的二选一陷阱。","s":"亭湖2020"},{"i":25,"m":"zt","t":"j","q":"突发事件预警级别分为Ⅰ、Ⅱ、Ⅲ、Ⅳ级，依次用红、橙、黄、蓝表示。（　）","o":["正确","错误"],"a":"A","e":"来源：2020年12月亭湖区事业单位真题（回忆版，答案为整理者复核）。预警级别：一级（Ⅰ）最严重用红色，之后依次橙、黄、蓝。口诀『红橙黄蓝，级高色深』。","s":"亭湖2020"},{"i":26,"m":"zt","t":"m","q":"突发公共事件包括（　）。（多选）","o":["自然灾害","事故灾难","公共卫生事件","社会安全事件"],"a":"ABCD","e":"来源：2020年12月亭湖区事业单位真题（回忆版，答案为整理者复核）。《突发事件应对法》四分类：自然灾害、事故灾难、公共卫生事件、社会安全事件——全选，四类必背。","s":"亭湖2020"},{"i":27,"m":"zt","t":"m","q":"新型工农城乡关系的特征是（　）。（多选）","o":["工农互促","城乡互补","协调发展","共同繁荣"],"a":"ABCD","e":"来源：2020年12月亭湖区事业单位真题（回忆版，答案为整理者复核）。十六字固定搭配：工农互促、城乡互补、协调发展、共同繁荣。全选。","s":"亭湖2020"},{"i":28,"m":"zt","t":"m","q":"习近平总书记曾引用『子钓而不纲，弋不射宿』强调生态环境的重要性。以下与这句古语表达理念相同的是（　）。（多选）","o":["不夭其生，不绝其长也","竭泽而渔，岂不得鱼，而明年无鱼","斧斤以时入山林，林木不可胜用也","天之于民厚矣！殖五谷，生鱼鸟，以为之用"],"a":"AC","e":"来源：2020年12月亭湖区事业单位真题（回忆版，答案为整理者复核）。『钓而不纲』指取之有度、用之有节。A（不灭绝其生长）与C（按时令砍伐）同义；B『竭泽而渔』是反面案例；D讲上天厚待民众，与生态取之有度无关。","s":"亭湖2020"},{"i":29,"m":"zt","t":"m","q":"下列属于政府购买服务岗位人员应当履行的义务的有（　）。（多选）","o":["遵守国家法律法规，遵守单位规章制度","恪守职业道德，遵守工作纪律","认真履行岗位职责，按时完成工作任务","保守工作中知悉的国家秘密、工作秘密和服务对象个人隐私"],"a":"ABCD","e":"来源：2025年政府购买服务岗位招聘真题汇编（网络版）。四项均属于购买服务岗位人员的法定义务和岗位要求，全选。这类『岗位义务』题在购买服务岗笔试中出现率高。","s":"购买服务岗汇编"},{"i":30,"m":"zt","t":"m","q":"根据《政府购买服务管理办法》，下列属于政府购买服务应当遵循的原则的有（　）。（多选）","o":["优先购买有利于提升公共服务效能、保障改善民生的服务","坚持公开、公平、公正原则","坚持以事定费、按效付费","坚持政府主导、社会参与、市场运作"],"a":"ABCD","e":"来源：2025年政府购买服务岗位招聘真题汇编（网络版）。《政府购买服务管理办法》第三条规定的原则，四项均符合，全选。","s":"购买服务岗汇编"},{"i":31,"m":"zt","t":"m","q":"下列属于我国公民基本权利的有（　）。（多选）","o":["选举权和被选举权","言论、出版、集会、结社、游行、示威的自由","宗教信仰自由","人身自由不受侵犯"],"a":"ABCD","e":"来源：2025年政府购买服务岗位招聘真题汇编（网络版）。四项均属《宪法》规定的公民基本权利，全选。可与本库法律模块『公民基本权利』题对照二刷。","s":"购买服务岗汇编"},{"i":32,"m":"zt","t":"m","q":"下列属于政务公开的内容的有（　）。（多选）","o":["办理行政许可和其他对外管理服务事项的依据、条件、程序","财政预算、决算信息","行政事业性收费项目及其依据、标准","涉及商业秘密的企业信息"],"a":"ABC","e":"来源：2025年政府购买服务岗位招聘真题汇编（网络版）。《政府信息公开条例》规定不得公开涉及国家秘密、商业秘密、个人隐私的政府信息，D不属于法定公开内容，ABC均属。","s":"购买服务岗汇编"},{"i":33,"m":"zt","t":"m","q":"政府购买服务岗位的服务领域主要包括（　）。（多选）","o":["公共教育、劳动就业、社会保险、医疗卫生","养老服务、社会救助、优抚安置、残疾人服务","公共安全、城市维护、社区事务、公益服务","行政执法、涉密服务、决策制定"],"a":"ABC","e":"来源：2025年政府购买服务岗位招聘真题汇编（网络版）。D属于政府购买服务负面清单内容（行政执法、涉密事项不得购买），ABC均属允许购买的公共服务领域。『负面清单』是购买服务岗高频考点。","s":"购买服务岗汇编"},{"i":34,"m":"zt","t":"m","q":"下列属于基层治理工作中『七有』要求的有（　）。（多选）","o":["幼有所育、学有所教","劳有所得、病有所医","老有所养、住有所居","弱有所扶"],"a":"ABCD","e":"来源：2025年政府购买服务岗位招聘真题汇编（网络版）。『七有』=幼有所育、学有所教、劳有所得、病有所医、老有所养、住有所居、弱有所扶，全选。民生领域固定表述，直接背。","s":"购买服务岗汇编"},{"i":35,"m":"zt","t":"m","q":"根据《政府购买服务管理办法》，下列属于政府购买服务承接主体应当具备的条件的有（　）。（多选）","o":["依法设立，具有独立承担民事责任的能力","具有良好的商业信誉和健全的财务会计制度","具有履行合同所必需的设备和专业技术能力","前三年内无重大违法经营记录"],"a":"ABCD","e":"来源：2025年政府购买服务岗位招聘真题汇编（网络版）。四项均为《政府采购法》及《政府购买服务管理办法》规定的承接主体必备条件，全选。","s":"购买服务岗汇编"},{"i":36,"m":"zt","t":"m","q":"下列事项不得纳入政府购买服务范围的有（　）。（多选）","o":["属于政府履职核心的行政决策、行政执法事项","应当由政府直接提供的涉密服务","公益一类事业单位承担的基本公共服务事项","物业管理、后勤保障等辅助性服务"],"a":"ABC","e":"来源：2025年政府购买服务岗位招聘真题汇编（网络版）。ABC均为禁止纳入购买服务范围的事项；D属于可以购买的机关运行辅助性服务。注意别把『可以买的辅助服务』也圈进去。","s":"购买服务岗汇编"},{"i":37,"m":"zt","t":"m","q":"政府购买服务岗位工作人员的下列行为，属于违反岗位纪律的有（　）。（多选）","o":["擅自泄露服务对象的个人隐私信息","在服务过程中接受服务对象赠送的礼品礼金","按照服务规范为特殊困难群体提供上门服务","无故迟到早退，擅自脱岗离岗"],"a":"ABD","e":"来源：2025年政府购买服务岗位招聘真题汇编（网络版）。C是符合岗位要求的正常服务行为；泄露隐私、收受礼金、脱岗离岗均违纪。选ABD。","s":"购买服务岗汇编"},{"i":38,"m":"zt","t":"m","q":"下列属于公文处理应当坚持的原则的有（　）。（多选）","o":["实事求是","准确规范","精简高效","安全保密"],"a":"ABCD","e":"来源：2025年政府购买服务岗位招聘真题汇编（网络版）。《党政机关公文处理工作条例》规定公文处理坚持实事求是、准确规范、精简高效、安全保密的原则，全选。","s":"购买服务岗汇编"},{"i":39,"m":"zt","t":"m","q":"政府购买服务公共服务类岗位的绩效考核结果可以作为以下哪些工作的依据？（　）（多选）","o":["服务费用结算","承接主体合同续签","岗位工作人员薪酬调整","后续购买服务项目立项参考"],"a":"ABCD","e":"来源：2025年政府购买服务岗位招聘真题汇编（网络版）。考核结果与费用结算、合同续签、薪酬调整、项目立项直接挂钩，四项均对，全选。","s":"购买服务岗汇编"},{"i":40,"m":"zt","t":"j","q":"政府购买服务岗位属于事业单位编制，享受与在编人员同等的待遇。（　）","o":["正确","错误"],"a":"B","e":"来源：2025年政府购买服务岗位招聘真题汇编（网络版）。政府购买服务岗位属于合同制用工，无事业单位编制，待遇按劳动合同约定执行——这与本次报考岗位性质一致，理解自己的岗位是送分点。","s":"购买服务岗汇编"},{"i":41,"m":"zt","t":"j","q":"购买主体可以根据实际需求，要求承接主体在合同约定范围外提供免费服务。（　）","o":["正确","错误"],"a":"B","e":"来源：2025年政府购买服务岗位招聘真题汇编（网络版）。合同是双方履约的法定依据，超出合同约定需签订补充协议并支付相应费用，不得要求免费提供额外服务。","s":"购买服务岗汇编"},{"i":42,"m":"zt","t":"s","q":"关于公告和通告的区别，说法错误的是（　）。","o":["公告的告启面广；通告的告启面相对较窄，只是面向『一定范围内的』有关单位和人员","公告通常是宣布某些重大事项时才用，通告则适用于各级行政机关和企事业单位","公告要标出单位或事由；通告标题一般标发文机关和文种","公告用于向国内外宣布重要事项或者法定事项；通告是在一定范围内遵守或周知的事项"],"a":"C","e":"来源：2022年盐城大丰事业单位招聘考试《公共基础知识》试题（人人文库网络汇编版）。《党政机关公文处理工作条例》：公告适用于向国内外宣布重要事项或者法定事项；通告适用于在一定范围内公布应当遵守或者周知的事项。C项把两者的标题写法说反了：公告标题一般标发文机关和文种（或只标文种），通告标题可以标出单位或事由。","s":"大丰2022"},{"i":43,"m":"zt","t":"s","q":"我国夏季『早穿棉袄午穿纱，围着火炉吃西瓜』的地区是（　）。","o":["西北内陆","东南沿海","云贵高原","东北平原"],"a":"A","e":"来源：2022年盐城大丰事业单位招聘考试《公共基础知识》试题（人人文库网络汇编版）。这句话说的是西北内陆（如新疆吐鲁番）的温带大陆性气候，昼夜温差大。","s":"大丰2022"},{"i":44,"m":"zt","t":"s","q":"『射人先射马，擒贼先擒王』『牵牛要牵牛鼻子』体现的哲理是（　）。","o":["抓主要矛盾","抓主要矛盾的主要方面","抓次要矛盾","抓次要矛盾的主要方面"],"a":"A","e":"来源：2022年盐城大丰事业单位招聘考试《公共基础知识》试题（人人文库网络汇编版）。主要矛盾在事物发展中处于支配地位、起决定作用。『先擒王』『牵牛鼻子』说的是抓重点、抓关键，也就是抓主要矛盾。","s":"大丰2022"},{"i":45,"m":"zt","t":"s","q":"在国家行政职能中，最为核心的基本职能是（　）。","o":["政治职能","领导职能","经济职能","教育职能"],"a":"A","e":"来源：2022年盐城大丰事业单位招聘考试《公共基础知识》试题（人人文库网络汇编版）。政治职能（统治职能）由国家性质决定，对外保卫国家安全、对内维持社会秩序，阶级性最鲜明，是最核心的基本职能。","s":"大丰2022"},{"i":46,"m":"zt","t":"s","q":"实现社会经济可持续发展的关键是（　）。","o":["速度、比例和效率的统一","经济发展与人口、资源、环境的统一","科技、教育为经济建设服务","大力发展第三产业"],"a":"B","e":"来源：2022年盐城大丰事业单位招聘考试《公共基础知识》试题（人人文库网络汇编版）。可持续发展要求既满足当代人需要，又不损害后代人满足需要的能力，核心是经济发展与人口、资源、环境相协调。","s":"大丰2022"},{"i":47,"m":"zt","t":"s","q":"第二次鸦片战争后，西方国家控制中国的海关管理权，其影响不包括（　）。","o":["便利了列强对中国的经济掠夺","阻碍了中国近代资本主义的发展","加速了中国自然经济的解体过程","资本输出成为对华侵略的主要手段"],"a":"D","e":"来源：2022年盐城大丰事业单位招聘考试《公共基础知识》试题（人人文库网络汇编版）。资本输出成为列强对华侵略的主要手段，是1895年《马关条约》（允许日本在通商口岸开设工厂）之后的事，不是第二次鸦片战争的影响。","s":"大丰2022"},{"i":48,"m":"zt","t":"s","q":"下列不能体现我国公有制主体地位的是（　）。","o":["公有资产在社会总资产中占优势","国有经济控制国民经济命脉","深化公有制体制改革","国有经济对经济发展起主导作用"],"a":"C","e":"来源：2022年盐城大丰事业单位招聘考试《公共基础知识》试题（人人文库网络汇编版）。公有制主体地位体现在两方面：公有资产在社会总资产中占优势；国有经济控制国民经济命脉，对经济发展起主导作用。『深化改革』是举措，不是主体地位的体现。","s":"大丰2022"},{"i":49,"m":"zt","t":"s","q":"城镇化是现代化的必由之路，解决好人的问题是推进城镇化的关键。当前，我国实现城镇化的首要任务是（　）。","o":["推进农业转移人口市民化","使土地的城镇化先于人口的城镇化","促进农村劳动力向非农产业的转移","实现『人的无差别发展』"],"a":"A","e":"来源：2022年盐城大丰事业单位招聘考试《公共基础知识》试题（人人文库网络汇编版）。新型城镇化以人为核心，首要任务是有序推进农业转移人口市民化。","s":"大丰2022"},{"i":50,"m":"zt","t":"s","q":"国家权力通过制定公共政策来履行其政治统治和社会管理职能，因此公共政策在总体上是（　）的体现。","o":["阶级压迫","国家意志","集体智慧","公共利益"],"a":"B","e":"来源：2022年盐城大丰事业单位招聘考试《公共基础知识》试题（人人文库网络汇编版）。公共政策具有政治性、权威性和强制性，以国家强制力为后盾贯彻实施，总体上是国家意志的体现。","s":"大丰2022"},{"i":51,"m":"zt","t":"s","q":"因其在决策理论方面的贡献，1978年荣获诺贝尔奖的科学家是（　）。","o":["古利克","孔茨","维纳","西蒙"],"a":"D","e":"来源：2022年盐城大丰事业单位招聘考试《公共基础知识》试题（人人文库网络汇编版）。赫伯特·西蒙提出『管理就是决策』，1978年获诺贝尔经济学奖。古利克提出POSDCORB七职能；孔茨是管理过程学派代表；维纳是控制论创始人。","s":"大丰2022"},{"i":52,"m":"zt","t":"s","q":"双因素理论认为引起人们工作动机的因素主要有两个：一是激励因素，二是（　）。","o":["满足因素","保健因素","安全因素","舒适因素"],"a":"B","e":"来源：2022年盐城大丰事业单位招聘考试《公共基础知识》试题（人人文库网络汇编版）。赫茨伯格双因素理论把因素分为激励因素（工作本身、认可、成就、责任）和保健因素（公司政策、监督、薪水、工作条件、人际关系）。","s":"大丰2022"},{"i":53,"m":"zt","t":"s","q":"辩证唯物主义主张从客观实际出发，遵从客观规律，其所提及的规律是指（　）。","o":["人们已经掌握并能够自觉运用的事物的内在本质","在事物之间相互作用中表现出的特殊属性","事物以及现象之间的内在的、本质的、必然的联系","宇宙中发生的不以人的意志为转移的一切变化和过程"],"a":"C","e":"来源：2022年盐城大丰事业单位招聘考试《公共基础知识》试题（人人文库网络汇编版）。规律是事物和现象之间内在的、本质的、必然的联系，具有客观性。A项把规律限定为『已经掌握的』，这是错的，规律不论是否被认识都存在。","s":"大丰2022"},{"i":54,"m":"zt","t":"s","q":"第一次把圆周率精确到小数点后7位数的科学家是（　）。","o":["毕达哥拉斯","亚里士多德","牛顿","祖冲之"],"a":"D","e":"来源：2022年盐城大丰事业单位招聘考试《公共基础知识》试题（人人文库网络汇编版）。南朝祖冲之把圆周率推算到3.1415926与3.1415927之间，著有《缀术》。","s":"大丰2022"},{"i":55,"m":"zt","t":"s","q":"下列行为中不属于行政行为的是（　）。","o":["某国家机关为建住宅楼与某建筑公司签订建筑工程承包合同","某县技术监督局对所辖境内某化工厂生产国家明令淘汰的产品的行为予以处罚","国家知识产权局专利复审委员会根据利害关系人申请，宣告某专利权无效","工商行政管理机关为符合条件的企业颁发营业执照"],"a":"A","e":"来源：2022年盐城大丰事业单位招聘考试《公共基础知识》试题（人人文库网络汇编版）。行政行为必须是行政主体运用行政职权、产生法律效果的行为。机关为盖住宅楼签建筑合同，是以民事主体身份订立民事合同，不属于行政行为。原题用的是旧机构名称：技术监督局、工商行政管理机关现已并入市场监督管理部门，专利复审委员会现为国家知识产权局专利局复审和无效审理部，答案不受影响。","s":"大丰2022"},{"i":56,"m":"zt","t":"s","q":"下列不属于战术决策的特征的是（　）。","o":["阶段性","局部性","方向性","区域性"],"a":"C","e":"来源：2022年盐城大丰事业单位招聘考试《公共基础知识》试题（人人文库网络汇编版）。战术决策是为实现战略决策、解决具体问题而做的决策，具有微观性、局部性、区域性、阶段性。方向性、全局性属于战略决策。","s":"大丰2022"},{"i":57,"m":"zt","t":"s","q":"神权制国家行政决策体制的类型属于（　）。","o":["君主亲政型","军人独裁型","皇帝独裁型","宗教领袖型"],"a":"D","e":"来源：2022年盐城大丰事业单位招聘考试《公共基础知识》试题（人人文库网络汇编版）。神权制国家由宗教领袖居于行政决策中枢，属于宗教领袖型。","s":"大丰2022"},{"i":58,"m":"zt","t":"s","q":"下列说法不正确的是（　）。","o":["甲村享有选举权的村民有500人，其中200人参与了村委会主任选举，候选人张某获得120票，因而当选","乙村享有选举权的村民有500人，在村委会选举中，李某获得300票，因而当选","丙村在村委会选举中，设立了秘密写票处","丁村村民胡某在村委会选举期间不能参加投票，书面委托其享有选举权的父亲代为投票"],"a":"A","e":"来源：2022年盐城大丰事业单位招聘考试《公共基础知识》试题（人人文库网络汇编版）。《村民委员会组织法》：登记参加选举的村民过半数投票，选举有效；候选人获得参加投票的村民过半数的选票，始得当选；选举时应设秘密写票处；外出不能投票的可书面委托本村有选举权的近亲属代投。甲村500人只有200人投票，不过半，选举无效。","s":"大丰2022"},{"i":59,"m":"zt","t":"s","q":"公共管理的手段是多种多样的，但最基本的手段是（　）。","o":["制定和执行公共政策","制定和执行法律法规","实施具体的公共项目","维护基本公共利益"],"a":"A","e":"来源：2022年盐城大丰事业单位招聘考试《公共基础知识》试题（人人文库网络汇编版）。公共管理主要通过大量公共政策的制定与执行来实现，这是它最基本的手段。","s":"大丰2022"},{"i":60,"m":"zt","t":"s","q":"由商品的价格变动所引起的商品相对价格的变动，进而由商品的相对价格变动所引起的商品需求量的变动，称为（　）。","o":["挤出效应","替代效应","收入效应","外部效应"],"a":"B","e":"来源：2022年盐城大丰事业单位招聘考试《公共基础知识》试题（人人文库网络汇编版）。价格变动的总效应分为替代效应和收入效应：通过『相对价格』变化引起的是替代效应，通过『实际收入』变化引起的是收入效应。","s":"大丰2022"},{"i":61,"m":"zt","t":"s","q":"（　）是一切道德的基础和根本，是人之为人最重要的品德，是一个社会赖以生存和发展的基石。","o":["教育","科学","诚信","学习"],"a":"C","e":"来源：2022年盐城大丰事业单位招聘考试《公共基础知识》试题（人人文库网络汇编版）。诚信是一切道德的基础和根本。教育、科学、学习都不属于品德。","s":"大丰2022"},{"i":62,"m":"zt","t":"s","q":"中国是世界上最早发明瓷器的国家。下列对我国古代制瓷业的表述正确的是（　）。","o":["我国制瓷业的出现是在春秋战国时期","制瓷业在宋朝时成为独立生产部门","我国在南北朝时期开始出现成熟的瓷器","清朝时期创造了中外闻名的珐琅彩"],"a":"D","e":"来源：2022年盐城大丰事业单位招聘考试《公共基础知识》试题（人人文库网络汇编版）。商朝出现原始瓷；东汉烧成成熟青瓷，南北朝烧成成熟白瓷；唐代制瓷业成为独立生产部门（南青北白）；清康熙年间创烧珐琅彩，D正确。","s":"大丰2022"},{"i":63,"m":"zt","t":"s","q":"下列属于客观唯心主义观点的是（　）。","o":["经验不光是知识，经验乃我对付物，物对付我的法子","我思故我在","感觉世界是『理念』世界的摹本或影子","存在就是被感知"],"a":"C","e":"来源：2022年盐城大丰事业单位招聘考试《公共基础知识》试题（人人文库网络汇编版）。柏拉图把『理念』这种客观精神当作世界本原，属于客观唯心主义。A（胡适实用主义）、B（笛卡尔）、D（贝克莱）都把主观精神当本原，属于主观唯心主义。","s":"大丰2022"},{"i":64,"m":"zt","t":"s","q":"经济关系市场化要求要有完备的（　）。","o":["商品市场","技术市场","劳动力市场","市场体系"],"a":"D","e":"来源：2022年盐城大丰事业单位招聘考试《公共基础知识》试题（人人文库网络汇编版）。市场经济的基本特征之一是市场体系完备化，即形成统一、开放、竞争、有序的市场体系，单一市场不够。","s":"大丰2022"},{"i":65,"m":"zt","t":"s","q":"以下不属于管理者职能的是（　）。","o":["计划职能","组织职能","控制职能","创新职能"],"a":"D","e":"来源：2022年盐城大丰事业单位招聘考试《公共基础知识》试题（人人文库网络汇编版）。本题按管理的经典四职能（计划、组织、领导、控制）口径作答。部分教材（如周三多《管理学》）把创新列为第五职能，考试遇到时以题目给出的口径为准。","s":"大丰2022"},{"i":66,"m":"zt","t":"s","q":"下列不属于治安管理处罚的是（　）。","o":["警告","拘役","罚款","行政拘留"],"a":"B","e":"来源：2022年盐城大丰事业单位招聘考试《公共基础知识》试题（人人文库网络汇编版）。《治安管理处罚法》规定的处罚种类有警告、罚款、行政拘留、吊销公安机关发放的许可证（对外国人可附加限期出境或驱逐出境）。拘役是《刑法》规定的刑罚（主刑），不是行政处罚。该法已于2025年修订，处罚种类不变，条文序号以修订后文本为准。","s":"大丰2022"},{"i":67,"m":"zt","t":"s","q":"固定成本是指成本总额在（　），不受业务量增减变动影响而保持不变的成本。","o":["任何情况下","一定业务量范围内","一定时期内","一定时期和一定业务量范围内"],"a":"D","e":"来源：2022年盐城大丰事业单位招聘考试《公共基础知识》试题（人人文库网络汇编版）。固定成本的『固定』是相对的，只在一定时期和一定业务量范围内保持不变，如厂房折旧、房租、管理人员工资。","s":"大丰2022"},{"i":68,"m":"zt","t":"s","q":"在行政信息管理活动中，明确行政信息管理的主体、职能配置及其运行机制，主要是解决（　）的问题。","o":["『谁来管』","『管什么』","『怎么管』","『管的效果如何』"],"a":"A","e":"来源：2022年盐城大丰事业单位招聘考试《公共基础知识》试题（人人文库网络汇编版）。建立行政信息管理体制，即明确主体、职能配置和运行机制，解决『谁来管』；制定法律法规和政策，解决『如何管』。","s":"大丰2022"},{"i":69,"m":"zt","t":"s","q":"职能型组织结构的特点是（　）。","o":["能适应灵活多变的经营环境","管理集中，指挥统一","常表现为独立的企业联合体","有助于管理工作的分工与专业化"],"a":"D","e":"来源：2022年盐城大丰事业单位招聘考试《公共基础知识》试题（人人文库网络汇编版）。职能型结构按职能分工实行专业化管理，优点是分工专业化；缺点是多头领导、指挥不统一，所以B不对。","s":"大丰2022"},{"i":70,"m":"zt","t":"s","q":"日界线又称『国际日期变更线』。以下关于它的说法正确的是（　）。","o":["从东到西越过该线，日期增加一天","从东到西越过该线，日期减少一天","该线是按地球表面经度线确定的","该线是按地球表面纬度线确定的"],"a":"A","e":"来源：2022年盐城大丰事业单位招聘考试《公共基础知识》试题（人人文库网络汇编版）。日界线大致沿180°经线，但为了不穿过陆地国家是一条折线，所以C、D错。从东向西越过日期加一天，从西向东越过日期减一天。","s":"大丰2022"},{"i":71,"m":"zt","t":"s","q":"我国法律规定，债权人领取提存物的权利，自标的物被提存之日起5年内不行使而消灭。该5年的期间属于（　）。","o":["普通诉讼时效期间","长期诉讼时效期间","除斥期间","取得时效期间"],"a":"C","e":"来源：2022年盐城大丰事业单位招聘考试《公共基础知识》试题（人人文库网络汇编版）。现行依据是《民法典》第574条第2款。期间届满后消灭的是领取提存物这一实体权利本身，不是胜诉权，所以属于除斥期间。诉讼时效届满只产生抗辩权，权利本身不消灭。","s":"大丰2022"},{"i":72,"m":"zt","t":"s","q":"个人依据一定的道德原则规范行动时所表现出来的稳定的倾向和特征，称为（　）。","o":["社会公德","个人品德","职业道德","家庭美德"],"a":"B","e":"来源：2022年盐城大丰事业单位招聘考试《公共基础知识》试题（人人文库网络汇编版）。题干是个人品德的定义。社会公德、职业道德、家庭美德是分别针对公共生活、职业活动、家庭生活的规范。","s":"大丰2022"},{"i":73,"m":"zt","t":"s","q":"有关女性在公务活动中的站姿、坐姿，下列表述错误的是（　）。","o":["站姿要求头正、肩平、臂垂、躯挺、腿并，两脚尖外展成45度夹角","标准坐姿要求上身挺直、双肩正平","两臂自然弯曲，两手自然放在两腿或扶手上","两膝并拢，小腿垂直落于地面，两脚尖朝正前方"],"a":"C","e":"来源：2022年盐城大丰事业单位招聘考试《公共基础知识》试题（人人文库网络汇编版）。女性标准坐姿要求两手交叉叠放在两腿中部、靠近小腹；『两手自然放在两腿或扶手上』是男性坐姿要求。","s":"大丰2022"},{"i":74,"m":"zt","t":"s","q":"甲乙双方常年签订收购『当季大米』的合同，今年签订合同时双方一时疏忽，在合同中写下的是『收购大米』。恰巧今年当季大米价格上涨，甲方不愿出卖，故以陈年大米交货。对此，甲方违反了（　）。","o":["自愿原则","诚实信用原则","平等原则","公平原则"],"a":"B","e":"来源：2022年盐城大丰事业单位招聘考试《公共基础知识》试题（人人文库网络汇编版）。《民法典》第7条：民事主体从事民事活动应当遵循诚信原则，秉持诚实，恪守承诺。双方按交易习惯都清楚收购的是当季大米，甲方利用合同疏漏以陈米交货，违反诚信原则。","s":"大丰2022"},{"i":75,"m":"zt","t":"s","q":"古人云：『不谋全局者，不足以谋一域；不谋万世者，不足以谋一时。』这告诉我们（　）。","o":["事物的联系是普遍的、客观的、无条件的","事物的发展变化是内因和外因共同作用的结果","在认识事物和处理问题时必须学会从整体上把握事物的联系","必须重视各个局部的作用"],"a":"C","e":"来源：2022年盐城大丰事业单位招聘考试《公共基础知识》试题（人人文库网络汇编版）。这句话强调整体统率部分，要树立全局观念、立足整体。A项错在『无条件』，联系是有条件的；B、D与题意无关。","s":"大丰2022"},{"i":76,"m":"zt","t":"s","q":"哲学是（　）。","o":["系统化和理论化的世界观","自然界的知识体系","包括社会和人的精神世界在内的世界观","自发的世界观"],"a":"A","e":"来源：2022年盐城大丰事业单位招聘考试《公共基础知识》试题（人人文库网络汇编版）。人人都有世界观，但只有经过系统阐发和逻辑论证的世界观才叫哲学。哲学是系统化、理论化的世界观。","s":"大丰2022"},{"i":77,"m":"zt","t":"m","q":"『率先基本实现现代化，必须坚持因地制宜、分类指导。』这句话体现的哲理有（　）。","o":["一切从实际出发","矛盾特殊性原理","矛盾普遍性原理","具体问题具体分析"],"a":"ABD","e":"来源：2022年盐城大丰事业单位招聘考试《公共基础知识》试题（人人文库网络汇编版）。因地制宜体现一切从实际出发；分类指导体现矛盾特殊性和具体问题具体分析。题干没有讲矛盾的普遍性。","s":"大丰2022"},{"i":78,"m":"zt","t":"m","q":"『法律必须被信仰，否则等于形同虚设。』这句话表明一个人只有从内心深处真正认同、信任和信仰法律，才会自觉维护法律的权威。由此可知（　）。","o":["法律的内在说服力是法律权威的内在基础","法律权威不可能完全建立在外在强制力的基础之上","法律信仰与宗教信仰没有本质的区别","法律信仰是法律制定和执行的根本依据"],"a":"AB","e":"来源：2022年盐城大丰事业单位招聘考试《公共基础知识》试题（人人文库网络汇编版）。法律权威的树立靠外在强制力（外在条件）和内在说服力（内在基础），只靠强制力不能形成真正的权威。法律信仰与宗教信仰有本质区别，C错；法律信仰不是立法、执法的根本依据，D错。","s":"大丰2022"},{"i":79,"m":"zt","t":"m","q":"聘任制的优点是（　）。","o":["破除行政领导职务终身制","有利于人才交流","适用于各级政府组成人员的产生","适用于专业技术职务和基层行政职务的产生"],"a":"ABD","e":"来源：2022年盐城大丰事业单位招聘考试《公共基础知识》试题（人人文库网络汇编版）。各级政府组成人员由人大选举或决定产生，适用选任制，C错。","s":"大丰2022"},{"i":80,"m":"zt","t":"m","q":"新公共管理运动的主要观点包括（　）。","o":["注重管理、绩效评估和效率","公共服务代理化","在公共部门，特别是政府部门引入竞争机制并削减成本","强调产出控制而非过程控制"],"a":"ABCD","e":"来源：2022年盐城大丰事业单位招聘考试《公共基础知识》试题（人人文库网络汇编版）。新公共管理的主张：重管理、绩效与效率；公共服务代理化；引入竞争与合同外包；削减成本；强调产出控制而非过程控制。四项全选。","s":"大丰2022"},{"i":81,"m":"zt","t":"m","q":"理性认识的形式包括（　）。","o":["表象","概念","判断","推理"],"a":"BCD","e":"来源：2022年盐城大丰事业单位招聘考试《公共基础知识》试题（人人文库网络汇编版）。理性认识的形式是概念、判断、推理；感性认识的形式是感觉、知觉、表象。已有题库里的亭湖2019题是同一考点的单选版，这里是多选版。","s":"大丰2022"},{"i":82,"m":"zt","t":"m","q":"隋唐是中国绘画的高峰时期，其代表人物及作品有（　）。","o":["展子虔《游春图》","吴道子《送子天王图》","阎立本《步辇图》","郑板桥《墨兰图》"],"a":"ABC","e":"来源：2022年盐城大丰事业单位招聘考试《公共基础知识》试题（人人文库网络汇编版）。展子虔是隋代画家，吴道子、阎立本是唐代画家。郑板桥是清代『扬州八怪』之一，《墨兰图》是元初郑思肖的作品，D错。","s":"大丰2022"},{"i":83,"m":"zt","t":"m","q":"在行政管理中运用效益原理，必须正确处理好（　）。","o":["间接效益与个人发展目标的关系","整体效益与局部效益的关系","直接效益与整个社会目标的关系","长远效益与当前效益的关系"],"a":"BCD","e":"来源：2022年盐城大丰事业单位招聘考试《公共基础知识》试题（人人文库网络汇编版）。运用效益原理要处理好三对关系：整体与局部、直接效益与社会目标、长远与当前。A项是生造的。","s":"大丰2022"},{"i":84,"m":"zt","t":"m","q":"法律关系构成的要素为（　）。","o":["主体","客体","法律法规","权利和义务"],"a":"ABD","e":"来源：2022年盐城大丰事业单位招聘考试《公共基础知识》试题（人人文库网络汇编版）。法律关系三要素：主体、客体、内容（权利和义务）。法律法规是法律关系产生的前提，不是构成要素。","s":"大丰2022"},{"i":85,"m":"zt","t":"s","q":"在社会公共生活中提倡（　）精神，是社会主义道德建设的核心和原则在公共生活领域的体现，也是社会主义人道主义的基本要求。","o":["敬业奉献","助人为乐","爱岗敬业","文明礼貌"],"a":"B","e":"来源：射阳事业编招聘2022年考试《公共基础知识》真题（人人文库网络汇编版；预览页只有题干，答案由整理者复核）。这是思想道德修养教材原话：在社会公共生活中提倡助人为乐精神，是社会主义道德建设的核心（为人民服务）和原则（集体主义）在公共生活领域的体现。敬业奉献、爱岗敬业属于职业道德。","s":"射阳2022"},{"i":86,"m":"zt","t":"s","q":"『静者，动之静也』的观点是（　）。","o":["否认静止的相对性","否认运动的绝对性","认为静止是不存在的","认为静止是运动的特殊状态"],"a":"D","e":"来源：射阳事业编招聘2022年考试《公共基础知识》真题（人人文库网络汇编版；预览页只有题干，答案由整理者复核，原文『肯定性』按通行表述还原为『绝对性』）。这句话认为静止是运动中的静止，即静止是运动的一种特殊状态，坚持了运动的绝对性和静止的相对性。","s":"射阳2022"},{"i":87,"m":"zt","t":"s","q":"中国将始终不渝走（　）道路，这是中国政府和人民根据时代发展潮流和自身根本利益作出的战略选择。","o":["和平发展","民主法制","以经济建设为中心","加强国防建设"],"a":"A","e":"来源：射阳事业编招聘2022年考试《公共基础知识》真题（人人文库网络汇编版；预览页只有题干，答案由整理者复核）。出自《中国的和平发展》白皮书：走和平发展道路，是中国政府和人民根据时代发展潮流和自身根本利益作出的战略抉择。","s":"射阳2022"},{"i":88,"m":"zt","t":"s","q":"20世纪80年代，我国为促进科技发展而采取的措施不包括（　）。","o":["制定『863计划』","制定『星火计划』","制定『火炬计划』","提出『科教兴国』战略"],"a":"D","e":"来源：射阳事业编招聘2022年考试《公共基础知识》真题（人人文库网络汇编版；预览页只有题干，答案由整理者复核，原文『方案』按通行表述还原为『计划』）。863计划（1986年3月）、星火计划（1986年）、火炬计划（1988年）都在80年代；科教兴国战略是1995年提出的。","s":"射阳2022"},{"i":89,"m":"zt","t":"s","q":"『追求真理比占有真理更可贵。』德国诗人莱辛的这一著名诗句所包含的哲理是（　）。","o":["认识经历着从感性认识到理性认识的发展","认识的根本任务是透过现象认识本质","认识不能停滞，而应当不断扩展和深化","改造世界比认识世界更重要"],"a":"C","e":"来源：射阳事业编招聘2022年考试《公共基础知识》真题（人人文库网络汇编版；预览页只有题干，答案由整理者复核）。『追求』强调认识是不断发展的过程，真理是具体的、有条件的，要在实践中不断检验和发展，所以认识不能停滞。","s":"射阳2022"},{"i":90,"m":"zt","t":"s","q":"对于同一棵古树，植物学家考察它的生长习性，把古树坚韧的生命力看作是美；木材商考虑它的木质和树围，把古树的实用价值看作是美；画家则赞叹它奇特的形状，把古树的形态看作是美。上述审美感受的差异表明（　）。","o":["人的认识具有主观随意性","认识对象是由主观意识创造的","理性认识是感性认识的基础","人的认识受主体因素的制约和影响"],"a":"D","e":"来源：射阳事业编招聘2022年考试《公共基础知识》真题（人人文库网络汇编版；预览页只有题干，答案由整理者复核）。同一对象，不同主体因立场、知识、需要不同而认识不同，说明认识受主体因素制约。A项『随意性』、B项『意识创造对象』是唯心主义说法；C项说反了，感性认识才是理性认识的基础。","s":"射阳2022"},{"i":91,"m":"zt","t":"s","q":"根据我国《宪法》规定：『公民的合法的私有财产不受侵犯。』下列关于私有财产权的表述，哪一项是不正确的？（　）","o":["公民合法的私有财产不受侵犯","国家依照法律规定保护公民的私有财产权和继承权","任何人不得剥夺公民的私有财产","国家为了公共利益的需要，可以依照法律规定对公民的私有财产实行征收或者征用并给予补偿"],"a":"C","e":"来源：射阳事业编招聘2022年考试《公共基础知识》真题（人人文库网络汇编版；预览页只有题干，答案由整理者复核）。《宪法》第13条：公民的合法的私有财产不受侵犯；国家依照法律规定保护公民的私有财产权和继承权；国家为了公共利益的需要，可以依照法律规定对公民的私有财产实行征收或者征用并给予补偿。宪法允许依法征收征用，所以C项『任何人不得剥夺』是绝对化表述，错误。","s":"射阳2022"},{"i":92,"m":"zt","t":"s","q":"『政企分开』是指政府行政管理职能、宏观经济调控职能、行业管理职能与企业经营职能的分开；企业将原来承担的（　）从企业剥离后还给政府和社会。","o":["社会责任","生产功能","消费功能","社会职能"],"a":"D","e":"来源：射阳事业编招聘2022年考试《公共基础知识》真题（人人文库网络汇编版；预览页只有题干，答案由整理者复核）。政企分开的另一面，是企业把原来承担的办社会职能（如企业办学校、医院）剥离出来，交还政府和社会。社会责任企业仍要承担，A错。","s":"射阳2022"},{"i":93,"m":"zt","t":"s","q":"关于我国地形构成的叙述，正确的是（　）。","o":["山地面积约占全国总面积的1/3","盆地面积约占全国总面积的1/3","山区面积约占全国总面积的1/3","高原面积约占全国总面积的1/3"],"a":"A","e":"来源：射阳事业编招聘2022年考试《公共基础知识》真题（人人文库网络汇编版；预览页只有题干，答案由整理者复核）。我国五种地形占比：山地约33%，高原约26%，盆地约19%，平原约12%，丘陵约10%。山区（山地+丘陵+崎岖高原）约占2/3，C错。","s":"射阳2022"},{"i":94,"m":"zt","t":"s","q":"中国共产党执政的最坚实的政治基础和最深厚的力量源泉是（　）。","o":["人民群众的拥护和支持","立党为公、执政为民","严厉惩治腐败","正确的路线、方针、政策"],"a":"A","e":"来源：射阳事业编招聘2022年考试《公共基础知识》真题（人人文库网络汇编版；预览页只有题干，答案由整理者复核）。固定表述：人民群众的拥护和支持是党执政的最坚实的政治基础和最深厚的力量源泉。","s":"射阳2022"},{"i":95,"m":"zt","t":"s","q":"有一副对联以皇帝年号分别嵌入上下句，其上句为：『顺天心，康民物，雍和其境，乾健其身，嘉惠普群黎，道光绍虞夏商周，咸歌盛世』。此句涉及的皇帝的朝代是（　）。","o":["汉朝","唐朝","明朝","清朝"],"a":"D","e":"来源：射阳事业编招聘2022年考试《公共基础知识》真题（人人文库网络汇编版；预览页只有题干，答案由整理者复核）。句中依次嵌入顺治、康熙、雍正、乾隆、嘉庆、道光、咸丰，都是清朝年号。","s":"射阳2022"},{"i":96,"m":"zt","t":"s","q":"下列对计划和市场的关系，认识正确的是（　）。","o":["都属于基本制度的范畴","不可存在于同一社会制度下","都是经济发展的手段","是社会主义和资本主义相区别的标志"],"a":"C","e":"来源：射阳事业编招聘2022年考试《公共基础知识》真题（人人文库网络汇编版；预览页只有题干，答案由整理者复核）。邓小平南方谈话：计划多一点还是市场多一点，不是社会主义与资本主义的本质区别；计划和市场都是经济手段。","s":"射阳2022"},{"i":97,"m":"zt","t":"s","q":"用于记载会议主要精神和议定事项的公文是（　）。","o":["决议","请示","会议纪要","议案"],"a":"C","e":"来源：射阳事业编招聘2022年考试《公共基础知识》真题（人人文库网络汇编版；预览页只有题干，答案由整理者复核）。原题按旧规定，现行《党政机关公文处理工作条例》（2012）中该文种名为『纪要』，适用于记载会议主要情况和议定事项。答案仍选C。","s":"射阳2022"},{"i":98,"m":"zt","t":"s","q":"（　）被称为『近代科学之父』，他从实验中总结出自由落体定律、惯性定律等，推翻了亚里士多德物理学的许多臆断，奠定了经典力学的基础。","o":["阿基米德","哥白尼","伽利略","牛顿"],"a":"C","e":"来源：2025下半年盐城市亭湖区事业单位招聘（公共基础知识）测试题（人人文库网络汇编，资料标注为『测试题』，不是官方公布的真题）。伽利略开创了以实验为基础的近代科学，被誉为『近代科学之父』。阿基米德是『力学之父』，哥白尼提出日心说，牛顿提出运动定律和万有引力定律。","s":"亭湖2025测试题"},{"i":99,"m":"zt","t":"s","q":"2021年9月13日，工业和信息化部负责人表示，自2010年以来，我国（　）已连续11年位居世界第一。","o":["服务业","制造业","运输业","建筑业"],"a":"B","e":"来源：2025下半年盐城市亭湖区事业单位招聘（公共基础知识）测试题（人人文库网络汇编，资料标注为『测试题』，不是官方公布的真题）。国新办发布会上工信部表示，我国制造业自2010年起连续11年世界第一，拥有41个工业大类，是工业体系最健全的国家。现在的口径已更新为『制造业规模连续十多年居世界首位』，结论不变。","s":"亭湖2025测试题"},{"i":100,"m":"zt","t":"s","q":"关于股票，下列说法不正确的是（　）。","o":["股票是一种高风险的投资方式","股东可以要求公司返还其出资","流通性是股票生命力之所在","股票代表股东对股份公司的所有权"],"a":"B","e":"来源：2025下半年盐城市亭湖区事业单位招聘（公共基础知识）测试题（人人文库网络汇编，资料标注为『测试题』，不是官方公布的真题）。股票具有不可偿还性：投资者买入后不能要求公司还本退股，只能在证券市场转让。","s":"亭湖2025测试题"},{"i":101,"m":"zt","t":"s","q":"多级行文可以（　）。","o":["扩大公文的传阅范围","提高公文传递的效率","避免公文的丢失","以上均不正确"],"a":"B","e":"来源：2025下半年盐城市亭湖区事业单位招聘（公共基础知识）测试题（人人文库网络汇编，资料标注为『测试题』，不是官方公布的真题）。多级行文是把公文同时发给上几级或下几级机关，甚至直达基层，作用是提高公文传递效率。","s":"亭湖2025测试题"},{"i":102,"m":"zt","t":"s","q":"孙某在一起意外事故中死亡，他的配偶、子女依照遗嘱继承了遗产。引起该继承法律关系发生的法律事实，属于（　）。","o":["法律事件","法律行为","法律规范","法律适用"],"a":"A","e":"来源：2025下半年盐城市亭湖区事业单位招聘（公共基础知识）测试题（人人文库网络汇编，资料标注为『测试题』，不是官方公布的真题）。法律事实分为法律事件和法律行为。人的死亡不以当事人意志为转移，属于法律事件。","s":"亭湖2025测试题"},{"i":103,"m":"zt","t":"s","q":"下列属于社会保障制度范围的是（　）。","o":["国外政府和个人直接提供防疫物资","海外华侨捐助资金用于购买防疫用品","我国政府财政拨款救济社会特殊弱势群体","商业银行针对遭受疫情影响较大的行业给予定向信贷支持"],"a":"C","e":"来源：2025下半年盐城市亭湖区事业单位招聘（公共基础知识）测试题（人人文库网络汇编，资料标注为『测试题』，不是官方公布的真题）。社会保障的主体是国家，依法实施。政府财政拨款救济弱势群体属于社会救助。外国援助、个人捐赠、商业银行信贷都不是国家依法提供的保障。","s":"亭湖2025测试题"},{"i":104,"m":"zt","t":"s","q":"全国人民代表大会是我国的（　）。","o":["权力机关的常设机关","最高权力机构","权力机关的最高机构","最高权力机关"],"a":"D","e":"来源：2025下半年盐城市亭湖区事业单位招聘（公共基础知识）测试题（人人文库网络汇编，资料标注为『测试题』，不是官方公布的真题）。《宪法》第57条：全国人民代表大会是最高国家权力机关，它的常设机关是全国人大常委会。要按宪法原文『最高国家权力机关』作答。","s":"亭湖2025测试题"},{"i":105,"m":"zt","t":"s","q":"（　）指机关领导者或部门负责人对公文进行认真阅读、分析之后提出处置意见。","o":["注办","承办","分办","批办"],"a":"D","e":"来源：2025下半年盐城市亭湖区事业单位招聘（公共基础知识）测试题（人人文库网络汇编，资料标注为『测试题』，不是官方公布的真题）。批办是领导对公文提出处置意见；承办是按批办意见具体办理，是收文处理的核心环节；注办是承办人注记办理情况。","s":"亭湖2025测试题"},{"i":106,"m":"zt","t":"s","q":"根据我国法律规定，小李与妻子结婚后，小李的下列财产中，不属于夫妻共同财产的是（　）。","o":["工资","发表文章的稿费","投资股票的收益","工伤赔偿款"],"a":"D","e":"来源：2025下半年盐城市亭湖区事业单位招聘（公共基础知识）测试题（人人文库网络汇编，资料标注为『测试题』，不是官方公布的真题）。《民法典》第1062条：婚后工资奖金、投资收益、知识产权收益属于共同财产；第1063条：一方因受到人身损害获得的赔偿或者补偿属于个人财产，工伤赔偿款属于这一类。","s":"亭湖2025测试题"},{"i":107,"m":"zt","t":"s","q":"（　）是对市场机制调节作用的集中体现，是市场机制实现调节作用的枢纽。","o":["竞争机制","供求机制","价格机制","激励机制"],"a":"C","e":"来源：2025下半年盐城市亭湖区事业单位招聘（公共基础知识）测试题（人人文库网络汇编，资料标注为『测试题』，不是官方公布的真题）。市场机制包括价格、供求、竞争、风险机制，其中价格机制是核心和枢纽。激励机制不属于市场机制。","s":"亭湖2025测试题"},{"i":108,"m":"zt","t":"s","q":"公共管理是以（　）为核心的公共部门整合社会的各种力量，广泛运用政治的、经济的、管理的、法律的方法，进而提升公共服务品质。","o":["政府","非政府组织","公民","事业单位"],"a":"A","e":"来源：2025下半年盐城市亭湖区事业单位招聘（公共基础知识）测试题（人人文库网络汇编，资料标注为『测试题』，不是官方公布的真题）。公共管理的主体是以政府为核心的公共部门。","s":"亭湖2025测试题"},{"i":109,"m":"zt","t":"s","q":"下列关于中外法律史的说法，错误的是（　）。","o":["《中华人民共和国民法典》是新中国第一部以法典命名的法律","《中华人民共和国网络安全法》是我国首部网络安全的法律","《十二铜表法》是世界上最早的一部较为完整的成文法典","《大宪章》是英国宪法的组成部分之一"],"a":"C","e":"来源：2025下半年盐城市亭湖区事业单位招聘（公共基础知识）测试题（人人文库网络汇编，资料标注为『测试题』，不是官方公布的真题）。世界上现存第一部比较完备的成文法典是古巴比伦的《汉谟拉比法典》；《十二铜表法》（公元前449年左右）是罗马法最早的成文法。","s":"亭湖2025测试题"},{"i":110,"m":"zt","t":"s","q":"在我国，有权对诉讼活动实行专门法律监督的机关是（　）。","o":["人民法院","人民检察院","公安机关","仲裁委员会"],"a":"B","e":"来源：2025下半年盐城市亭湖区事业单位招聘（公共基础知识）测试题（人人文库网络汇编，资料标注为『测试题』，不是官方公布的真题）。《宪法》第134条：人民检察院是国家的法律监督机关（原题解析写作第129条，那是2018年修宪前的条文序号）。人民法院是审判机关。","s":"亭湖2025测试题"},{"i":111,"m":"zt","t":"j","q":"业主委员会是业主大会的决策机构。（　）","o":["正确","错误"],"a":"B","e":"来源：2025下半年盐城市亭湖区事业单位招聘（公共基础知识）测试题（人人文库网络汇编，资料标注为『测试题』，不是官方公布的真题）。根据《物业管理条例》，业主大会是决策机构，业主委员会是执行机构，负责执行业主大会决定的事项。","s":"亭湖2025测试题"},{"i":112,"m":"zt","t":"s","q":"适用于对重要问题提出见解和处理办法的文种是（　）。","o":["公告","纪要","通报","意见"],"a":"D","e":"来源：2025下半年盐城市亭湖区事业单位招聘（公共基础知识）测试题（人人文库网络汇编，资料标注为『测试题』，不是官方公布的真题）。《党政机关公文处理工作条例》：意见适用于对重要问题提出见解和处理办法。","s":"亭湖2025测试题"},{"i":113,"m":"zt","t":"s","q":"清代《本草纲目拾遗》有这样一段记载：『鼻冲水……贮以玻璃瓶，紧塞其口，勿使泄气……宜外用，勿服。』鼻冲水可能是下列哪种物质？（　）","o":["氨水","乙醇溶液","双氧水","明矾溶液"],"a":"A","e":"来源：2025下半年盐城市亭湖区事业单位招聘（公共基础知识）测试题（人人文库网络汇编，资料标注为『测试题』，不是官方公布的真题）。『冲鼻』说明有强烈刺激性气味，『勿使泄气』说明易挥发，『勿服』说明有毒，三点都符合氨水。","s":"亭湖2025测试题"},{"i":114,"m":"zt","t":"s","q":"（　）照射会让皮肤产生大量自由基，导致细胞膜的过氧化反应，使黑色素细胞产生更多的黑色素，并往上分布到表皮角质层，造成黑色斑点。","o":["红外线","紫外线","蓝外线","黄外线"],"a":"B","e":"来源：2025下半年盐城市亭湖区事业单位招聘（公共基础知识）测试题（人人文库网络汇编，资料标注为『测试题』，不是官方公布的真题）。晒黑、晒斑由紫外线造成。紫外线还能促进维生素D合成、杀菌消毒。不存在『蓝外线』『黄外线』。","s":"亭湖2025测试题"},{"i":115,"m":"zt","t":"s","q":"二十四节气歌中的『夏满芒夏暑相连』中第二个『夏』是指（　）节气。","o":["立夏","小满","芒种","夏至"],"a":"D","e":"来源：2025下半年盐城市亭湖区事业单位招聘（公共基础知识）测试题（人人文库网络汇编，资料标注为『测试题』，不是官方公布的真题）。这句依次是立夏、小满、芒种、夏至、小暑、大暑。夏至这天太阳直射北回归线，北半球白昼最长。","s":"亭湖2025测试题"},{"i":116,"m":"zt","t":"s","q":"甲因盗窃入狱，在接受劳动改造时立誓要洗心革面，遂主动交代了入狱前的其他犯罪行为。甲的行为属于（　）。","o":["坦白","一般自首","立功","特别自首"],"a":"D","e":"来源：2025下半年盐城市亭湖区事业单位招聘（公共基础知识）测试题（人人文库网络汇编，资料标注为『测试题』，不是官方公布的真题）。《刑法》第67条第2款：被采取强制措施的犯罪嫌疑人、被告人和正在服刑的罪犯，如实供述司法机关还未掌握的本人其他罪行的，以自首论（即特别自首）。交代的是自己的罪行，不是揭发他人，所以不算立功。","s":"亭湖2025测试题"},{"i":117,"m":"zt","t":"s","q":"某市社区发起『温暖元宵节，和谐社区情』主题活动，推动了社区的和谐建设。构建和谐社区的重要民主管理机构是（　）。","o":["业主自治委员会","街道办事处","城市居民委员会","物业管理委员会"],"a":"C","e":"来源：2025下半年盐城市亭湖区事业单位招聘（公共基础知识）测试题（人人文库网络汇编，资料标注为『测试题』，不是官方公布的真题）。居民委员会是居民自我管理、自我教育、自我服务的基层群众性自治组织。街道办事处是区政府的派出机关，不是自治组织。","s":"亭湖2025测试题"},{"i":118,"m":"zt","t":"s","q":"长沙马王堆出土的帛书写道『至正者静，至静者圣』『善为国者，太上无刑』『重柔者吉，重刚者灭』等，其主要反映出的治国思想是（　）。","o":["依法治国","民轻君贵","无为而治","独尊儒术"],"a":"C","e":"来源：2025下半年盐城市亭湖区事业单位招聘（公共基础知识）测试题（人人文库网络汇编，资料标注为『测试题』，不是官方公布的真题）。马王堆汉墓帛书《黄帝四经》属于黄老之学，崇尚清静、柔弱、无刑，体现汉初『无为而治』的治国思想。","s":"亭湖2025测试题"},{"i":119,"m":"law","t":"s","q":"我国现行宪法是哪一年制定的？","o":["1954年","1975年","1982年","2018年"],"a":"C","e":"现行宪法为1982年宪法，此后历经1988、1993、1999、2004、2018年五次修正。注意区分'制定'（1982）与'最近修改'（2018）。","s":""},{"i":120,"m":"law","t":"s","q":"我国现行宪法最近一次修改是在哪一年？","o":["2004年","2018年","1999年","1993年"],"a":"B","e":"2018年修宪是最近一次，将习近平新时代中国特色社会主义思想写入宪法。","s":""},{"i":121,"m":"law","t":"s","q":"我国的根本制度是什么？","o":["人民代表大会制度","社会主义制度","民主集中制","中国共产党领导的多党合作制度"],"a":"B","e":"社会主义制度是我国的根本制度；人民代表大会制度是根本政治制度（政体），两者常混淆，注意题干问的是'根本制度'。","s":""},{"i":122,"m":"law","t":"s","q":"全国人民代表大会是什么性质的国家机关？","o":["最高国家行政机关","最高国家权力机关","最高国家司法机关","最高国家监察机关"],"a":"B","e":"全国人大是最高国家权力机关；国务院是最高国家行政机关；国家监察委是最高监察机关。","s":""},{"i":123,"m":"law","t":"s","q":"国务院是什么性质的国家机关？","o":["最高国家权力机关","最高国家行政机关","最高国家审判机关","国家法律监督机关"],"a":"B","e":"国务院即中央人民政府，是最高国家行政机关。","s":""},{"i":124,"m":"law","t":"s","q":"在我国，年满多少周岁享有选举权和被选举权？","o":["16周岁","18周岁","20周岁","22周岁"],"a":"B","e":"年满18周岁且未被剥夺政治权利的公民享有选举权和被选举权，不设其他资格限制。","s":""},{"i":125,"m":"law","t":"s","q":"下列关于公民受教育权的说法，正确的是？","o":["只是权利","只是义务","既是权利也是义务","既不是权利也不是义务"],"a":"C","e":"受教育权是我国宪法规定的既是权利又是义务的唯一事项，高频考点。","s":""},{"i":126,"m":"law","t":"s","q":"村民委员会和居民委员会是什么性质的组织？","o":["一级国家机关","基层群众性自治组织","基层政权组织","政府派出机构"],"a":"B","e":"村委会、居委会是基层群众性自治组织，不是一级政府，也不是政府派出机构。","s":""},{"i":127,"m":"law","t":"s","q":"《中华人民共和国民法典》自何时起施行？","o":["2020年1月1日","2020年5月28日","2021年1月1日","2021年5月28日"],"a":"C","e":"民法典2020年5月28日通过，2021年1月1日起施行；施行后婚姻法、继承法、合同法等九部法律同时废止。","s":""},{"i":128,"m":"law","t":"s","q":"8周岁的儿童接受叔叔赠与的一台笔记本电脑，该民事法律行为的效力如何？","o":["无效","有效","效力待定","可撤销"],"a":"B","e":"8周岁以上未成年人是限制民事行为能力人，可以独立实施纯获利益的民事法律行为（如接受赠与），该行为有效。","s":""},{"i":129,"m":"law","t":"s","q":"我国民法规定的普通诉讼时效期间为几年？","o":["1年","2年","3年","5年"],"a":"C","e":"民法典规定普通诉讼时效为3年，自权利人知道或者应当知道权利受到损害以及义务人之日起计算。","s":""},{"i":130,"m":"law","t":"s","q":"下列属于第一顺序法定继承人的是？","o":["兄弟姐妹","配偶、子女、父母","祖父母","外祖父母"],"a":"B","e":"继承顺序：第一顺序为配偶、子女、父母；第二顺序为兄弟姐妹、祖父母、外祖父母。有第一顺序继承人时第二顺序不继承。","s":""},{"i":131,"m":"law","t":"s","q":"根据民法典，协议离婚中双方提交离婚登记申请后，冷静期是多少日？","o":["15日","30日","60日","90日"],"a":"B","e":"离婚冷静期为30日，冷静期内任何一方可撤回申请；期满后30日内双方须亲自到场申领离婚证。","s":""},{"i":132,"m":"law","t":"s","q":"因自愿实施紧急救助造成受助人损害的，救助人是否承担民事责任？","o":["承担全部责任","承担部分责任","不承担民事责任","承担公平责任"],"a":"C","e":"民法典第184条（'好人条款'）：因自愿实施紧急救助行为造成受助人损害的，救助人不承担民事责任。立法目的是鼓励见义勇为。","s":""},{"i":133,"m":"law","t":"s","q":"下列属于行政强制措施的是？","o":["罚款","警告","查封场所","行政拘留"],"a":"C","e":"查封、扣押、冻结属于行政强制措施；警告、罚款、拘留属于行政处罚。高频易混点。","s":""},{"i":134,"m":"law","t":"s","q":"公民、法人认为具体行政行为侵犯其合法权益，申请行政复议的期限一般为？","o":["15日内","30日内","60日内","6个月内"],"a":"C","e":"行政复议一般应在知道行政行为之日起60日内提出；行政诉讼期限一般为6个月，注意区分。","s":""},{"i":135,"m":"law","t":"s","q":"公民直接向人民法院提起行政诉讼的，一般应当在知道作出行政行为之日起多长时间内提出？","o":["15日内","60日内","3个月内","6个月内"],"a":"D","e":"行政诉讼一般期限为6个月；经复议后不服的，为15日内起诉。两个期限常一起考。","s":""},{"i":136,"m":"law","t":"s","q":"下列争议中，必须先申请行政复议、不能直接提起行政诉讼的是？","o":["对行政处罚不服","对税务机关的纳税决定不服","对行政强制措施不服","对行政许可不服"],"a":"B","e":"纳税争议属于'复议前置'情形，必须先经行政复议，对复议决定不服才能再诉讼。","s":""},{"i":137,"m":"law","t":"s","q":"犯罪构成的要件包括犯罪主体、主观方面、犯罪客体和？","o":["犯罪动机","犯罪目的","客观方面","犯罪结果"],"a":"C","e":"犯罪构成四要件：犯罪主体、主观方面（故意或过失）、犯罪客体、客观方面。犯罪动机不是构成要件。","s":""},{"i":138,"m":"law","t":"s","q":"张某对正在入室盗窃的王某进行反击致其轻伤，张某的行为属于？","o":["故意伤害","防卫过当","正当防卫","紧急避险"],"a":"C","e":"针对正在进行的不法侵害进行防卫，未明显超过必要限度，属正当防卫，不负刑事责任。","s":""},{"i":139,"m":"law","t":"s","q":"正当防卫明显超过必要限度造成重大损害的，应当如何处理？","o":["不负刑事责任","负全部刑事责任","应当负刑事责任，但是应当减轻或者免除处罚","可以减轻或者免除处罚"],"a":"C","e":"防卫过当应当负刑事责任，但应当（非'可以'）减轻或者免除处罚。'应当'与'可以'的区别是选择题陷阱。","s":""},{"i":140,"m":"law","t":"s","q":"犯罪过程中自动放弃犯罪或者自动有效地防止犯罪结果发生的，属于？","o":["犯罪未遂","犯罪中止","犯罪预备","犯罪既遂"],"a":"B","e":"自动放弃犯罪或自动有效防止结果发生为犯罪中止；因意志以外的原因未得逞为未遂。关键区分在'自动'与'被迫'。","s":""},{"i":141,"m":"law","t":"s","q":"已满14周岁不满16周岁的人，对下列哪类行为不负刑事责任？","o":["故意杀人","抢劫","盗窃","贩卖毒品"],"a":"C","e":"14-16周岁仅对故意杀人、故意伤害致人重伤或死亡、强奸、抢劫、贩卖毒品、放火、爆炸、投放危险物质八类罪负刑事责任；盗窃不在其列。","s":""},{"i":142,"m":"law","t":"j","q":"已满16周岁的人犯罪，应当负刑事责任。","o":["正确","错误"],"a":"A","e":"已满16周岁的人犯罪，应当负完全刑事责任，这是完全刑事责任年龄。","s":""},{"i":143,"m":"law","t":"j","q":"紧急避险是指为了使国家、公共利益、本人或者他人的人身、财产和其他权利免受正在发生的危险，不得已采取的损害另一较小合法权益的行为。","o":["正确","错误"],"a":"A","e":"紧急避险的本质是'牺牲较小合法利益保全较大合法利益'，且危险必须是正在发生的、不得已而为之。","s":""},{"i":144,"m":"law","t":"j","q":"行政拘留属于行政强制措施的一种。","o":["正确","错误"],"a":"B","e":"行政拘留是最严厉的行政处罚之一，属于行政处罚而非行政强制措施。查封、扣押、冻结才是强制措施。","s":""},{"i":145,"m":"law","t":"j","q":"对行政行为不服的，都可以直接向人民法院提起诉讼，无需经过复议。","o":["正确","错误"],"a":"B","e":"法律规定复议前置的情形（如纳税争议）必须先申请行政复议，不能直接起诉。","s":""},{"i":146,"m":"law","t":"m","q":"下列属于公民基本权利的有？","o":["平等权","选举权和被选举权","宗教信仰自由","受教育权"],"a":"ABCD","e":"四项均属宪法规定的公民基本权利。政治自由（言论、出版、集会、结社、游行、示威）也是基本权利。","s":""},{"i":147,"m":"law","t":"m","q":"下列属于行政处罚种类的有？","o":["警告","罚款","行政拘留","责令停产停业"],"a":"ABCD","e":"行政处罚种类包括：警告、通报批评；罚款、没收违法所得；暂扣或吊销许可证件；降低资质等级；责令停产停业；限制开展生产经营活动；行政拘留等。","s":""},{"i":148,"m":"law","t":"m","q":"已满14周岁不满16周岁的人，对下列哪些行为应当负刑事责任？","o":["故意杀人","抢劫","放火","盗窃"],"a":"ABC","e":"八类罪口诀'杀伤强贩、火爆投'：故意杀人、故意伤害致人重伤或死亡、强奸、贩卖毒品、放火、爆炸、投放危险物质、抢劫。盗窃不属于。","s":""},{"i":149,"m":"law","t":"m","q":"下列属于我国国家机构的有？","o":["全国人民代表大会","国务院","国家监察委员会","最高人民法院"],"a":"ABCD","e":"国家机构包括权力机关（人大）、行政机关（政府）、监察机关（监察委）、审判机关（法院）、检察机关（检察院）、军事机关等。","s":""},{"i":150,"m":"law","t":"m","q":"下列属于民事法律责任承担方式的有？","o":["停止侵害","返还财产","赔偿损失","支付违约金"],"a":"ABCD","e":"承担民事责任的方式主要有：停止侵害、排除妨碍、消除危险、返还财产、恢复原状、修理重作更换、赔偿损失、支付违约金、消除影响恢复名誉、赔礼道歉等。","s":""},{"i":151,"m":"law","t":"s","q":"宪法规定，中华人民共和国的一切权力属于谁？","o":["中国共产党","人民","全国人民代表大会","国务院"],"a":"B","e":"宪法第二条：中华人民共和国的一切权力属于人民。人民行使国家权力的机关是全国人民代表大会和地方各级人民代表大会。","s":""},{"i":152,"m":"law","t":"s","q":"法律面前人人平等，下列说法正确的是？","o":["任何人不论民族、性别、职业、教育程度，都平等享有宪法和法律规定的权利","权力大的人可以享有特权","平等是指平均分配","领导干部不受法律约束"],"a":"A","e":"法律面前人人平等：任何组织和个人都没有超越宪法和法律的特权，平等享有权利、平等履行义务。","s":""},{"i":153,"m":"law","t":"s","q":"我国的国家标志不包括下列哪项？","o":["国旗","国徽","国歌","执政党党旗"],"a":"D","e":"国家标志包括国旗、国徽、国歌、首都等，执政党党旗属于政党标志，不是国家标志。","s":""},{"i":154,"m":"politics","t":"s","q":"哲学的基本问题是？","o":["物质和运动的关系问题","思维和存在的关系问题","理论和实践的关系问题","个人和社会的关系问题"],"a":"B","e":"恩格斯指出：全部哲学特别是近代哲学的重大的基本问题，是思维和存在的关系问题（即意识和物质的关系问题）。","s":""},{"i":155,"m":"politics","t":"s","q":"马克思主义哲学认为，世界的本原是？","o":["意识","物质","实践","矛盾"],"a":"B","e":"唯物主义认为物质第一性、意识第二性，物质决定意识，物质是世界的本原。","s":""},{"i":156,"m":"politics","t":"s","q":"唯物辩证法的两大总特征是？","o":["对立和统一","联系和发展","量和质","肯定和否定"],"a":"B","e":"联系的观点和发展的观点是唯物辩证法的总特征；对立统一规律是其实质和核心。","s":""},{"i":157,"m":"politics","t":"s","q":"唯物辩证法的实质和核心是？","o":["质量互变规律","否定之否定规律","对立统一规律","联系和发展"],"a":"C","e":"对立统一规律（矛盾规律）揭示事物发展的源泉和动力，是唯物辩证法的实质和核心。高频考点。","s":""},{"i":158,"m":"politics","t":"s","q":"事物发展的源泉和动力是？","o":["矛盾","量变","外力推动","质变"],"a":"A","e":"矛盾即对立统一，是事物发展的源泉和动力。内因（内部矛盾）是根本原因，外因通过内因起作用。","s":""},{"i":159,"m":"politics","t":"s","q":"量变和质变的辩证关系表明，事物发展的形式和状态是？","o":["连续性和间断性的统一","前进性和曲折性的统一","普遍性和特殊性的统一","绝对性和相对性的统一"],"a":"A","e":"质量互变规律揭示事物发展的形式和状态（连续性与间断性统一）；否定之否定规律揭示发展方向（前进性与曲折性统一）。","s":""},{"i":160,"m":"politics","t":"s","q":"'拔苗助长'的寓言故事违背了什么哲学原理？","o":["尊重客观规律","意识的能动作用","量变质变","否定之否定"],"a":"A","e":"拔苗助长违背了禾苗生长的客观规律，片面发挥主观能动性。哲学寓意：发挥主观能动性必须以尊重客观规律为前提。","s":""},{"i":161,"m":"politics","t":"s","q":"'唇亡齿寒'体现了什么哲学道理？","o":["量变引起质变","事物是普遍联系的","矛盾双方相互转化","内因决定外因"],"a":"B","e":"唇与齿相互依存、相互影响，体现事物是普遍联系的，要用联系的观点看问题。","s":""},{"i":162,"m":"politics","t":"s","q":"检验真理的唯一标准是？","o":["权威的观点","多数人的意见","社会实践","逻辑推理"],"a":"C","e":"实践是检验真理的唯一标准，这是马克思主义认识论的基本原理；实践也是认识的来源、动力和目的。","s":""},{"i":163,"m":"politics","t":"s","q":"认识来源于实践，下列关于认识的说法正确的是？","o":["认识是天生就有的","认识来源于书本","认识来源于实践并随实践发展","认识是绝对不变的"],"a":"C","e":"实践是认识的来源、发展动力、最终目的和检验标准；认识随实践的发展而不断深化、扩展和向前推移。","s":""},{"i":164,"m":"politics","t":"s","q":"历史唯物主义认为，历史的创造者是？","o":["英雄人物","人民群众","统治阶级","知识分子"],"a":"B","e":"人民群众是历史的创造者，是社会物质财富和精神财富的创造者，是社会变革的决定力量。","s":""},{"i":165,"m":"politics","t":"s","q":"党的二十大召开的时间是？","o":["2021年10月","2022年10月","2023年10月","2024年7月"],"a":"B","e":"党的二十大于2022年10月16日至22日在北京召开。二十届三中全会于2024年7月召开，注意区分。","s":""},{"i":166,"m":"politics","t":"s","q":"党的二十大提出的党的中心任务是？","o":["全面建成小康社会","团结带领全国各族人民全面建成社会主义现代化强国、实现第二个百年奋斗目标，以中国式现代化全面推进中华民族伟大复兴","打赢脱贫攻坚战","建设社会主义市场经济体制"],"a":"B","e":"二十大报告明确：从现在起，党的中心任务就是团结带领全国各族人民全面建成社会主义现代化强国、实现第二个百年奋斗目标，以中国式现代化全面推进中华民族伟大复兴。","s":""},{"i":167,"m":"politics","t":"s","q":"按照党的二十大作出的'两步走'战略安排，到2035年的目标是？","o":["全面建成小康社会","基本实现社会主义现代化","全面建成社会主义现代化强国","全面深化改革"],"a":"B","e":"2020年全面建成小康社会（已完成）；2035年基本实现社会主义现代化；本世纪中叶建成富强民主文明和谐美丽的社会主义现代化强国。","s":""},{"i":168,"m":"politics","t":"s","q":"党的二十届三中全会审议通过的重要文件是？","o":["《关于全面深化改革若干重大问题的决定》","《中共中央关于进一步全面深化改革、推进中国式现代化的决定》","《关于制定国民经济和社会发展第十四个五年规划的建议》","《关于新时代加强党风廉政建设的意见》"],"a":"B","e":"二十届三中全会（2024年7月）通过《中共中央关于进一步全面深化改革、推进中国式现代化的决定》，提出到2035年全面建成高水平社会主义市场经济体制。","s":""},{"i":169,"m":"politics","t":"s","q":"中国式现代化的本质要求，首要的是？","o":["实现共同富裕","坚持中国共产党领导","发展全过程人民民主","推动构建人类命运共同体"],"a":"B","e":"中国式现代化本质要求的首要内容是坚持中国共产党领导；中国式现代化是人口规模巨大、全体人民共同富裕、物质文明和精神文明相协调、人与自然和谐共生、走和平发展道路的现代化。","s":""},{"i":170,"m":"politics","t":"s","q":"'五位一体'总体布局是指？","o":["经济、政治、文化、社会、生态文明建设","工业、农业、国防、科技、教育现代化","物质文明、政治文明、精神文明、社会文明、生态文明","改革、发展、稳定、民生、安全"],"a":"A","e":"'五位一体'总体布局：经济建设、政治建设、文化建设、社会建设、生态文明建设。C选项是'五个文明'，注意区分。","s":""},{"i":171,"m":"politics","t":"s","q":"'四个全面'战略布局不包括下列哪项？","o":["全面建设社会主义现代化国家","全面深化改革","全面依法治国","全面建设小康社会"],"a":"D","e":"现行'四个全面'：全面建设社会主义现代化国家、全面深化改革、全面依法治国、全面从严治党。'全面建成小康社会'目标已于2021年宣告实现并退出表述。","s":""},{"i":172,"m":"politics","t":"s","q":"新发展理念的内容是？","o":["创新、协调、绿色、开放、共享","创新、改革、绿色、开放、共享","创新、协调、环保、开放、共赢","科学、协调、绿色、开放、共享"],"a":"A","e":"新发展理念：创新（动力）、协调（方法）、绿色（底色）、开放（路径）、共享（目的），首尾分别是'创新发展'和'共享发展'。","s":""},{"i":173,"m":"politics","t":"s","q":"'党政军民学，东西南北中，'下一句是？","o":["人民是核心","党是领导一切的","发展是硬道理","稳定压倒一切"],"a":"B","e":"'党政军民学，东西南北中，党是领导一切的。'——中国特色社会主义最本质的特征是中国共产党领导，党的领导是中国特色社会主义制度的最大优势。","s":""},{"i":174,"m":"politics","t":"s","q":"中国特色社会主义最本质的特征是？","o":["人民当家作主","中国共产党领导","共同富裕","依法治国"],"a":"B","e":"中国共产党领导是中国特色社会主义最本质的特征，也是中国特色社会主义制度的最大优势。两个表述常成对考察。","s":""},{"i":175,"m":"politics","t":"s","q":"'人民对美好生活的向往'，就是我们奋斗的？","o":["方向","目标","动力","基础"],"a":"B","e":"固定表述：'人民对美好生活的向往，就是我们的奋斗目标。'","s":""},{"i":176,"m":"politics","t":"s","q":"'绿水青山就是金山银山'阐述的是哪两者之间的关系？","o":["经济发展与人口增长","生态环境保护和经济发展","城市发展与乡村振兴","改革与开放"],"a":"B","e":"'两山论'揭示保护生态环境就是保护生产力、改善生态环境就是发展生产力的道理，是习近平生态文明思想的核心理念之一。","s":""},{"i":177,"m":"politics","t":"s","q":"发展是第一要务，人才是第一资源，什么是第一动力？","o":["改革","创新","教育","开放"],"a":"B","e":"固定表述：'发展是第一要务，人才是第一资源，创新是第一动力。'创新是引领发展的第一动力。","s":""},{"i":178,"m":"politics","t":"s","q":"我国的立国之本、强国之基分别是？","o":["改革开放、四项基本原则","四项基本原则、改革开放","党的领导、依法治国","经济建设、党的建设"],"a":"B","e":"'坚持四项基本原则是立国之本，坚持改革开放是强国之路'——这是党在社会主义初级阶段基本路线的内容（'一个中心、两个基本点'）。","s":""},{"i":179,"m":"politics","t":"s","q":"社会主义初级阶段基本路线的中心是？","o":["政治建设","经济建设","文化建设","社会建设"],"a":"B","e":"'一个中心、两个基本点'：以经济建设为中心，坚持四项基本原则，坚持改革开放。","s":""},{"i":180,"m":"politics","t":"s","q":"我国的最高理想和最终目标是？","o":["实现小康社会","实现共同富裕","实现共产主义","实现社会主义现代化"],"a":"C","e":"党的最高理想和最终目标是实现共产主义；共同富裕是中国特色社会主义的根本原则，是社会主义的本质要求，注意区分。","s":""},{"i":181,"m":"politics","t":"s","q":"我国社会主要矛盾是？","o":["人民日益增长的物质文化需要同落后的社会生产之间的矛盾","人民日益增长的美好生活需要和不平衡不充分的发展之间的矛盾","无产阶级和资产阶级之间的矛盾","效率与公平之间的矛盾"],"a":"B","e":"十九大以来，我国社会主要矛盾已转化为人民日益增长的美好生活需要和不平衡不充分的发展之间的矛盾。A是转化前的旧表述，是经典陷阱。","s":""},{"i":182,"m":"politics","t":"s","q":"我国正处于并将长期处于？","o":["新发展阶段","社会主义初级阶段","全面小康阶段","高质量发展阶段"],"a":"B","e":"社会主义初级阶段是我国最大的实际、最大国情，我国正处于并将长期处于社会主义初级阶段。新发展阶段仍是初级阶段中的一个阶段。","s":""},{"i":183,"m":"politics","t":"s","q":"'三个代表'重要思想、科学发展观、习近平新时代中国特色社会主义思想共同的理论基础是？","o":["马克思列宁主义、毛泽东思想","邓小平理论","西方经济学理论","中国传统文化"],"a":"A","e":"中国特色社会主义理论体系（含邓小平理论、'三个代表'、科学发展观、习近平新时代中国特色社会主义思想）坚持的理论基础都是马克思列宁主义、毛泽东思想。","s":""},{"i":184,"m":"econ","t":"s","q":"我国的基本经济制度是？","o":["公有制为主体、多种所有制经济共同发展","全民所有制","私有制为主体","计划经济体制"],"a":"A","e":"我国基本经济制度包括三方面：公有制为主体、多种所有制经济共同发展；按劳分配为主体、多种分配方式并存；社会主义市场经济体制。","s":""},{"i":185,"m":"econ","t":"s","q":"调整存款准备金率属于哪种政策的工具？","o":["财政政策","货币政策","产业政策","收入政策"],"a":"B","e":"货币政策工具：存款准备金率、再贴现率、公开市场操作等，实施主体是中央银行（中国人民银行）。判断依据：央行出的牌是货币政策。","s":""},{"i":186,"m":"econ","t":"s","q":"下列属于财政政策工具的是？","o":["调整利率","增发国债","调整存款准备金率","公开市场操作"],"a":"B","e":"财政政策工具：税收、国债、财政支出、财政补贴等，主体是政府财政部门。增发国债属于财政政策；A、C、D均为货币政策工具。","s":""},{"i":187,"m":"econ","t":"s","q":"经济过热、通货膨胀严重时，应采取什么政策？","o":["扩张性（积极）财政政策和宽松的货币政策","紧缩性财政政策和紧缩性货币政策","只减税不加息","大幅增加财政支出"],"a":"B","e":"经济过热要'踩刹车'：紧缩性财政政策（减支出、增税收）+紧缩性货币政策（加息、提高准备金率）。经济下行则相反，采取扩张性政策。","s":""},{"i":188,"m":"econ","t":"s","q":"宏观经济指标 CPI 的含义是指？","o":["国内生产总值","居民消费价格指数","生产者价格指数","采购经理人指数"],"a":"B","e":"CPI（居民消费价格指数）反映居民家庭购买的消费品和服务价格变动情况，是衡量通货膨胀水平的主要指标。PPI是生产者价格指数。","s":""},{"i":189,"m":"econ","t":"s","q":"国际上通常以基尼系数多少作为收入分配差距的警戒线？","o":["0.2","0.3","0.4","0.5"],"a":"C","e":"基尼系数衡量收入分配差距，0.4为国际警戒线；低于0.2视为收入过于平均，高于0.6视为差距悬殊。","s":""},{"i":190,"m":"econ","t":"s","q":"恩格尔系数是指食品支出占消费总支出的比重，该系数越低说明？","o":["越贫困","越富裕","通货膨胀越严重","收入差距越大"],"a":"B","e":"恩格尔系数是衡量生活水平的重要指标：系数越低，说明用于食品消费的占比越小、生活水平越高（越富裕）；59%以上为贫困。","s":""},{"i":191,"m":"econ","t":"s","q":"GDP（国内生产总值）的计算遵循什么原则？","o":["国民原则","国土原则","居民原则","主权原则"],"a":"B","e":"GDP按国土（地域）原则计算：只要在本国领土范围内生产，无论本国公民还是外国企业，都计入本国GDP。GNP/GNI按国民原则计算。","s":""},{"i":192,"m":"econ","t":"s","q":"我国实行的是什么样的市场经济体制？","o":["完全自由竞争的市场经济","社会主义市场经济体制","政府主导的计划经济","混合计划经济"],"a":"B","e":"我国实行社会主义市场经济体制，使市场在资源配置中起决定性作用，更好发挥政府作用。'决定性作用'与'更好发挥政府作用'要成对记忆。","s":""},{"i":193,"m":"econ","t":"s","q":"社会主义市场经济条件下，公有制经济和非公有制经济的关系是？","o":["对立关系","相互促进、共同发展","主从关系","此消彼长"],"a":"B","e":"'两个毫不动摇'：毫不动摇巩固和发展公有制经济，毫不动摇鼓励、支持、引导非公有制经济发展。","s":""},{"i":194,"m":"econ","t":"s","q":"通货膨胀时期，纸币的购买力会？","o":["上升","下降","不变","先升后降"],"a":"B","e":"通货膨胀是指纸币发行量超过流通中实际需要的货币量，引起纸币贬值、物价持续上涨，购买力下降。","s":""},{"i":195,"m":"econ","t":"s","q":"我国实行按劳分配为主体、多种分配方式并存的分配制度。下列属于按生产要素分配的是？","o":["国企职工的工资","房屋租金收入","公务员的基本工资","事业单位岗位工资"],"a":"B","e":"房屋租金属于按生产要素（土地/资本要素）分配；A、C、D属于按劳分配。要素分配还包括资本、技术、管理、数据等要素收入。","s":""},{"i":196,"m":"econ","t":"s","q":"人民群众获得感的'三感'是指获得感、幸福感、安全感。这体现了发展的根本目的是？","o":["增进民生福祉","提高GDP增速","扩大财政盈余","增加出口"],"a":"A","e":"发展的根本目的是增进民生福祉，坚持以人民为中心的发展思想。","s":""},{"i":197,"m":"econ","t":"s","q":"我国经济已由高速增长阶段转向？","o":["均衡增长阶段","高质量发展阶段","中速增长阶段","恢复性增长阶段"],"a":"B","e":"党的十九大指出我国经济已由高速增长阶段转向高质量发展阶段，这是制定经济政策、推进工作的根本要求。","s":""},{"i":198,"m":"econ","t":"s","q":"供给侧结构性改革的主要任务不包括？","o":["去产能","去库存","去杠杆","刺激房地产市场"],"a":"D","e":"'三去一降一补'：去产能、去库存、去杠杆、降成本、补短板。刺激房地产不属于供给侧改革任务，且与'房住不炒'相悖。","s":""},{"i":199,"m":"mgmt","t":"s","q":"我国法定公文的种类共有多少种？","o":["12种","13种","15种","18种"],"a":"C","e":"《党政机关公文处理工作条例》规定15种法定公文：决议、决定、命令（令）、公报、公告、通告、意见、通知、通报、报告、请示、批复、议案、函、纪要。","s":""},{"i":200,"m":"mgmt","t":"s","q":"向上级机关汇报工作、反映情况、回复上级机关的询问，应使用的文种是？","o":["请示","报告","函","通知"],"a":"B","e":"报告适用于向上级机关汇报工作、反映情况，回复上级机关的询问；请示适用于向上级机关请求指示、批准。","s":""},{"i":201,"m":"mgmt","t":"s","q":"关于'请示'的行文规则，下列说法正确的是？","o":["可以一文多事","应当一文一事","可以多头主送","事成之后补报"],"a":"B","e":"请示必须一文一事、只写一个主送机关、事前行文；报告不得夹带请示事项。","s":""},{"i":202,"m":"mgmt","t":"s","q":"不相隶属机关之间商洽工作、询问和答复问题、请求批准和答复审批事项，应使用的文种是？","o":["请示","通知","函","意见"],"a":"C","e":"函用于不相隶属机关之间商洽工作、询问和答复问题、请求批准和答复审批事项，属于平行文。","s":""},{"i":203,"m":"mgmt","t":"s","q":"答复下级机关的请示事项，应使用的文种是？","o":["通知","批复","意见","决定"],"a":"B","e":"批复适用于答复下级机关请示事项，属于下行文；有请示才有批复，一一对应。","s":""},{"i":204,"m":"mgmt","t":"s","q":"在一定范围内公布应当遵守或者周知的事项，应使用的文种是？","o":["公告","通告","通知","通报"],"a":"B","e":"通告适用于在一定范围内公布应当遵守或者周知的事项；公告适用于向国内外宣布重要事项或者法定事项（范围更广）。","s":""},{"i":205,"m":"mgmt","t":"s","q":"公文密级从高到低的排列是？","o":["秘密、机密、绝密","绝密、机密、秘密","机密、绝密、秘密","绝密、秘密、机密"],"a":"B","e":"涉密公文密级从高到低：绝密＞机密＞秘密。紧急程度分特急、加急两级。","s":""},{"i":206,"m":"mgmt","t":"s","q":"下列属于上行文的是？","o":["通知","通报","请示","批复"],"a":"C","e":"上行文：请示、报告、议案；下行文：决定、命令、批复、通报、通知；平行文：函。","s":""},{"i":207,"m":"mgmt","t":"s","q":"公文的主送机关是指？","o":["需要了解公文内容的机关","公文的主要受理机关","负责印发公文的机关","公文的起草机关"],"a":"B","e":"主送机关是公文的主要受理机关，即需要对公文进行办理或答复的机关；抄送机关是除主送机关外需要执行或者知晓公文内容的其他机关。","s":""},{"i":208,"m":"mgmt","t":"s","q":"管理的四大基本职能是？","o":["计划、组织、领导、控制","决策、执行、监督、反馈","计划、实施、检查、总结","组织、协调、指挥、评估"],"a":"A","e":"管理的基本职能：计划（首要职能）、组织、领导、控制，口诀'计组领控'。","s":""},{"i":209,"m":"mgmt","t":"s","q":"管理的首要职能是？","o":["组织","领导","计划","控制"],"a":"C","e":"计划是管理的首要职能，为组织、领导、控制提供目标和依据。","s":""},{"i":210,"m":"mgmt","t":"s","q":"表扬先进、批评错误、传达重要精神和告知重要情况，应使用的文种是？","o":["通知","通报","通告","决定"],"a":"B","e":"通报适用于表彰先进、批评错误、传达重要精神和告知重要情况；通知适用于发布传达要求下级机关执行的事项。","s":""},{"i":211,"m":"mgmt","t":"s","q":"对重要事项作出决策和部署、奖惩有关单位和人员、变更或撤销下级机关不适当的决定事项，应使用的文种是？","o":["决议","决定","指令","意见"],"a":"B","e":"决定适用于对重要事项作出决策和部署、奖惩有关单位和人员、变更或撤销下级机关不适当的决定事项；决议适用于会议讨论通过的重大决策事项（须经会议表决）。","s":""},{"i":212,"m":"mgmt","t":"s","q":"公文的成文日期一般以为准？","o":["起草日期","签发日期","印发日期","会议通过日期"],"a":"B","e":"成文日期署会议通过或者发文机关负责人签发的日期；联合行文署最后签发机关负责人签发的日期。","s":""},{"i "i":56,"m":"current","t":"五中全会《决定》：习近平党建思想与七项原则","b":"《中共中央关于持之以恒推进全面从严治党若干重大问题的决定》于2026年10月29日由五中全会通过、11月1日全文发布。《决定》指出新时代管党治党、兴党强党实践形成习近平党建思想；提出持之以恒推进全面从严治党必须遵循的原则：坚持服务使命任务、坚持以党的政治建设为统领、坚持全面从严、坚持问题导向、坚持守正创新、坚持以上率下、坚持依规治党（七条）。","s":"中国政府网（新华社受权发布）"},{"i":57,"m":"current","t":"《决定》：增强党性是全面从严治党的根本性任务","b":"《决定》强调增强共产党人的党性是全面从严治党的根本性任务，推动党员、干部把加强党性修养作为终身课题；民主集中制是党的根本组织原则和领导制度；部署增强共产党人的党性、严格贯彻执行民主集中制、锻造堪当民族复兴重任的高素质干部队伍、建设上下贯通执行有力的严密组织体系、驰而不息正风肃纪、坚定不移一体推进不敢腐不能腐不想腐、坚持制度治党依规治党等战略任务，并对完善党和国家监督体系、压紧压实管党治党责任作出部署。","s":"中国政府网（中共中央新闻发布会）"},{"i":58,"m":"current","t":"新时代反腐败斗争成果数据","b":"中共中央新闻发布会（2026年10月30日）介绍：党的十八大以来，全国纪检监察机关共查处四风问题164.4万起，批评教育和处理225.7万人；共立案810.5万件，处分792.2万人，其中处分中管干部963人。全党现有党员1亿多名、基层党组织540多万个。","s":"中国政府网（中共中央新闻发布会）"},{"i":59,"m":"current","t":"中央经济工作会议（2025年12月）","b":"中央经济工作会议于2025年12月10日至11日在北京举行，习近平出席会议并发表重要讲话，总结2025年经济工作、分析当前经济形势、部署2026年经济工作。会议指出2025年是极为不平凡的一年，经济社会发展主要目标任务将顺利完成；提出实施更加积极有为的宏观政策，持续扩大内需、优化供给，因地制宜发展新质生产力，确保十五五开好局起好步。","s":"中国政府网英文频道（新华社电）"},{"i":60,"m":"current","t":"2026年我国发展主要预期目标","b":"2026年政府工作报告提出的发展主要预期目标：国内生产总值增长4.5%－5%，在实际工作中努力争取更好结果；城镇调查失业率5.5%左右；城镇新增就业1200万人以上；居民消费价格涨幅2%左右；居民收入增长和经济增长同步；国际收支基本平衡；粮食产量1.4万亿斤左右；单位国内生产总值二氧化碳排放降低3.8%左右。","s":"2026年政府工作报告全文（中国翻译研究院）"},{"i":61,"m":"current","t":"2026年财政政策安排","b":"2026年继续实施更加积极的财政政策：赤字率拟按4%左右安排，赤字规模5.89万亿元、比上年增加2300亿元；一般公共预算支出规模首次达到30万亿元、比上年增加约1.27万亿元；拟发行超长期特别国债1.3万亿元；拟发行特别国债3000亿元，用于支持国有大型商业银行补充资本；拟安排地方政府专项债券4.4万亿元。","s":"2026年政府工作报告全文（中国翻译研究院）"},{"i":62,"m":"current","t":"2026年提振消费与扩大投资安排","b":"2026年安排：深化拓展提振消费专项行动，制定实施城乡居民增收计划，安排超长期特别国债2500亿元支持消费品以旧换新，设立1000亿元财政金融协同促内需专项资金；拟安排中央预算内投资7550亿元，安排8000亿元超长期特别国债资金用于两重建设，发行新型政策性金融工具8000亿元，安排2000亿元超长期特别国债资金支持大规模设备更新；支持有条件的地方推广中小学春秋假、落实职工带薪错峰休假。","s":"2026年政府工作报告全文（中国翻译研究院）"},{"i":63,"m":"current","t":"2026年产业新提法：新兴支柱产业、未来产业与智能经济","b":"2026年政府工作报告提出实施产业创新工程，打造集成电路、航空航天、生物医药、低空经济等新兴支柱产业；培育发展未来能源、量子科技、生物制造、具身智能、脑机接口、6G等未来产业；打造智能经济新形态，深化拓展人工智能+行动，促进新一代智能终端和智能体加快推广，实施超大规模智算集群、算电协同等新基建工程；纵深推进全国统一大市场建设，制定全国统一大市场建设条例。","s":"2026年政府工作报告全文（中国翻译研究院）"},{"i":6
