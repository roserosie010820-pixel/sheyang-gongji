","s":"Global Times（环球时报英文版）"},{"i":84,"m":"current","t":"第十五届全国运动会","b":"2025年11月9日至21日，第十五届全国运动会在广东、香港、澳门举办，由粤港澳三地首次联合承办，开幕式于11月9日在广州举行；2026年政府工作报告确认成功举办第九届亚洲冬季运动会、第十五届全国运动会。","s":"21世纪经济报道／政府工作报告"},{"i":85,"m":"current","t":"江苏十四五发展总账","b":"江苏省地区生产总值连续迈上4个万亿元台阶、达14.2万亿元、年均增长5.7%，人均达16.7万元；全社会研发投入强度达3.38%左右，区域创新能力升至全国第二；国家先进制造业集群增至14个、实现设区市全覆盖，制造业高质量发展指数连续5年居全国首位；实际使用外资连续8年全国第一；进出口规模稳居全国第二。","s":"2026年江苏省政府工作报告（中国江苏网）"},{"i":86,"m":"current","t":"江苏2025年成绩单","b":"2025年江苏地区生产总值增长5.3%、增量保持全国第一；进出口总额5.95万亿元、增长6%；社会消费品零售总额达4.64万亿元；城镇新增就业141万人、城镇调查失业率4.6%；空气优良天数比率83.8%、PM2.5浓度31.3微克/立方米；民营经济增加值占GDP比重达58.5%。","s":"2026年江苏省政府工作报告（中国江苏网）"},{"i":87,"m":"current","t":"江苏2026年目标与安排","b":"2026年江苏经济社会发展主要预期目标：地区生产总值按增长5%安排；一般公共预算收入增长2%；城镇新增就业120万人、城镇调查失业率5%左右；居民消费价格涨幅2%左右；全社会研发投入强度3.42%左右。将办好2026年亚太经合组织贸易部长会议（在江苏举办）。","s":"2026年江苏省政府工作报告（中国江苏网）"},{"i":88,"m":"current","t":"江苏科创亮点（十四五）","b":"江苏：全国高校区域技术转移转化中心投入运行；中国科学院工业人工智能研究所正式成立；全球首个6G外场试验网成功搭建；未来号试验船正式交付；苏州实验室获批全面展开建设；两院院士增至123位；国家级专精特新小巨人企业增至3022家、居全国第一。","s":"2026年江苏省政府工作报告（中国江苏网）"},{"i":89,"m":"current","t":"苏超与江苏文旅消费","b":"2025年江苏苏超足球联赛破圈成为顶流，以跟着苏超游江苏等活动促进文旅体商融合，全省接待游客人次、游客总花费分别增长10.4%、10.2%；引进首店1809家，消费品以旧换新带动限上新能源汽车零售额增长21.2%。","s":"2026年江苏省政府工作报告（中国江苏网）"},{"i":90,"m":"current","t":"《关于发展新质生产力的意见》","b":"2026年10月9日，《中共中央 国务院关于发展新质生产力的意见》公布：以科技创新为引领，以全要素生产率大幅提升为核心标志，推动技术革命性突破、生产要素创新性配置、产业深度转型升级；建立企业研发准备金制度，提高企业研发费用加计扣除比例，支持有能力的民营企业牵头承担国家重大技术攻关任务。","s":"中国政府网（新华社受权发布）"},{"i":91,"m":"law","t":"民营经济促进法","b":"《中华人民共和国民营经济促进法》2025年4月30日由十四届全国人大常委会第十五次会议通过，自2025年5月20日起施行，共78条。核心内容：国家坚持平等对待、公平竞争、同等保护、共同发展的原则，民营经济组织与其他各类经济组织享有平等的法律地位、市场机会和发展权利；国家实行全国统一的市场准入负面清单制度；落实公平竞争审查制度；大型企业向中小民营经济组织采购不得以收到第三方付款作为支付账款的条件。","s":"中国人大网（法律全文）"},{"i":92,"m":"law","t":"治安管理处罚法（修订）","b":"《中华人民共和国治安管理处罚法》2025年6月27日由十四届全国人大常委会第十六次会议修订，自2026年1月1日起施行。要点：治安管理工作坚持中国共产党的领导、坚持综合治理；办理治安案件坚持教育与处罚相结合；不执行行政拘留处罚的情形包括：已满十四周岁不满十六周岁的，已满十六周岁不满十八周岁初次违反治安管理的，七十周岁以上的，怀孕或者哺乳自己不满一周岁婴儿的；但情节严重、影响恶劣或一年以内二次以上违反治安管理的，不受限制；违反治安管理行为在六个月内没有被公安机关发现的，不再处罚。","s":"中国人大网（法律全文）"},{"i":93,"m":"law","t":"治安管理处罚法：学生欺凌条款","b":"修订后的治安管理处罚法规定：以殴打、侮辱、恐吓等方式实施学生欺凌，违反治安管理的，公安机关应当依照本法、《中华人民共和国预防未成年人犯罪法》的规定，给予治安管理处罚、采取相应矫治教育等措施；学校明知发生严重的学生欺凌或明知发生其他侵害未成年学生的犯罪，不按规定报告或者处置的，责令改正，对其直接负责的主管人员和其他直接责任人员建议有关部门依法予以处分。","s":"中国人大网（法律全文）"},{"i":94,"m":"law","t":"反不正当竞争法（第二次修订）","b":"《中华人民共和国反不正当竞争法》1993年通过、2017年第一次修订，2025年6月27日由十四届全国人大常委会第十六次会议第二次修订，自2025年10月15日起施行。","s":"中国人大网（法律全文）"},{"i":95,"m":"law","t":"国家公园法","b":"《中华人民共和国国家公园法》2025年9月12日由十四届全国人大常委会第十七次会议通过，自2026年1月1日起施行。要点：国家建立以国家公园为主体的自然保护地体系；国家公园由国务院批准设立，以保护具有国家代表性的自然生态系统为主要目的；坚持生态保护第一、统筹保护和发展，坚持国家代表性和全民公益性。","s":"中国人大网（法律全文）"},{"i":96,"m":"law","t":"原子能法","b":"《中华人民共和国原子能法》2025年9月12日由十四届全国人大常委会第十七次会议通过，自2026年1月15日起施行。","s":"中国人大网（法律全文）"},{"i":97,"m":"law","t":"法治宣传教育法","b":"《中华人民共和国法治宣传教育法》2025年9月12日由十四届全国人大常委会第十七次会议通过，自2025年11月1日起施行。要点：国家实行公民终身法治教育制度，将法治教育纳入国民教育、干部教育、社会教育体系；每年12月4日为国家宪法日、国家通过多种形式开展宪法宣传教育活动的规定写入本法；录用国家工作人员应当将有关法律知识纳入录用考试内容。","s":"中国人大网（法律全文）"},{"i":98,"m":"law","t":"仲裁法（修订）","b":"《中华人民共和国仲裁法》1994年通过，2025年9月12日由十四届全国人大常委会第十七次会议修订，自2026年3月1日起施行。","s":"中国人大网（法律全文）"},{"i":99,"m":"law","t":"突发公共卫生事件应对法","b":"《中华人民共和国突发公共卫生事件应对法》2025年9月12日由十四届全国人大常委会第十七次会议通过，自2025年11月1日起施行。","s":"中国人大网（法律全文）"},{"i":100,"m":"law","t":"食品安全法修改：液态食品散装运输许可","b":"2025年9月12日十四届全国人大常委会第十七次会议通过关于修改食品安全法的决定，自2025年12月1日起施行。国家对重点液态食品道路散装运输实行许可制度，道路运输经营者应依法取得县级以上地方人民政府食品安全监督管理部门核发的准运证；并在婴幼儿配方乳粉相关规定后增加婴幼儿配方液态乳。","s":"中国人大网（决定全文）"},{"i":101,"m":"law","t":"网络安全法修改：人工智能条款","b":"2025年10月28日十四届全国人大常委会第十八次会议通过关于修改网络安全法的决定，自2026年1月1日起施行。新增规定：国家支持人工智能基础理论研究和算法等关键技术研发，推进训练数据资源、算力等基础设施建设，完善人工智能伦理规范，加强风险监测评估和安全监管，促进人工智能应用和健康发展。","s":"中国人大网（决定全文）"},{"i":102,"m":"law","t":"海商法（修订）","b":"《中华人民共和国海商法》1992年通过，2025年10月28日由十四届全国人大常委会第十八次会议修订，自2026年5月1日起施行，共310条。","s":"中国人大网（法律全文）"},{"i":103,"m":"law","t":"城市居民委员会组织法（修订）","b":"《中华人民共和国城市居民委员会组织法》1989年通过，2025年10月28日由十四届全国人大常委会第十八次会议修订，自2026年1月1日起施行。明确居民委员会每届任期五年，届满应当及时举行换届选举，居民委员会成员可以连选连任。","s":"中国人大网（法律全文）"},{"i":104,"m":"law","t":"村民委员会组织法修改","b":"2025年10月28日十四届全国人大常委会第十八次会议通过关于修改村民委员会组织法的决定，自2026年1月1日起施行；该法根据决定作相应修改并对条文顺序作相应调整后重新公布。","s":"中国人大网（决定全文）"},{"i":105,"m":"law","t":"环境保护税法修改：挥发性有机物税费试点","b":"2025年10月28日十四届全国人大常委会第十八次会议通过关于修改环境保护税法的决定，自公布之日起施行。授权国务院及其有关部门根据挥发性有机物的特点合理设定征税范围和税额幅度开展试点，试点实施办法由国务院制定，试点五年内向全国人大常委会报告并提出修改法律的建议。","s":"中国人大网（决定全文）"},{"i":106,"m":"law","t":"民用航空法（修订）","b":"《中华人民共和国民用航空法》1995年通过，2025年12月27日由十四届全国人大常委会第十九次会议修订，自2026年7月1日起施行，共262条。","s":"中国人大网（法律全文）"},{"i":107,"m":"law","t":"危险化学品安全法","b":"《中华人民共和国危险化学品安全法》2025年12月27日由十四届全国人大常委会第十九次会议通过，自2026年5月1日起施行。要点：坚持安全第一、预防为主、综合治理的方针，从源头上防范化解重大安全风险；实行管行业必须管安全、管业务必须管安全、管生产经营必须管安全。","s":"中国人大网（法律全文）"},{"i":108,"m":"law","t":"国家通用语言文字法（修订）","b":"《中华人民共和国国家通用语言文字法》2000年通过，2025年12月27日由十四届全国人大常委会第十九次会议修订，自2026年1月1日起施行。明确：国家通用语言文字是普通话和规范汉字，是国家法定全国通用的语言文字；国家推广普及国家通用语言文字；公民有学习和使用国家通用语言文字的权利。","s":"中国人大网（法律全文）"},{"i":109,"m":"law","t":"对外贸易法（第二次修订）","b":"《中华人民共和国对外贸易法》1994年通过、2004年第一次修订，2025年12月27日由十四届全国人大常委会第十九次会议第二次修订，自2026年3月1日起施行。","s":"中国人大网（法律全文）"},{"i":110,"m":"law","t":"渔业法（修订）","b":"《中华人民共和国渔业法》1986年通过，2025年12月27日由十四届全国人大常委会第十九次会议修订，自2026年5月1日起施行。","s":"中国人大网（法律全文）"},{"i":111,"m":"law","t":"刑诉法第二百九十二条立法解释","b":"2025年12月27日，十四届全国人大常委会第十九次会议通过关于《中华人民共和国刑事诉讼法》第二百九十九条…（注：实际为第二百九十二条）的解释，明确缺席审判程序中被告人所在地法律允许的其他方式的含义，包括被告人所在地的法律、判例、惯例、司法实践等所规定、承认、认可、接受的各种送达方式。","s":"中国人大网（解释全文）"},{"i":112,"m":"law","t":"生态环境法典","b":"《中华人民共和国生态环境法典》2026年3月12日由十四届全国人大四次会议通过，自2026年8月15日起施行。法典设总则、污染防治、生态保护、绿色低碳发展等编，整合原环保领域多部单行法，是继民法典之后又一部以法典命名的重要法律，以生态环境法典施行促进美丽中国目标实现。","s":"新华网（两会受权发布）"},{"i":113,"m":"law","t":"民族团结进步促进法","b":"《中华人民共和国民族团结进步促进法》2026年3月12日由十四届全国人大四次会议通过，自2026年7月1日起施行。要点：铸牢中华民族共同体意识，推进中华民族共同体建设；引导各族人民牢固树立休戚与共、荣辱与共、生死与共、命运与共的共同体理念；将铸牢中华民族共同体意识教育纳入国民教育、干部教育、社会教育体系。","s":"中国人大网（法律全文）"},{"i":114,"m":"law","t":"国家发展规划法","b":"《中华人民共和国国家发展规划法》2026年3月12日由十四届全国人大四次会议通过，自公布之日起施行。明确：国家发展规划是指国民经济和社会发展五年规划纲要，包括根据需要提出的远景目标；国家发展规划由国务院组织编制；建立健全以国家发展规划为统领、以国土空间规划为基础、以专项规划和区域规划为支撑的国家规划体系。","s":"中国人大网（法律全文）"},{"i":115,"m":"law","t":"监狱法（修订）","b":"《中华人民共和国监狱法》1994年通过，2026年4月30日由十四届全国人大常委会第二十二次会议修订，自2026年11月1日起施行。","s":"中国人大网（法律全文）"},{"i":116,"m":"law","t":"社会救助法","b":"《中华人民共和国社会救助法》2026年4月30日由十四届全国人大常委会第二十二次会议通过，自2026年7月1日起施行。要点：社会救助坚持保基本、兜底线、救急难、可持续；实行党委领导、政府负责、民政牵头、部门协同、社会参与的工作机制；对最低生活保障边缘家庭中的重度残疾人、重病患者以及确有特殊困难人员，可以纳入最低生活保障范围。","s":"中国人大网（法律全文）"},{"i":117,"m":"law","t":"商标法（修订）与注册会计师法修改","b":"《中华人民共和国商标法》1982年通过，2026年6月26日由十四届全国人大常委会第二十三次会议修订，自2027年1月1日起施行；同次会议还通过关于修改注册会计师法的决定，自2027年1月1日起施行。","s":"中国人大网（法律全文）"},{"i":118,"m":"law","t":"耕地保护和质量提升法","b":"《中华人民共和国耕地保护和质量提升法》2026年8月28日由十四届全国人大常委会第二十四次会议通过，自2027年1月1日起施行。要点：坚持实行最严格的耕地保护制度、最严格的节约集约用地制度，严守耕地保护红线；耕地应当主要用于粮食和棉、油、糖、蔬菜等农产品以及饲草饲料生产；实行耕地保护和粮食安全党政同责，省级政府对区域内耕地保护和粮食安全负总责，其主要负责人是第一责任人。","s":"中国人大网（法律全文）"},{"i":119,"m":"law","t":"农业法（第二次修订）","b":"《中华人民共和国农业法》1993年通过、2002年第一次修订，2026年8月28日由十四届全国人大常委会第二十四次会议第二次修订，自2027年1月1日起施行。","s":"中国人大网（法律全文）"},{"i":120,"m":"law","t":"医疗保障法","b":"《中华人民共和国医疗保障法》2026年8月28日由十四届全国人大常委会第二十四次会议通过，自2027年1月1日起施行。要点：遵循覆盖全民、统筹城乡、公平统一、安全规范、多层次、可持续的原则；基本医疗保险包括职工基本医疗保险和城乡居民基本医疗保险；职工应当参加生育保险，生育保险费由用人单位缴纳、职工不缴纳，并与职工基本医疗保险费统一征缴、基金合并建账；医保基金专款专用，任何单位和个人不得隐匿、转移、侵占、挪用。","s":"中国人大网（法律全文）"},{"i":121,"m":"law","t":"国防动员法（修订）与律师法修改","b":"《中华人民共和国国防动员法》2010年通过，2026年8月28日由十四届全国人大常委会第二十四次会议修订，自2026年10月1日起施行。同次会议还通过关于修改律师法的决定，自2026年9月1日起施行，涉及粤港澳大湾区律师执业等内容。","s":"中国人大网（法律全文／决定全文）"},{"i":122,"m":"law","t":"事业单位登记管理条例（国务院令第849号）","b":"《事业单位登记管理条例》经2026年9月28日国务院第98次常务会议通过，以国务院令第849号公布（2026年10月17日签署），自2026年12月1日起施行，原《事业单位登记管理暂行条例》同时废止。要点：事业单位法人登记事项包括名称、住所、宗旨和业务范围、法定代表人、经费来源、开办资金等；法人证书为限期有效证书；电子法人证书与纸质法人证书具有同等法律效力。","s":"中国政府网（国务院令全文）"},{"i":123,"m":"law","t":"全民所有制工业企业法废止","b":"2026年3月12日，十四届全国人大四次会议通过关于批准《全国人民代表大会常务委员会关于法律清理工作情况和有关法律和决定处理意见的报告》的决定，《中华人民共和国全民所有制工业企业法》被废止（主席令第七十三号公布）。","s":"中国人大网（主席令）"},{"i":124,"m":"region","t":"射阳县建县与县治","b":"1942年4月21日，析阜宁、盐城两县串场河以东、射阳河以南、黄沙港以北地区设立射阳县，隶盐阜区。1949年11月盐东县并入射阳县。1950年2月26日县治改设合德镇。1983年3月1日江苏推行市管县体制，射阳县改由盐城市管辖。","s":"射阳县人民政府网·历史人文(射阳年鉴2025)"},{"i":125,"m":"region","t":"射阳县位置与面积","b":"射阳县地处江苏沿海中部，东临黄海，南抵新洋港与盐城市亭湖区接壤，西与建湖县、阜宁县毗邻，北至苏北灌溉总渠与滨海县相望。土地调查总面积2572.72平方千米，其中陆地1825.02平方千米、水域625.94平方千米。","s":"射阳县人民政府网·地理环境(射阳年鉴2025)"},{"i":126,"m":"region","t":"射阳县行政区划","b":"截至2024年底，射阳县辖合德、临海、千秋、四明、海河、海通、兴桥、新坍、长荡、盘湾、特庸、洋马、黄沙港13个镇，设江苏射阳经济开发区、江苏射阳港经济开发区。境内有省属淮海、临海、新洋农场和市属射阳盐场。县政府驻地合德镇。","s":"射阳县人民政府网·行政区划(射阳年鉴2025)"},{"i":127,"m":"region","t":"射阳县海陆资源与鹤乡","b":"射阳拥有5130平方公里海域、107.8公里海岸线、109.7万亩滩涂、7.3万公顷生态湿地，海域与湿地面积居江苏首位，是世界自然遗产中国黄(渤)海候鸟栖息地的重要组成部分。作为东亚—澳大利西亚候鸟迁徙通道上的驿站，素有「中国鹤乡」美誉。","s":"射阳县人民政府网·射阳概况"},{"i":128,"m":"region","t":"射阳县2025年经济总量","b":"2025年射阳地区生产总值808.16亿元，按不变价格计算增长5.7%。一二三产业增加值分别为119.88、267.60、420.68亿元，结构为14.83:33.12:52.05。人均地区生产总值107704元。一般公共预算收入34.62亿元，增长3.1%。","s":"2025年射阳县国民经济和社会发展统计公报"},{"i":129,"m":"region","t":"射阳县人口与居民收入(2025)","b":"2025年末射阳户籍总人口89.11万人，常住人口74.64万人，城镇化率63.66%。全体居民人均可支配收入40616元，增长5.0%；城镇46750元，农村32233元，城乡收入比1.45。","s":"2025年射阳县国民经济和社会发展统计公报"},{"i":130,"m":"region","t":"射阳县农业与粮食(2025)","b":"2025年射阳粮食播种面积236.6万亩，总产量114.8万吨，亩产485.4公斤；农林牧渔业总产值219.7亿元。「射阳大米」获上海农博会金奖，射阳「宁香菊」获批国家新品种；全省首座风光渔一体化半潜式海洋牧场「国能黄海1号」下水。","s":"2025年射阳县国民经济和社会发展统计公报"},{"i":131,"m":"region","t":"射阳县名片与称号","b":"射阳县名片包括：全国文明县城、全国县域经济百强县、全国综合竞争力百强县、国家生态文明建设示范区、国家卫生县城、中国药材之乡、中国蒜薹之乡、中国食用菌之乡、中国蟹苗之乡、中国民间文化艺术之乡、中国鹤乡等。","s":"射阳县人民政府网·城市名片(射阳年鉴2025)"},{"i":132,"m":"region","t":"射阳县风电与新能源产业","b":"射阳是江苏乃至全国海上风电开发核心区域，风电全产业链生态圈涵盖风场开发、装备制造、科技创新、检测认证、运维服务。重点打造新能源汽车、风电全产业链为核心的500亿级新能源地标产业集群，并布局低空经济、人工智能等未来产业。","s":"射阳县人民政府网·射阳概况"},{"i":133,"m":"region","t":"射阳县主要景点","b":"安徒生童话乐园(国家AAAA级，2019年11月开园)；息心寺(AAAA级)；后羿文化园(AAA级，2005年5月开园，源于「后羿射日」传说)；千鹤湖公园(AAA级，2017年11月开园)；鹤乡菊海(AAA级，洋马镇)；中共华中工委纪念馆(AA级，2007年5月12日开馆)。","s":"射阳县人民政府网·风景名胜(射阳年鉴2025)"},{"i":134,"m":"region","t":"射阳河闸","b":"射阳河闸位于射阳河口，为国家「一五」重点工程，号称「中国沿海第一闸」，由苏联专家帮助设计，1953年开建、1956年建成，是新中国成立初期江苏省第一座挡潮闸，共35孔，总长500米，为市级文物保护单位。","s":"射阳县人民政府网·风景名胜(射阳年鉴2025)"},{"i":135,"m":"region","t":"射阳县2026年政府工作报告提法","b":"2026年1月13日县十六届人大五次会议上，代县长朱亮亮作政府工作报告。2026年是「十五五」开局之年，提出向绿而行勇争先、向海而兴立潮头；「十五五」重点抓好现代产业体系、区域发展格局、海滨城市内涵、绿色转型、民生服务五大任务；奋力谱写「强富美高」新射阳现代化建设新篇章。","s":"射阳县人民政府网·射阳日报"},{"i":136,"m":"region","t":"盐城市概况","b":"盐城位于江苏沿海中部，东临黄海。全市土地总面积1.77万平方千米，是江苏土地面积最大、海岸线最长的地级市。海岸线长582千米，占全省56%；沿海滩涂4553平方千米，占全省70%。","s":"盐城市人民政府网·盐城概况(2025盐城年鉴)"},{"i":137,"m":"region","t":"盐城行政区划","b":"盐城市下辖东台1个县级市，建湖、射阳、阜宁、滨海、响水5个县，盐都、亭湖、大丰3个区，另设盐城经济技术开发区和盐南高新技术产业开发区。至2024年底全市有30个街道、95个镇。","s":"盐城市人民政府网·政区沿革"},{"i":138,"m":"region","t":"盐城黄海湿地世界自然遗产","b":"2019年7月5日，中国黄(渤)海候鸟栖息地(第一期)列入《世界遗产名录》，是中国第54处世界遗产、第一块滨海湿地类型世界自然遗产。2022年6月8日盐城入选第二届国际湿地城市。2024年7月26日第二期列入。盐城黄海湿地是全球60%以上丹顶鹤种群的越冬地。","s":"盐城市人民政府网·城市标识"},{"i":139,"m":"region","t":"盐城红色资源：新四军重建军部","b":"皖南事变后，中共中央宣告在盐城重建新四军军部，陈毅任代军长，刘少奇任政委，盐城成为华中抗日的政治领导中心和军事指挥中心。2023年12月3日习近平总书记参观新四军纪念馆；2024年5月18日新四军纪念馆被评为国家一级博物馆。","s":"盐城市人民政府网·城市标识/政区沿革"},{"i":140,"m":"region","t":"盐城2026年政府工作报告要点","b":"2026年1月21日市长严汉平作报告。城市定位「国际湿地、沿海绿城、江淮门户」；「十四五」地区生产总值突破8000亿元；2026年目标GDP增长5.5%左右、一般公共预算收入增长2.5%以上；到2030年地区生产总值突破万亿，新能源装机容量超5000万千瓦。","s":"盐城市2026年政府工作报告"},{"i":141,"m":"region","t":"盐城淮剧与杂技","b":"盐城是淮剧发源地，有「淮剧之乡」之称，又是中国杂技发源地之一，淮剧和建湖杂技均列入国家级非物质文化遗产名录。中国海盐博物馆2024年5月18日被评为国家一级博物馆。","s":"盐城市人民政府网·城市标识"},{"i":142,"m":"region","t":"江苏省概况","b":"江苏简称「苏」，取江宁、苏州二府首字而得名，康熙六年(1667)建省，省会南京。全省陆域面积10.72万平方公里，海域3.75万平方公里，大陆海岸线954公里。长江横穿东西，大运河纵贯南北，素有「鱼米之乡」美誉。","s":"江苏省人民政府网·江苏概况/自然条件"},{"i":143,"m":"region","t":"江苏行政区划","b":"截至2025年12月31日，江苏共有13个设区市、95个县(市、区)(19个县、21个县级市、55个市辖区)。1983年实行市管县设11个市，1996年增设泰州、宿迁。昆山市、泰兴市、沭阳县为省直管试点市(县)。2025年末常住人口8518万，城镇化率76.2%。","s":"江苏省人民政府网·人口区划/政区沿革"},{"i":144,"m":"region","t":"江苏2025年经济数据","b":"2025年江苏地区生产总值142351.5亿元，增长5.3%；三次产业比重3.8:42.2:54.0；人均地区生产总值167040元；一般公共预算收入10245.7亿元；社会消费品零售总额46394.2亿元；进出口总额5.95万亿元；实际使用外资168.2亿美元，居全国首位。","s":"2025年江苏省国民经济和社会发展统计公报"},{"i":145,"m":"region","t":"江苏2026年政府工作报告要点","b":"2026年2月3日省长刘小涛作报告。2026年预期目标：地区生产总值增长5%，一般公共预算收入增长2%，城镇新增就业120万人，社会消费品零售总额增长5%左右，研发投入强度3.42%左右。「十五五」GDP年均增长5%左右。","s":"江苏省政府2026年政府工作报告"},{"i":146,"m":"region","t":"江苏昆曲保护","b":"昆曲传承六百年，是我国现存最古老的戏曲剧种之一，入选联合国教科文组织「人类口头和非物质遗产代表作」名录，位列首批国家级非遗名录传统戏剧类榜首。江苏是昆曲发源地和核心传承地，2026年7月省人大常委会审议《江苏省昆曲保护传承条例(草案)》。","s":"江苏省数据局转载新华日报"},{"i":147,"m":"mgmt","t":"公文种类：15种法定公文","b":"结论：《党政机关公文处理工作条例》规定15种公文。\n口诀：决议决定命令公报，公告通告意见通知，通报报告请示批复，议案函纪要。\n注：“通知书”“简报”“工作总结”不在15种内。","s":"中国政府网·党政机关公文处理工作条例"},{"i":148,"m":"mgmt","t":"公文条例概况","b":"结论：现行条例由中办、国办2012年4月印发，2012年7月1日起施行。\n要点：\n・适用于党政机关（含党的机关和行政机关）\n・取代了1996年党的机关条例和2000年行政机关办法\n・配套国标：GB/T 9704—2012《党政机关公文格式》","s":"中国政府网·党政机关公文处理工作条例"},{"i":149,"m":"mgmt","t":"请示 vs 报告（必考对比）","b":"结论：请示要批复，报告不要批复。\n| 项目 | 请示 | 报告 |\n| 行文 | 上行文 | 上行文 |\n| 目的 | 请求指示、批准 | 汇报工作、反映情况、答复询问 |\n| 时间 | 事前 | 事中事后 |\n| 回复 | 必须批复 | 不需批复 |\n铁律：报告中不得夹带请示事项。","s":"中国政府网·党政机关公文处理工作条例"},{"i":150,"m":"mgmt","t":"请示的行文规则","b":"结论：请示一文一事，一般只写一个主送机关。\n口诀：一文一事，一个主送，不得夹带，不抄下级。\n・不得在报告等非请示性公文中夹带请示事项\n・一般不得越级请示，特殊情况越级须抄送被越过机关\n・不得以个人名义向上级机关报送公文","s":"中国政府网·党政机关公文处理工作条例"},{"i":151,"m":"mgmt","t":"通告 vs 公告 vs 公报","b":"结论：公告面向国内外，通告面向一定范围，公报是公布重要决定或重大事项。\n| 公告 | 向国内外宣布重要事项或法定事项 |\n| 通告 | 在一定范围内公布应当遵守或周知的事项 |\n| 公报 | 公布重要决定或者重大事件 |\n记忆：公告范围最广，通告多是“禁止、限行、停水停电”类。","s":"中国政府网·党政机关公文处理工作条例"},{"i":152,"m":"mgmt","t":"决议 vs 决定","b":"结论：决议必须经会议讨论通过，决定不一定。\n| 决议 | 适用于会议讨论通过的重大决策事项 |\n| 决定 | 适用于对重要事项作出决策和部署、奖惩有关单位和人员、变更或撤销下级机关不适当的决定事项 |\n记忆：决议“会议通过”，决定“奖惩部署变更撤销”。","s":"中国政府网·党政机关公文处理工作条例"},{"i":153,"m":"mgmt","t":"命令（令）的适用","b":"结论：命令适用于四类情形，规格最高。\n・公布行政法规和规章\n・宣布施行重大强制性措施\n・批准授予和晋升衔级\n・嘉奖有关单位和人员\n注：嘉奖用命令，一般表彰用决定或通报。","s":"中国政府网·党政机关公文处理工作条例"},{"i":154,"m":"mgmt","t":"意见与通知","b":"结论：意见可上行、平行、下行，通知是使用最广的下行文。\n・意见：对重要问题提出见解和处理办法\n・通知：发布、传达要求下级机关执行和有关单位周知或者执行的事项，批转、转发公文\n口诀：通知“发布传达批转转发”。","s":"中国政府网·党政机关公文处理工作条例"},{"i":155,"m":"mgmt","t":"通报的三种用途","b":"结论：通报=表彰先进、批评错误、传达重要精神或告知重要情况。\n口诀：表扬、批评、传达。\n易混：通报侧重“告知、教育”，决定侧重“作出决策、奖惩”。","s":"中国政府网·党政机关公文处理工作条例"},{"i":156,"m":"mgmt","t":"批复、议案、纪要","b":"结论：三者各管一摊，别混。\n・批复：答复下级机关请示事项\n・议案：各级政府按法律程序向同级人大或其常委会提请审议事项\n・纪要：记载会议主要情况和议定事项\n注意：议案只能是政府对人大，不是任何机关都能用。","s":"中国政府网·党政机关公文处理工作条例"},{"i":157,"m":"mgmt","t":"函的适用","b":"结论：函用于不相隶属机关之间。\n适用：商洽工作、询问和答复问题、请求批准和答复审批事项。\n要点：\n・平行文，也可用于答复审批事项\n・去函用“请函复”，复函用“特此函复”\n・主管部门对无隶属关系的单位请求批准，用函不用请示","s":"中国政府网·党政机关公文处理工作条例"},{"i":158,"m":"mgmt","t":"行文方向速记","b":"结论：先看双方关系，再选文种。\n| 上行文 | 请示、报告 |\n| 平行文 | 函 |\n| 下行文 | 批复、命令、决定、通报等 |\n| 多向 | 意见、通知（部分） |\n口诀：上行请示报告，平行用函，批复向下。","s":"中国政府网·党政机关公文处理工作条例"},{"i":159,"m":"mgmt","t":"行文基本规则","b":"结论：行文要有必要、讲关系、讲授权。\n・根据隶属关系和职权范围行文\n・一般不得越级行文\n・部门之间对有关问题未协商一致，不得各自向下行文\n・部门内设机构除办公厅（室）外不得对外正式行文\n・党委、政府的部门依据职权可向下级相关部门行文","s":"中国政府网·党政机关公文处理工作条例"},{"i":160,"m":"mgmt","t":"联合行文规则","b":"结论：联合行文要同级、同系统，由最后签发日定成文日期。\n・同级党政机关、同级政府各部门可联合行文\n・上级政府部门与下级政府可联合行文\n・联合发文以最后签发机关负责人签发日期为成文日期\n・联合上报的公文由所有联署机关主要负责人签发","s":"中国政府网·党政机关公文处理工作条例"},{"i":161,"m":"mgmt","t":"公文格式三大板块","b":"结论：公文由版头、主体、版记三部分组成。\n| 版头 | 份号、密级和保密期限、紧急程度、发文机关标志、发文字号、签发人、分隔线 |\n| 主体 | 标题、主送机关、正文、附件说明、署名、成文日期、印章、附注、附件 |\n| 版记 | 分隔线、抄送机关、印发机关和印发日期、页码 |","s":"中国政府网·党政机关公文处理工作条例；GB/T 9704—2012"},{"i":162,"m":"mgmt","t":"发文字号写法","b":"结论：字号=机关代字+〔年份〕+序号。\n示例：国发〔2024〕3号\n规则：\n・年份用六角括号〔〕，不用方括号或圆括号\n・年份写全称，不能简写\n・序号不加“第”字，不编虚位（如不写001）","s":"GB/T 9704—2012《党政机关公文格式》"},{"i":163,"m":"mgmt","t":"层次序数与成文日期","b":"结论：四级序数按“一、→（一）→1.→（1）”排。\n口诀：一加顿，括一不加点，阿拉伯加点，括1无点。\n成文日期：用阿拉伯数字，年月日标全，月日不编虚位（写“2024年5月8日”，不写“05月08日”）。","s":"GB/T 9704—2012《党政机关公文格式》"},{"i":164,"m":"mgmt","t":"密级与紧急程度","b":"结论：密级分三级，紧急程度分两级（电报四级）。\n・密级：绝密、机密、秘密（后可标保密期限）\n・公文紧急程度：特急、加急\n・电报紧急程度：特提、特急、加急、平急\n口诀：密级由高到低“绝机秘”。","s":"中国政府网·党政机关公文处理工作条例"},{"i":165,"m":"mgmt","t":"附件、印章与页码","b":"结论：这几处细节常考判断题。\n・附件说明：正文下空一行左空二字，“附件”后加全角冒号\n・印章：端正、居中下压成文日期，印章压在日期上\n・页码：4号半角宋体阿拉伯数字，加“一字线”，如“- 1 -”\n・上行文应当标注签发人姓名","s":"GB/T 9704—2012《党政机关公文格式》"},{"i":166,"m":"mgmt","t":"发文办理流程","b":"结论：发文=草拟、审核、签发、复核、登记、印制、核发。\n口诀：拟、审、签、复、登、印、发。\n要点：\n・上行文由机关主要负责人或主持工作的负责人签发\n・复核重点：审批手续、内容、文种、格式","s":"中国政府网·党政机关公文处理工作条例"},{"i":167,"m":"mgmt","t":"收文办理流程","b":"结论：收文=签收、登记、初审、承办、传阅、催办、答复。\n口诀：签、登、初、承、传、催、答。\n注意：收文有“初审”“承办”“传阅”，发文才有“审核”“签发”“印制”，别混。","s":"中国政府网·党政机关公文处理工作条例"},{"i":168,"m":"mgmt","t":"公文用语对照","b":"结论：常用结语要配对记。\n| 请示 | 妥否，请批示 / 当否，请批复 |\n| 批复 | 此复 |\n| 通知 | 特此通知 |\n| 去函 | 请函复 |\n| 复函 | 特此函复 |\n| 报告 | 特此报告 |","s":"公文写作通行规范"},{"i":169,"m":"mgmt","t":"泰勒：科学管理","b":"结论：泰勒是“科学管理之父”，代表作《科学管理原理》（1911）。\n要点：\n・工时研究、标准化、差别计件工资\n・把管理从经验提升为科学\n・缺点：把工人当作“经济人”\n口诀：泰勒=效率、标准化、计件。","s":"管理学教材通行表述"},{"i":170,"m":"mgmt","t":"法约尔与韦伯","b":"结论：法约尔重管理职能，韦伯重行政组织。\n・法约尔：一般管理理论之父，五职能：计划、组织、指挥、协调、控制\n・韦伯：行政组织理论之父，“理想的行政组织体系”（官僚制）\n口诀：法约尔五职能，韦伯讲官僚。","s":"管理学教材通行表述"},{"i":171,"m":"mgmt","t":"梅奥：人际关系学说","b":"结论：梅奥通过霍桑实验提出人际关系学说，认为工人是“社会人”。\n要点：\n・企业中存在“非正式组织”\n・满足工人社会需求、提高士气才能提高效率\n对比：泰勒“经济人”，梅奥“社会人”。","s":"管理学教材通行表述"},{"i":172,"m":"mgmt","t":"马斯洛需求层次","b":"结论：需求由低到高分五层，满足一层才追求下一层。\n口诀：生、安、社、尊、自（生理、安全、社交、尊重、自我实现）。\n记法：吃饱→安稳→有朋友→被尊重→实现理想。","s":"管理学教材通行表述"},{"i":173,"m":"mgmt","t":"赫茨伯格双因素理论","b":"结论：保健因素防不满，激励因素促满意。\n| 保健因素 | 工资、工作条件、公司政策、人际关系（不具备会不满，具备也不一定满意） |\n| 激励因素 | 成就、认可、责任、晋升、工作本身 |\n口诀：保健防不满，激励才满意。","s":"管理学教材通行表述"},{"i":174,"m":"mgmt","t":"X理论与Y理论","b":"结论：麦格雷戈提出，X悲观，Y乐观。\n| X理论 | 人天生懒惰厌恶工作，需强制、监督、惩罚 |\n| Y理论 | 人愿意承担责任，可自我指导、自我控制 |\n口诀：X严管，Y放权。","s":"管理学教材通行表述"},{"i":175,"m":"mgmt","t":"期望、公平、强化理论","b":"结论：三个激励过程理论各有核心词。\n・弗鲁姆期望理论：激励力=效价×期望值\n・亚当斯公平理论：比较投入与报酬的比值（横比、纵比）\n・斯金纳强化理论：正强化、负强化、惩罚、消退\n口诀：期望看概率，公平看比较，强化看后果。","s":"管理学教材通行表述"},{"i":176,"m":"mgmt","t":"管理的四大职能","b":"结论：现代教材多用“计划、组织、领导、控制”四职能。\n・计划：确定目标和方案\n・组织：配置资源、设置岗位\n・领导：激励、沟通、指挥\n・控制：监督纠偏\n口诀：计组领控，前后相扣。","s":"管理学教材通行表述"},{"i":177,"m":"mgmt","t":"控制的三种类型","b":"结论：按时间分前馈、现场、反馈。\n| 前馈控制 | 事前预防，防患于未然 |\n| 现场控制 | 事中监督指导 |\n| 反馈控制 | 事后总结纠偏，亡羊补牢 |\n口诀：事前前馈，事中现场，事后反馈。","s":"管理学教材通行表述"},{"i":178,"m":"mgmt","t":"勒温三种领导风格","b":"结论：勒温将领导方式分为专制、民主、放任。\n・专制型：权力集中，下属被动\n・民主型：集体讨论，参与决策，效果通常最好\n・放任型：无为而治，效率最低\n口诀：专制集权，民主参与，放任无为。","s":"管理学教材通行表述"},{"i":179,"m":"mgmt","t":"SWOT与PDCA","b":"结论：两个常用分析和管理工具。\n・SWOT：优势S、劣势W、机会O、威胁T（内部SW，外部OT）\n・PDCA：计划Plan、执行Do、检查Check、处理Act，循环上升\n口诀：SW看自己，OT看环境；PDCA四步转圈。","s":"管理学教材通行表述"},{"i":180,"m":"mgmt","t":"管理幅度与层次","b":"结论：幅度越大，层次越少，呈反比。\n・管理幅度：一名领导直接管理的下属人数\n・幅度大→扁平化，沟通快但控制弱\n・幅度小→高耸型，控制严但层次多\n口诀：幅度宽，层次矮。","s":"管理学教材通行表述"},{"i":181,"m":"mgmt","t":"组织结构类型","b":"结论：五种常见结构各有适用场景。\n・直线制：指挥统一，适合小企业\n・职能制：专业分工，易多头领导\n・直线职能制：最常见\n・事业部制：分权，适合大型多元化企业\n・矩阵制：双重领导，灵活但易冲突","s":"管理学教材通行表述"},{"i":182,"m":"mgmt","t":"管理学效应速记","b":"结论：这几个“效应”常考。\n・木桶效应：最短板决定容量\n・马太效应：强者愈强，弱者愈弱\n・鲶鱼效应：引入竞争激活团队\n・破窗效应：小问题不管会恶化\n・彼得原理：层级中人会晋升到不胜任为止\n・手表定律：两块表反而不知准确时间","s":"管理学常识通行表述"},{"i":183,"m":"politics","t":"物质与意识","b":"结论：物质决定意识，意识反作用于物质。\n・物质第一性，意识第二性（唯物主义根本观点）\n・意识是人脑对客观世界的主观映象\n・意识能动性：能动地认识世界和改造世界\n易错：说“意识决定物质”是唯心主义。","s":"马克思主义基本原理教材通行表述"},{"i":184,"m":"politics","t":"哲学基本问题","b":"结论：思维和存在的关系问题是哲学基本问题。\n两方面：\n・第一性问题：物质与意识谁决定谁（划分唯物、唯心）\n・同一性问题：思维能否认识存在（划分可知论、不可知论）\n口诀：谁第一分唯物唯心，能不能认识分可知不可知。","s":"马克思主义基本原理教材通行表述"},{"i":185,"m":"politics","t":"实践是认识的基础","b":"结论：实践是认识的来源、动力、目的和检验真理的唯一标准。\n口诀：来源、动力、目的、标准。\n名句：“纸上得来终觉浅，绝知此事要躬行”“实践出真知”。\n注意：是“唯一标准”，不是之一。","s":"马克思主义基本原理教材通行表述"},{"i":186,"m":"politics","t":"真理的特性","b":"结论：真理是客观的、具体的，绝对性与相对性统一。\n・客观性：内容是客观的，不依赖人的意志\n・绝对性：任何真理都包含不依赖于人的客观内容\n・相对性：对客观事物的认识有范围、程度的限度\n易错：“真理因人而异”错误。","s":"马克思主义基本原理教材通行表述"},{"i":187,"m":"politics","t":"矛盾的同一性与斗争性","b":"结论：矛盾双方既统一又斗争，是事物发展的动力。\n・同一性：相互依存、相互贯通、相互转化\n・斗争性：相互排斥、相互分离\n成语：塞翁失马（转化）、唇亡齿寒（依存）、水火不容（斗争）。","s":"马克思主义基本原理教材通行表述"},{"i":188,"m":"politics","t":"主要矛盾与矛盾主要方面","b":"结论：两点论与重点论相统一。\n・主要矛盾：处于支配地位，起决定作用\n・矛盾的主要方面：决定事物性质\n方法：既要抓重点，又要全面看问题。\n反例：“眉毛胡子一把抓”（无重点），“只见一点不及其余”（无两点）。","s":"马克思主义基本原理教材通行表述"},{"i":189,"m":"politics","t":"共性与个性","b":"结论：矛盾的普遍性即共性，特殊性即个性，二者辩证统一。\n・普遍性：矛盾无处不在、无时不有\n・特殊性：具体事物各有自己的矛盾\n名句：“世界上没有两片完全相同的树叶”（个性）。\n方法：具体问题具体分析是马克思主义的活的灵魂。","s":"马克思主义基本原理教材通行表述"},{"i":190,"m":"politics","t":"量变与质变","b":"结论：量变是质变的必要准备，质变是量变的必然结果。\n成语：\n・量变：积土成山、水滴石穿、千里之堤毁于蚁穴\n・质变：脱胎换骨、焕然一新\n・部分质变：量变中有部分质变\n口诀：量变积累，质变飞跃。","s":"马克思主义基本原理教材通行表述"},{"i":191,"m":"politics","t":"否定之否定","b":"结论：发展是螺旋式上升或波浪式前进，前途光明、道路曲折。\n・辩证否定：自我否定，既克服又保留（扬弃）\n・肯定→否定→否定之否定\n名句：“山重水复疑无路，柳暗花明又一村”。\n易错：形而上学否定是“全盘否定”。","s":"马克思主义基本原理教材通行表述"},{"i":192,"m":"politics","t":"联系与发展","b":"结论：联系是普遍的、客观的，发展是新事物代替旧事物。\n・联系：客观性、普遍性、多样性\n・发展：实质是新事物产生、旧事物灭亡\n・新事物：符合历史前进方向、具有强大生命力\n名句：牵一发而动全身（联系）。","s":"马克思主义基本原理教材通行表述"},{"i":193,"m":"politics","t":"现象与本质、内因与外因","b":"结论：透过现象看本质，内因是根据，外因是条件。\n・现象与本质：本质决定现象，现象表现本质\n・内因：事物变化的根据；外因：条件，通过内因起作用\n名句：“鸡蛋从外打破是食物，从内打破是生命”。","s":"马克思主义基本原理教材通行表述"},{"i":194,"m":"politics","t":"社会基本矛盾","b":"结论：社会基本矛盾是社会发展的根本动力。\n两对：\n・生产力与生产关系（生产力决定生产关系）\n・经济基础与上层建筑（经济基础决定上层建筑）\n口诀：生产力最活跃最革命，上层建筑为经济基础服务。","s":"马克思主义基本原理教材通行表述"},{"i":195,"m":"politics","t":"社会存在与人民群众","b":"结论：社会存在决定社会意识，人民群众是历史的创造者。\n・社会存在：物质生活条件（地理环境、人口、生产方式）\n・社会意识：能动反作用\n・人民群众：物质财富、精神财富和社会变革的创造者\n名句：“群众是真正的英雄”。","s":"马克思主义基本原理教材通行表述"},{"i":196,"m":"politics","t":"新民主主义革命总路线","b":"结论：无产阶级领导的、人民大众的、反对帝国主义封建主义官僚资本主义的革命。\n三大法宝：统一战线、武装斗争、党的建设。\n道路：农村包围城市、武装夺取政权。\n口诀：领导是无产阶级，对象是“三座大山”。","s":"毛泽东思想和中国特色社会主义理论体系概论教材"},{"i":197,"m":"politics","t":"毛泽东思想活的灵魂","b":"结论：实事求是、群众路线、独立自主。\n・实事求是：思想路线的核心\n・群众路线：一切为了群众、一切依靠群众、从群众中来到群众中去\n・独立自主：立足点\n易混：统一战线是三大法宝，不是“活的灵魂”。","s":"毛泽东思想和中国特色社会主义理论体系概论教材"},{"i":198,"m":"politics","t":"党史时间轴（1921-1949）","b":"结论：先背大事年。\n・1921.7 中共一大（上海，最后一天转嘉兴南湖）\n・1927 八一南昌起义；八七会议；秋收起义→井冈山\n・1935.1 遵义会议\n・1937 七七事变，全面抗战\n・1945 七大，毛泽东思想写入党章\n・1949.10.1 新中国成立","s":"中国政府网/党史教材通行表述"},{"i":199,"m":"politics","t":"党史时间轴（1949-1978）","b":"结论：新中国成立后的重要节点。\n・1950-1953 抗美援朝\n・1953-1956 三大改造（农业、手工业、资本主义工商业）\n・1954 一届全国人大，第一部宪法\n・1956 八大；社会主义制度基本确立\n・1978.12 十一届三中全会，改革开放","s":"党史教材通行表述"},{"i":200,"m":"politics","t":"重要会议与转折","b":"结论：三个会议是重要转折。\n| 遵义会议（1935） | 确立毛泽东在党中央和红军的领导地位 |\n| 七大（1945） | 确立毛泽东思想为党的指导思想 |\n| 十一届三中全会（1978） | 实现伟大历史转折，开启改革开放 |","s":"党史教材通行表述"},{"i":201,"m":"politics","t":"三个历史决议","b":"结论：党史上有三个历史决议。\n| 1945年 | 《关于若干历史问题的决议》 |\n| 1981年 | 《关于建国以来党的若干历史问题的决议》 |\n| 2021年 | 《中共中央关于党的百年奋斗重大成就和历史经验的决议》（十九届六中全会） |\n口诀：1945、1981、2021，每个都与总结历史相关。","s":"党史教材通行表述"},{"i":202,"m":"politics","t":"理论成果对应表","b":"结论：中国特色社会主义理论体系四大成果。\n・邓小平理论：十五大写入党章\n・“三个代表”重要思想：江泽民提出\n・科学发展观：十七大写入党章，第一要义发展\n・习近平新时代中国特色社会主义思想：十九大确立\n口诀：邓、三、科、习。","s":"毛概教材；中国政府网"},{"i":203,"m":"politics","t":"邓小平三步走","b":"结论：三步走战略是邓小平提出的现代化战略。\n・第一步：解决温饱\n・第二步：达到小康\n・第三步：21世纪中叶基本实现现代化\n配套：党的基本路线“一个中心、两个基本点”（经济建设为中心，四项基本原则、改革开放）。","s":"毛概教材通行表述"},{"i":204,"m":"politics","t":"一国两制与统一","b":"结论：一国两制是解决香港、澳门、台湾问题的基本方针。\n・1997.7.1 香港回归\n・1999.12.20 澳门回归\n・提出人：邓小平\n口诀：香港97，澳门99。","s":"毛概教材；中国政府网"},{"i":205,"m":"politics","t":"十九大：新时代主要矛盾","b":"结论：新时代主要矛盾是人民日益增长的美好生活需要和不平衡不充分的发展之间的矛盾。\n・确立习近平新时代中国特色社会主义思想\n・提出两个阶段：2035基本实现现代化，本世纪中叶建成社会主义现代化强国\n・社会主要矛盾变化不改变“最大国情”（初级阶段）","s":"中国政府网·十九大报告"},{"i":206,"m":"politics","t":"二十大概况","b":"结论：二十大主题是团结奋斗。\n・2022年10月16日至22日在北京召开\n・使命任务：以中国式现代化全面推进中华民族伟大复兴\n・选举产生第二十届中央委员会，习近平连任总书记\n・强调“两个结合”，坚持“两个确立”","s":"中国政府网·二十大报告"},{"i":207,"m":"politics","t":"中国式现代化五个特色","b":"结论：中国式现代化是人口规模巨大的现代化等五个方面。\n口诀：人口、共富、两个文明、和谐、和平。\n・人口规模巨大\n・全体人民共同富裕\n・物质文明和精神文明相协调\n・人与自然和谐共生\n・走和平发展道路","s":"中国政府网·二十大报告"},{"i":208,"m":"politics","t":"新发展理念","b":"结论：创新、协调、绿色、开放、共享。\n・创新：发展动力\n・协调：发展不平衡问题\n・绿色：人与自然和谐\n・开放：内外联动\n・共享：公平正义\n出处：十八届五中全会（2015年）提出。","s":"中国政府网"},{"i":209,"m":"politics","t":"五位一体与四个全面","b":"结论：总体布局五位一体，战略布局四个全面。\n五位一体：经济、政治、文化、社会、生态文明建设\n四个全面：全面建设社会主义现代化国家、全面深化改革、全面依法治国、全面从严治党\n口诀：五位一体“经政文社生”。","s":"中国政府网·二十大报告"},{"i":210,"m":"politics","t":"两个结合与四个自信","b":"结论：两个结合是创新的根本途径。\n・第一个结合：马克思主义基本原理同中国具体实际相结合\n・第二个结合：同中华优秀传统文化相结合\n四个自信：道路自信、理论自信、制度自信、文化自信。","s":"中国政府网·二十大报告"},{"i":211,"m":"politics","t":"历届全会主题速记（十八届-二十届）","b":"结论：按届次记主题。\n・十八届三中：全面深化改革\n・十八届四中：全面依法治国\n・十八届五中：五大发展理念\n・十九届四中：国家制度和治理体系\n・十九届六中：党的百年历史决议\n・二十届二中：党和国家机构改革\n・二十届三中：进一步全面深化改革","s":"中国政府网/人民网党史资料"},{"i":212,"m":"politics","t":"二十届四中全会","b":"结论：2025年10月20日至23日召开，审议通过“十五五”规划建议。\n・通过《中共中央关于制定国民经济和社会发展第十五个五年规划的建议》\n・“十五五”时期指2026-2030年\n・强调“投资于人”，加快建设健康中国\n来源：官方公报及通行解读。","s":"贵州省人民政府转载新华社文件"},{"i":213,"m":"politics","t":"习近平重要思想关键词","b":"结论：几个常考理念要对应记。\n・“绿水青山就是金山银山”：2005年浙江安吉余村\n・新质生产力：2023年9月黑龙江考察提出\n・人类命运共同体\n・总体国家安全观：2014年提出\n・全过程人民民主","s":"人民网/新华网通行表述"},{"i":214,"m":"politics","t":"党的建设与全面从严治党","b":"结论：全面从严治党是新时代党的建设的鲜明特点。\n・党的领导是中国特色社会主义最本质的特征\n・党的自我革命是第二个答案\n・“八项规定”：2012年12月中央政治局提出\n口诀：作风建设永远在路上。","s":"新华网/人民网通行表述"},{"i":215,"m":"econ","t":"需求定理与供给定理","b":"结论：价格上升，需求量下降；价格上升，供给量上升。\n・需求定理：需求量与价格反方向变动\n・供给定理：供给量与价格同方向变动\n・均衡价格：需求曲线与供给曲线交点\n口诀：买的反着来，卖的顺着来。","s":"西方经济学教材通行表述"},{"i":216,"m":"econ","t":"需求价格弹性","b":"结论：弹性>1富有弹性，降价增收；<1缺乏弹性，降价减收。\n| Ed>1 | 富有弹性（奢侈品、高档品）→薄利多销 |\n| Ed<1 | 缺乏弹性（生活必需品、农产品）→谷贱伤农 |\n| Ed=1 | 单位弹性，价格变动总收益不变 |","s":"西方经济学教材通行表述"},{"i":217,"m":"econ","t":"替代品与互补品","b":"结论：替代品同向，互补品反向。\n・替代品（猪肉与牛肉）：A涨价→B需求上升\n・互补品（汽车与汽油）：A涨价→B需求下降\n・正常品：收入上升需求上升\n・低档品：收入上升需求下降","s":"西方经济学教材通行表述"},{"i":218,"m":"econ","t":"边际效用与机会成本","b":"结论：边际效用递减；机会成本=放弃的最大收益。\n・边际效用递减规律：连续消费同一物品，新增一单位带来的满足感逐渐减少\n・机会成本：选A放弃的次优选择的价值\n例：上大学放弃的工资是机会成本。","s":"西方经济学教材通行表述"},{"i":219,"m":"econ","t":"四种市场结构","b":"结论：竞争程度由高到低。\n| 完全竞争 | 厂商众多、产品同质、自由进出（理想模型，如农产品） |\n| 垄断竞争 | 产品有差别（如餐饮） |\n| 寡头 | 少数厂商（如手机、汽车） |\n| 完全垄断 | 独家（如自来水、铁路） |","s":"西方经济学教材通行表述"},{"i":220,"m":"econ","t":"市场失灵与外部性","b":"结论：市场失灵需要政府干预。\n四种原因：垄断、外部性、公共物品、信息不对称。\n・正外部性：养蜂人使果树授粉\n・负外部性：工厂排污\n・公共物品：非竞争性、非排他性（国防、路灯）","s":"西方经济学教材通行表述"},{"i":221,"m":"econ","t":"GDP概念","b":"结论：GDP=一定时期内一国（地区）生产的最终产品与服务价值，国土原则。\n・GDP按“国土原则”（本国境内）\n・GNP按“国民原则”（本国居民）\n・支出法：C+I+G+（X-M）\n不计入：二手货、家务劳动、转移支付、股票交易、非法交易。","s":"国家统计局/西方经济学教材通行表述"},{"i":222,"m":"econ","t":"名义与实际GDP、三驾马车","b":"结论：实际GDP剔除价格变动，增长率更能反映经济增长。\n・名义GDP：当年价格\n・实际GDP：不变价格\n三驾马车：消费、投资、出口（净出口）\n口诀：“吃穿住行”靠消费，“盖楼修路”靠投资，“国际贸易”靠出口。","s":"国家统计局/西方经济学教材通行表述"},{"i":223,"m":"econ","t":"CPI与PPI","b":"结论：CPI看消费，PPI看生产。\n・CPI：居民消费价格指数，反映通货膨胀水平\n・PPI：工业生产者出厂价格指数，反映上游价格\n・传导：PPI→CPI（上游传导到下游）\n・CPI同比3%以上常被视为明显通胀。","s":"国家统计局"},{"i":224,"m":"econ","t":"通胀与通缩","b":"结论：通胀=物价持续普遍上涨；通缩=持续普遍下跌。\n・通胀成因：需求拉动、成本推动、结构性\n・通缩危害：企业利润下降、失业增加\n・恶性通胀：月率超过50%\n口诀：通胀钱不值钱，通缩钱更值钱但经济萧条。","s":"西方经济学教材通行表述"},{"i":225,"m":"econ","t":"失业类型","b":"结论：摩擦性、结构性、周期性三类。\n| 摩擦性 | 求职过程中的暂时失业 |\n| 结构性 | 技能与岗位不匹配 |\n| 周期性 | 经济衰退导致 |\n自然失业率=摩擦性+结构性。\n我国统计口径：城镇调查失业率。","s":"西方经济学教材；国家统计局"},{"i":226,"m":"econ","t":"基尼系数","b":"结论：基尼系数衡量收入分配差距，0-1之间，越大越不平等。\n・0：绝对平均\n・1：绝对不平均\n・0.4：国际通行警戒线\n・0.2以下：过于平均\n口诀：越小越平均，0.4警惕。","s":"国家统计局/教材通行表述"},{"i":227,"m":"econ","t":"恩格尔系数","b":"结论：恩格尔系数=食品支出占消费支出比重，越低越富裕。\n联合国标准：\n・60%以上：贫困\n・50%-60%：温饱\n・40%-50%：小康\n・30%-40%：富裕\n・30%以下：最富裕\n口诀：食物占比越低，生活越好。","s":"国家统计局/联合国粮农组织通行标准"},{"i":228,"m":"econ","t":"货币的五大职能","b":"结论：价值尺度和流通手段是基本职能。\n五职能：价值尺度、流通手段、贮藏手段、支付手段、世界货币。\n・价值尺度：给商品定价\n・流通手段：商品交换媒介（一手钱一手货）\n・支付手段：赊购、缴税、发工资","s":"政治经济学教材通行表述"},{"i":229,"m":"econ","t":"M0、M1、M2","b":"结论：层次越高流动性越弱。\n| M0 | 流通中现金 |\n| M1 | M0+单位活期存款 |\n| M2 | M1+居民储蓄存款+单位定期存款+其他存款 |\n口诀：M0现金，M1狭义，M2广义。","s":"中国人民银行"},{"i":230,"m":"econ","t":"货币政策三大工具","b":"结论：存款准备金率、再贴现率、公开市场业务。\n| 紧缩 | 提高准备金率、提高再贴现率、卖出债券 |\n| 宽松 | 降准、降低再贴现率、买入债券 |\n口诀：准备金、再贴现、公开市场，松则降紧则升。","s":"中国人民银行/教材通行表述"},{"i":231,"m":"econ","t":"财政政策","b":"结论：扩张性（积极）政策减税增支，紧缩性政策加税减支。\n工具：政府购买、转移支付、税收、国债。\n・经济衰退→扩张\n・经济过热→紧缩\n与货币政策配合使用，称“宏观调控”。","s":"西方经济学教材通行表述"},{"i":232,"m":"econ","t":"税收的三性与分类","b":"结论：税收具有强制性、无偿性、固定性。\n・直接税：个人所得税、企业所得税（纳税人=负税人）\n・间接税：增值税、消费税（可转嫁）\n・流转税：增值税、消费税、关税\n口诀：强无固，间接转嫁。","s":"财政学教材通行表述"},{"i":233,"m":"econ","t":"几个常考税种","b":"结论：记住税率和性质。\n・增值税：基本税率13%（另有9%、6%），价外税\n・消费税：特定消费品（烟酒、高档化妆品）\n・企业所得税：基本税率25%\n・个税综合所得基本减除费用5000元/月（2018年10月起）","s":"国家税务总局/财政部"},{"i":234,"m":"econ","t":"财政收支与预算","b":"结论：财政赤字=支出>收入，需用国债弥补。\n・财政盈余：收入>支出\n・国债：政府债务，被称为“金边债券”\n・四本预算：一般公共预算、政府性基金预算、国有资本经营预算、社会保险基金预算","s":"《预算法》；财政部"},{"i":235,"m":"econ","t":"汇率变动影响","b":"结论：本币升值不利出口、有利进口和出境游。\n・本币升值：外币买得更多，进口便宜\n・本币贬值：出口商品更便宜，利于出口，不利于进口\n口诀：升值利进口，贬值利出口。","s":"国际金融教材通行表述"},{"i":236,"m":"econ","t":"价值规律与社会必要劳动时间","b":"结论：商品价值量由社会必要劳动时间决定，价格围绕价值上下波动。\n・使用价值：有用性（质的方面）\n・价值：凝结的无差别人类劳动\n・供大于求→价格低于价值；供不应求→价格高于价值","s":"政治经济学教材通行表述"},{"i":237,"m":"econ","t":"我国基本经济制度","b":"结论：三项：公有制为主体多种所有制并存、按劳分配为主多种分配方式并存、社会主义市场经济体制。\n出处：十九届四中全会（2019）把后两项提升为基本经济制度。\n口诀：所有制、分配、市场，三位一体。","s":"中国政府网/人民网"},{"i":238,"m":"econ","t":"新发展格局","b":"结论：以国内大循环为主体、国内国际双循环相互促进。\n・核心：扩大内需\n・主线：供给侧结构性改革\n・最终目的：满足人民美好生活需要\n口诀：内循环为主，双循环互促。","s":"新华网/人民网"},{"i":239,"m":"econ","t":"经济周期与乘数","b":"结论：周期四阶段，乘数放大投资效应。\n・周期：繁荣→衰退→萧条→复苏\n・乘数：投入1单位投资，最终拉动的总产出大于1单位\n・菲利普斯曲线：短期内失业率与通胀率此消彼长","s":"西方经济学教材通行表述"},{"i":240,"m":"econ","t":"共同富裕与分配","b":"结论：共同富裕是社会主义的本质要求，是中国式现代化的重要特征。\n・三次分配：初次分配（市场）、再分配（政府）、第三次分配（慈善公益）\n・原则：坚持按劳分配为主体\n・中等收入群体：扩大比重","s":"中国政府网·二十大报告"},{"i":241,"m":"law","t":"宪法的基本情况","b":"现行宪法是1982年12月4日通过的“八二宪法”，已5次修正：1988、1993、1999、2004、2018年。\n每年12月4日是国家宪法日（2014年确定）。\n口诀：八二宪法，五次修正；十二月四日宪法日。","s":"中国人大网·国家法律法规数据库"},{"i":242,"m":"law","t":"国家性质与根本制度","b":"我国是工人阶级领导的、以工农联盟为基础的人民民主专政的社会主义国家。\n社会主义制度是中国特色社会主义最本质的特征所系：中国共产党领导是中国特色社会主义最本质的特征（2018年修正写入）。\n根本政治制度：人民代表大会制度。","s":"中国人大网·国家法律法规数据库"},{"i":243,"m":"law","t":"国家机构一张表","b":"全国人大：最高国家权力机关；常委会是其常设机关。\n国务院：最高国家行政机关（中央人民政府）。\n国家监察委员会：国家的监察机关（2018年入宪）。\n最高法：最高审判机关；最高检：法律监督机关。\n中央军委：领导全国武装力量。","s":"中国人大网·国家法律法规数据库"},{"i":244,"m":"law","t":"任期与年龄要点","b":"全国人大、国务院、法院检察院每届任期都是5年。\n2018年修正取消了国家主席“连续任职不得超过两届”的限制，主席任期每届仍为5年。\n选举权：年满18周岁的公民（依法被剥夺政治权利的除外）。\n被选举为国家主席：年满45周岁。","s":"中国人大网·国家法律法规数据库"},{"i":245,"m":"law","t":"公民的基本义务","b":"宪法规定的基本义务：维护国家统一和民族团结、遵守宪法法律、维护祖国安全荣誉利益、依法纳税、依法服兵役。\n对比：受教育、劳动既是权利又是义务。\n口诀：税兵教劳，守法护国。","s":"中国人大网·国家法律法规数据库"},{"i":246,"m":"law","t":"法律的效力位阶","b":"宪法>法律>行政法规>地方性法规、规章。\n法律由全国人大及其常委会制定；行政法规由国务院制定。\n同一机关：新法优于旧法，特别法优于一般法。\n口诀：宪法最高，上位优先。","s":"中国人大网·国家法律法规数据库"},{"i":247,"m":"law","t":"宪法宣誓制度","b":"2018年修宪将宪法宣誓制度写入宪法。\n国家工作人员就职时应当依照法律规定公开进行宪法宣誓。\n对比：宣誓不是走过场，是对宪法忠诚的法定仪式。","s":"中国人大网·国家法律法规数据库"},{"i":248,"m":"law","t":"民法典概览","b":"民法典2020年5月28日通过，2021年1月1日施行，共7编加附则，1260条。\n七编：总则、物权、合同、人格权、婚姻家庭、继承、侵权责任。\n口诀：总物合人，婚继侵权。\n同时废止婚姻法、继承法、民法通则、合同法、物权法等。","s":"中国人大网·国家法律法规数据库"},{"i":249,"m":"law","t":"民事行为能力年龄","b":"18周岁以上：成年人，完全民事行为能力。\n16周岁以上、以自己劳动收入为主要生活来源：视为完全民事行为能力人。\n8周岁以上未成年人：限制民事行为能力人（民法典由10岁下调到8岁）。\n不满8周岁：无民事行为能力人。","s":"中国人大网·国家法律法规数据库"},{"i":250,"m":"law","t":"民事法律行为效力","b":"有效要件：行为人有相应行为能力、意思表示真实、不违反法律强制性规定和公序良俗。\n无效：无民事行为能力人实施的、虚假表示、违法或违背公序良俗的。\n可撤销：重大误解、欺诈、胁迫、显失公平。\n对比：无效自始无效；可撤销要经撤销权人行使。","s":"中国人大网·国家法律法规数据库"},{"i":251,"m":"law","t":"诉讼时效","b":"普通诉讼时效3年，自知道或应当知道权利受损害之日起算。\n最长保护期限20年（从权利受损害之日起算）。\n时效届满，债务人取得抗辩权，债务并不消灭。\n口诀：三年普通，二十封顶。","s":"中国人大网·国家法律法规数据库"},{"i":252,"m":"law","t":"物权变动规则","b":"不动产物权：登记时发生效力（买房要过户登记）。\n动产物权：交付时发生效力（一手交钱一手交货）。\n例外：船舶、航空器、机动车，未经登记不得对抗善意第三人。\n口诀：不动产登记，动产交付。","s":"中国人大网·国家法律法规数据库"},{"i":253,"m":"law","t":"要约与要约邀请","b":"要约：希望订立合同的意思表示，对方承诺即成立合同（如悬赏广告）。\n要约邀请：拍卖公告、招标公告、招股说明书、商业广告和宣传、寄送价目表等。\n对比：邀请不约束，要约有约束。\n商业广告内容符合要约条件的，视为要约。","s":"中国人大网·国家法律法规数据库"},{"i":254,"m":"law","t":"结婚与离婚规则","b":"法定婚龄：男不得早于22周岁，女不得早于20周岁。\n协议离婚设30日离婚冷静期，期间任何一方可撤回申请。\n禁止结婚：直系血亲和三代以内旁系血亲。\n对比：登记离婚有冷静期，诉讼离婚无冷静期。","s":"中国人大网·国家法律法规数据库"},{"i":255,"m":"law","t":"法定继承顺序","b":"第一顺序：配偶、子女、父母。\n第二顺序：兄弟姐妹、祖父母、外祖父母。\n有第一顺序继承人，第二顺序不继承。\n民法典新增代位继承：被继承人的兄弟姐妹的子女也可代位。\n口诀：配子父为首，兄姐祖父母次之。","s":"中国人大网·国家法律法规数据库"},{"i":256,"m":"law","t":"遗嘱形式","b":"遗嘱形式：自书、代书、打印、录音录像、口头、公证遗嘱。\n打印、录像遗嘱是民法典新增，需两个以上见证人。\n民法典取消了“公证遗嘱效力优先”，以最后所立遗嘱为准。\n继承人、受遗赠人不得作遗嘱见证人。","s":"中国人大网·国家法律法规数据库"},{"i":257,"m":"law","t":"侵权责任重点","b":"高空抛物坠物：难以确定具体侵权人的，由可能加害的建筑物使用人补偿；物业应采取安全保障措施。\n自甘风险：自愿参加有风险的文体活动受损，一般不能向他人索赔。\n好人条款：自愿实施紧急救助造成受助人损害，不承担民事责任（第184条）。","s":"中国人大网·国家法律法规数据库"},{"i":258,"m":"law","t":"人格权与个人信息","b":"民法典人格权独立成编。\n生命权、身体权、健康权、姓名权、名誉权、隐私权等受保护。\n禁止以丑化、污损或利用信息技术手段伪造等方式侵害他人肖像权（防AI换脸）。\n个人信息保护法2021年11月1日施行。","s":"中国人大网·国家法律法规数据库"},{"i":259,"m":"law","t":"刑法三大基本原则","b":"罪刑法定：法律没有明文规定不为罪，不处罚。\n适用刑法人人平等：任何人犯罪都适用，不允许特权。\n罪责刑相适应：刑罚的轻重与罪行和刑事责任相称。\n口诀：法定、平等、相适应。","s":"中国人大网·国家法律法规数据库"},{"i":260,"m":"law","t":"刑事责任年龄","b":"不满12周岁：不负刑事责任。\n12至14周岁：仅故意杀人、故意伤害致人死亡或以特别残忍手段致人重伤造成严重残疾，情节恶劣，经最高检核准追诉。\n14至16周岁：对八类严重犯罪负责（杀人、伤害致死、强奸、抢劫、贩毒、放火、爆炸、投放危险物质）。\n16周岁以上：完全负刑事责任。","s":"中国人大网·国家法律法规数据库"},{"i":261,"m":"law","t":"刑罚种类","b":"主刑五种：管制、拘役、有期徒刑、无期徒刑、死刑。\n附加刑四种：罚金、剥夺政治权利、没收财产、驱逐出境。\n期限：管制3个月至2年；拘役1个月至6个月；有期徒刑6个月至15年。\n对比：主刑只能单处，附加刑可附加也可独立适用。","s":"中国人大网·国家法律法规数据库"},{"i":262,"m":"law","t":"正当防卫与紧急避险","b":"正当防卫：对正在进行的不法侵害，为保护合法权益而对不法侵害人造成损害，不负刑事责任。\n明显超过必要限度造成重大损害的，是防卫过当，应负刑责但减轻或免除处罚。\n对行凶、杀人、抢劫、强奸、绑架等严重暴力犯罪的防卫，造成伤亡不属防卫过当。\n紧急避险：为避免正在发生的危险，损害较小的利益保全较大的利益。","s":"中国人大网·国家法律法规数据库"},{"i":263,"m":"law","t":"自首与立功","b":"自首：犯罪后自动投案，如实供述自己罪行。\n对于自首的，可以从轻或减轻处罚；犯罪较轻的，可以免除处罚。\n立功：检举揭发他人犯罪、提供重要线索等。\n对比：坦白不等于自首，坦白是被动归案后如实供述。","s":"中国人大网·国家法律法规数据库"},{"i":264,"m":"law","t":"刑法修正案十一与十二","b":"刑法修正案（十一）：2021年3月1日施行，下调刑事责任年龄至特定情形12周岁，增设高空抛物罪、妨害安全驾驶罪等。\n刑法修正案（十二）：2024年3月1日施行，加大对民营企业内部人员腐败行为的惩治。\n口诀：十一管童（12岁），十二护民企。","s":"中国人大网·国家法律法规数据库"},{"i":265,"m":"law","t":"治安管理处罚种类","b":"治安管理处罚四种：警告、罚款、行政拘留、吊销公安机关发放的许可证。\n行政拘留1日以上15日以下；数行为合并执行不超过20日。\n警告和罚款适用于情节较轻。\n对比：治安处罚由公安机关决定，法院不参与。","s":"中国人大网·国家法律法规数据库"},{"i":266,"m":"law","t":"新治安管理处罚法","b":"新修订的治安管理处罚法2025年6月27日通过，2026年1月1日起施行。\n要点：加大对高空抛物、扰乱公共秩序、无人机违规飞行（“黑飞”）、侵害英烈名誉荣誉等行为的规制。\n未成年人、孕妇等特定人员依法不执行行政拘留，但情节严重或一年内二次以上违反的除外。","s":"中国人大网·国家法律法规数据库"},{"i":267,"m":"law","t":"行政处罚法要点","b":"行政处罚法2021年7月15日起施行。\n种类：警告、通报批评；罚款、没收违法所得、没收非法财物；暂扣或吊销许可证件、降低资质等级；限制开展生产经营活动、责令停产停业、限制从业；行政拘留。\n“一事不再罚”：对当事人同一违法行为，不得给予两次以上罚款。\n不满14周岁的人有违法行为的，不予行政处罚。","s":"中国人大网·国家法律法规数据库"},{"i":268,"m":"law","t":"行政复议新规","b":"行政复议法修订后2024年1月1日起施行。\n申请期限：自知道或应当知道该行政行为之日起60日内。\n复议机关是“上一级”行政机关或本级政府。\n对比：行政复议可审查合法性与合理性；行政诉讼原则上只审合法性。","s":"中国人大网·国家法律法规数据库"},{"i":269,"m":"law","t":"行政诉讼要点","b":"行政诉讼俗称“民告官”，被告一定是行政机关或法律法规授权的组织。\n起诉期限：知道行政行为之日起6个月内。\n原则上不适用调解（行政赔偿、补偿及裁量权案件除外）。\n行政诉讼期间，一般不停止行政行为的执行。","s":"中国人大网·国家法律法规数据库"},{"i":270,"m":"law","t":"行政许可与强制","b":"行政许可法2004年7月1日施行：政府可以设定的许可，必须是法律、行政法规规定，或国务院决定。\n行政强制措施：查封、扣押、冻结、限制公民人身自由等。\n行政强制执行：加处罚款、划拨存款、拍卖、代履行。\n口诀：措施保全，执行实现。","s":"中国人大网·国家法律法规数据库"},{"i":271,"m":"law","t":"劳动合同订立","b":"用人单位自用工之日起即与劳动者建立劳动关系，应在一个月内订立书面劳动合同。\n超过1个月不满1年未订立：每月支付二倍工资，最长11个月。\n超过1年未订立，视为已订立无固定期限劳动合同。\n不得向劳动者收取押金，不得扣押证件。","s":"中国人大网·国家法律法规数据库"},{"i":272,"m":"law","t":"试用期规定","b":"合同期3个月以上不满1年：试用期不超过1个月。\n1年以上不满3年：不超过2个月。\n3年以上固定期限和无固定期限：不超过6个月。\n同一用人单位与同一劳动者只能约定一次试用期。\n3个月以下合同、以完成一定任务为期限的合同不得约定试用期。","s":"中国人大网·国家法律法规数据库"},{"i":273,"m":"law","t":"无固定期限劳动合同","b":"劳动者在该单位连续工作满10年，提出续订，应订立无固定期限合同。\n连续订立二次固定期限劳动合同后续订，应订立无固定期限合同。\n用人单位自用工之日起满1年不订立书面合同，视为无固定期限。\n口诀：十年、两次、一年。","s":"中国人大网·国家法律法规数据库"},{"i":274,"m":"law","t":"经济补偿与赔偿金","b":"经济补偿按工作年限每满1年支付1个月工资，6个月以上不满1年按1年算，不满6个月按半个月。\n违法解除或终止：支付赔偿金，为经济补偿的2倍（2N）。\n劳动者主动辞职（无单位过错）一般没有经济补偿。\n口诀：N合法，2N违法。","s":"中国人大网·国家法律法规数据库"},{"i":275,"m":"law","t":"工时与加班费","b":"国家实行劳动者每日工作不超过8小时、平均每周不超过44小时（实际按国务院规定每周40小时）。\n加班工资：平日延长1.5倍；休息日安排加班又不补休2倍；法定节假日3倍。\n每周至少休息1日。\n对比：只有法定节假日是3倍。","s":"中国人大网·国家法律法规数据库"},{"i":276,"m":"law","t":"社会保险五险","b":"五险：养老、医疗、失业、工伤、生育。\n工伤保险和生育保险由用人单位缴纳，个人不缴。\n养老、医疗、失业三险单位个人共同缴费。\n口诀：单位全包工和育，三险共担。","s":"中国人大网·国家法律法规数据库"},{"i":277,"m":"law","t":"渐进式延迟退休","b":"自2025年1月1日起施行，用15年逐步实施。\n男职工法定退休年龄从60岁逐步延至63岁；\n女干部从55岁延至58岁，女工人从50岁延至55岁。\n养老保险最低缴费年限从15年逐步提至20年。\n保持自愿弹性，不搞一刀切。","s":"中国政府网"},{"i":278,"m":"law","t":"民营经济促进法","b":"2025年4月30日通过，2025年5月20日起施行。\n我国第一部专门关于民营经济发展的基础性法律。\n强调平等对待民营经济组织，保护其合法权益，依法保护民营企业家财产权。\n口诀：平等对待，依法保护。","s":"中国人大网·国家法律法规数据库"},{"i":279,"m":"law","t":"增值税法与税收法定","b":"增值税法2024年12月25日通过，2026年1月1日起施行。\n税收法定：税种设立、税率确定须由法律规定。\n至此我国18个税种已有多数完成立法。\n对比：税收法定是宪法“依法纳税”义务的落实。","s":"中国人大网·国家法律法规数据库"},{"i":280,"m":"law","t":"网络安全法修改","b":"网络安全法2025年10月28日修改通过，2026年1月1日起施行（原法2017年6月1日施行）。\n新增适应人工智能发展的相关内容，并加大对违法行为的处罚力度。\n网络三法：网络安全法、数据安全法（2021.9.1）、个人信息保护法（2021.11.1）。","s":"中国人大网·国家法律法规数据库"},{"i":281,"m":"law","t":"反不正当竞争法修订","b":"修订后的反不正当竞争法2025年6月27日通过，2025年10月15日起施行。\n重点规制：平台“低价内卷”、仅退款滥用、数据不正当获取等。\n常见不正当竞争：混淆、商业贿赂、虚假宣传、侵犯商业秘密。","s":"中国人大网·国家法律法规数据库"},{"i":282,"m":"law","t":"公司法修订","b":"公司法2023年12月29日修订，2024年7月1日起施行。\n有限责任公司股东认缴出资应自公司成立之日起5年内缴足。\n新增：股东失权制度，董监高责任强化。\n口诀：认缴五年必缴足。","s":"中国人大网·国家法律法规数据库"},{"i":283,"m":"law","t":"未成年人保护","b":"未成年人保护法2021年6月1日修订施行，六大保护：家庭、学校、社会、网络、政府、司法。\n预防未成年人犯罪法同日施行。\n学前教育法2025年6月1日起施行。\n对比：未成年人指不满18周岁的公民。","s":"中国人大网·国家法律法规数据库"},{"i":284,"m":"law","t":"消费者权益保护","b":"网络购物7日内可无理由退货（定做、鲜活易腐、数字化商品等除外）。\n欺诈：退一赔三，不足500元按500元赔。\n食品安全：明知不安全仍销售，可要求价款10倍赔偿。\n口诀：欺诈三倍，食品十倍。","s":"中国人大网·国家法律法规数据库"},{"i":285,"m":"law","t":"酒驾与醉驾","b":"饮酒驾驶：血液酒精含量20mg/100ml以上、不足80mg。\n醉酒驾驶：80mg/100ml以上，属于危险驾驶罪，追究刑事责任。\n对比：酒驾是行政违法，醉驾是犯罪。\n口诀：二十酒驾，八十醉驾。","s":"中国人大网·国家法律法规数据库"},{"i":286,"m":"law","t":"反诈与反间谍","b":"反电信网络诈骗法2022年12月1日施行。\n反间谍法2023年修订，2023年7月1日施行，4月15日为全民国家安全教育日。\n爱国主义教育法2024年1月1日施行。\n诈骗口诀：陌生链接不点，验证码不报，转账先核实。","s":"中国人大网·国家法律法规数据库"},{"i":287,"m":"law","t":"诉讼制度基本原则","b":"我国实行两审终审制。\n公开审判、回避、辩护、以事实为依据以法律为准绳。\n刑事诉讼分工：公安侦查、检察院审查起诉、法院审判。\n无罪推定的体现：疑罪从无。","s":"中国人大网·国家法律法规数据库"},{"i":288,"m":"law","t":"著作权与商标期限","b":"作者的署名权、修改权、保护作品完整权保护期不受限制。\n公民作品发表权、财产权保护期为作者终生加死后50年。\n注册商标有效期10年，期满可续展，每次续展10年。\n专利：发明20年，实用新型和外观设计10年或15年（外观设计15年）。","s":"中国人大网·国家法律法规数据库"},{"i":289,"m":"culture","t":"四大发明","b":"造纸术、印刷术、火药、指南针。\n造纸术：东汉蔡伦改进；活字印刷：北宋毕昇；指南针前身：战国司南。\n口诀：纸印火针，蔡毕。","s":"教材通行表述（参考中国政府网）"},{"i":290,"m":"culture","t":"四书五经","b":"四书：《大学》《中庸》《论语》《孟子》。\n五经：《诗》《书》《礼》《易》《春秋》。\n对比：《论语》是孔子弟子及再传弟子记录孔子言行；《孟子》记孟子言行。\n口诀：四书学庸论孟，五经诗书礼易春秋。","s":"教材通行表述（参考中国政府网）"},{"i":291,"m":"culture","t":"夏商周与春秋战国","b":"夏：启建立，我国第一个世袭王朝。商：汤灭夏，后期都殷，有甲骨文。\n西周：武王灭商，牧野之战。东周分春秋、战国。\n春秋五霸、战国七雄。\n口诀：夏商西周东周，春秋战国。","s":"教材通行表述（参考中国政府网）"},{"i":292,"m":"culture","t":"秦的统一","b":"公元前221年秦始皇统一六国，建立我国第一个统一的多民族中央集权国家。\n措施：皇帝制度，郡县制，统一文字（小篆）、货币、度量衡，车同轨。\n对比：秦行郡县制，西周行分封制。","s":"教材通行表述（参考中国政府网）"},{"i":293,"m":"culture","t":"两汉要点","b":"西汉：刘邦建立（前202年）。汉武帝：推恩令、罢黜百家独尊儒术、张骞通西域。\n东汉：光武帝刘秀建立（25年）。\n丝绸之路：以长安为起点，经西域通往中亚、西亚。\n东汉蔡伦改进造纸术，张衡发明地动仪。","s":"教材通行表述（参考中国政府网）"},{"i":294,"m":"culture","t":"三国两晋南北朝","b":"三国：魏、蜀、吴。官渡之战（曹操胜袁绍）、赤壁之战（208年，孙刘联军胜曹操）。\n西晋短暂统一，东晋偏安江南。\n淝水之战（383年）：东晋以少胜多。\n北魏孝文帝改革：迁都洛阳，推行汉化。","s":"教材通行表述（参考中国政府网）"},{"i":295,"m":"culture","t":"隋唐要点","b":"隋：581年杨坚建立，589年灭陈统一。开凿大运河，创立科举制。\n唐：贞观之治（唐太宗）、开元盛世（唐玄宗）。\n安史之乱（755年）后唐由盛转衰。\n口诀：隋开运河开科举，唐有贞观与开元。","s":"教材通行表述（参考中国政府网）"},{"i":296,"m":"culture","t":"宋元要点","b":"宋：960年赵匡胤陈桥兵变建宋；北宋毕昇发明活字印刷，苏轼辛弃疾李清照。\n靖康之变（1127年）北宋亡，南宋建立。\n元：1271年忽必烈定国号“元”，1279年灭南宋；创行省制度。","s":"教材通行表述（参考中国政府网）"},{"i":297,"m":"culture","t":"明清要点","b":"明：1368年朱元璋建立；废丞相、设内阁；郑和下西洋（1405年起）。\n清：1644年入关定都北京；雍正设军机处；康乾盛世。\n明清两代皇宫都是北京故宫（紫禁城），明永乐年间建成。","s":"教材通行表述（参考中国政府网）"},{"i":298,"m":"culture","t":"中国近代史时间轴","b":"1840鸦片战争；1851太平天国；1894甲午战争；1900八国联军侵华；1911辛亥革命；1919五四运动；1921中共成立；1931九一八；1937七七事变；1945抗战胜利；1949新中国成立。\n口诀：按年份背，先后不乱。","s":"教材通行表述（参考中国政府网）"},{"i":299,"m":"culture","t":"重要不平等条约","b":"《南京条约》（1842年）：第一个，割香港岛，开五口通商。\n《马关条约》（1895年）：甲午战败后，割台湾及澎湖列岛。\n《辛丑条约》（1901年）：八国联军侵华后，使中国完全沦为半殖民地半封建社会。","s":"教材通行表述（参考中国政府网）"},{"i":300,"m":"culture","t":"抗日战争","b":"1931年九一八事变是起点，1937年七七事变全面抗战爆发，1945年日本投降。\n中国抗战前后14年，是世界反法西斯战争的重要组成部分。\n2025年是抗战胜利80周年，9月3日在北京举行纪念大会和阅兵。\n对比：平型关大捷、台儿庄战役、百团大战。","s":"新华网"},{"i":301,"m":"culture","t":"二十四节气与非遗","b":"口诀：春雨惊春清谷天，夏满芒夏暑相连，秋处露秋寒霜降，冬雪雪冬小大寒。\n2016年二十四节气列入联合国教科文组织人类非遗代表作名录。\n2024年12月，春节（中国人庆祝传统新年的社会实践）也列入该名录。","s":"新华网"},{"i":302,"m":"culture","t":"传统节日日期","b":"春节：正月初一。元宵：正月十五。\n端午：五月初五，纪念屈原。七夕：七月初七。\n中秋：八月十五。重阳：九月初九，敬老。腊八：腊月初八。\n清明：节气兼节日，在公历4月5日前后。","s":"教材通行表述（参考中国政府网）"},{"i":303,"m":"culture","t":"古代科技成就","b":"张衡：地动仪、浑天仪。祖冲之：圆周率精确到小数点后第七位。\n《九章算术》：数学。《齐民要术》贾思勰：农书。\n《本草纲目》李时珍：医药。《天工开物》宋应星：手工业。《梦溪笔谈》沈括：科技百科。","s":"教材通行表述（参考中国政府网）"},{"i":304,"m":"culture","t":"古代官制与六部","b":"隋唐三省六部：中书省决策、门下省审议、尚书省执行。\n六部：吏、户、礼、兵、刑、工。\n吏部管官，户部管钱，礼部管教育礼仪，兵部管军，刑部管法，工部管工程。","s":"教材通行表述（参考中国政府网）"},{"i":305,"m":"culture","t":"科举称谓","b":"乡试（秋，省）：第一名解元，中者为举人。\n会试（春，京）：第一名会元，中者为贡士。\n殿试（皇帝主持）：一甲三名状元、榜眼、探花，赐进士及第。\n连中三元：解元、会元、状元。","s":"教材通行表述（参考中国政府网）"},{"i":306,"m":"culture","t":"古代年龄称谓","b":"二十弱冠，三十而立，四十不惑，五十知天命，六十花甲或耳顺，七十古稀，八十耄耋，九十鲐背，百岁期颐。\n垂髫：幼儿。豆蔻：女子十三四岁。及笄：女子十五岁。","s":"教材通行表述（参考中国政府网）"},{"i":307,"m":"culture","t":"中国古代史书","b":"《史记》司马迁：第一部纪传体通史。\n《汉书》班固：第一部纪传体断代史。\n《资治通鉴》司马光：编年体通史。\n《三国志》陈寿；《后汉书》范晔。\n口诀：史记司马迁，汉书班固传。","s":"教材通行表述（参考中国政府网）"},{"i":308,"m":"culture","t":"四大名著","b":"《红楼梦》曹雪芹；《西游记》吴承恩；《水浒传》施耐庵；《三国演义》罗贯中。\n题材：红楼梦写贾史王薛四大家族兴衰；西游记是神魔小说；水浒传写梁山好汉；三国演义是历史演义。","s":"教材通行表述（参考中国政府网）"},{"i":309,"m":"culture","t":"唐宋八大家","b":"唐2人：韩愈、柳宗元。\n宋6人：欧阳修、苏洵、苏轼、苏辙、王安石、曾巩。\n三苏：苏洵、苏轼、苏辙父子三人。\n口诀：韩柳欧三苏王曾。","s":"教材通行表述（参考中国政府网）"},{"i":310,"m":"culture","t":"诗人雅号","b":"诗仙李白，诗圣杜甫，诗佛王维，诗鬼李贺，诗豪刘禹锡。\n李杜指李白、杜甫；小李杜指李商隐、杜牧。\n词：婉约派李清照、柳永；豪放派苏轼、辛弃疾（苏辛）。","s":"教材通行表述（参考中国政府网）"},{"i":311,"m":"culture","t":"诗经与楚辞","b":"《诗经》：我国最早的诗歌总集，305篇，分风、雅、颂；手法赋、比、兴。\n《楚辞》：屈原开创，代表作《离骚》，浪漫主义。\n对比：《诗经》为现实主义源头，《楚辞》为浪漫主义源头。","s":"教材通行表述（参考中国政府网）"},{"i":312,"m":"culture","t":"各代文学代表","b":"口诀：先秦散文汉赋乐府，魏晋诗，唐诗宋词元曲，明清小说。\n汉赋：司马相如。乐府：《木兰辞》《孔雀东南飞》。\n元曲四大家：关汉卿、马致远、郑光祖、白朴。\n关汉卿《窦娥冤》。","s":"教材通行表述（参考中国政府网）"},{"i":313,"m":"culture","t":"现当代文学","b":"鲁迅《狂人日记》（1918）：现代文学史第一篇白话小说；《呐喊》《彷徨》。\n老舍《骆驼祥子》《茶馆》；巴金《家》；茅盾《子夜》；曹禺《雷雨》。\n莫言：2012年诺贝尔文学奖。刘慈欣《三体》获雨果奖。","s":"教材通行表述（参考中国政府网）"},{"i":314,"m":"culture","t":"外国文学名著","b":"莎士比亚：《哈姆雷特》《罗密欧与朱丽叶》。托尔斯泰：《战争与和平》。\n雨果：《悲惨世界》《巴黎圣母院》。塞万提斯：《堂吉诃德》。\n歌德：《浮士德》。海明威：《老人与海》。但丁：《神曲》。","s":"教材通行表述（参考中国政府网）"},{"i":315,"m":"culture","t":"书画名家名作","b":"书圣王羲之：《兰亭序》（天下第一行书）。楷书四大家：欧阳询、颜真卿、柳公权、赵孟頫。\n顾恺之：《洛神赋图》。吴道子：画圣。\n张择端：《清明上河图》（北宋）。王希孟：《千里江山图》。","s":"教材通行表述（参考中国政府网）"},{"i":316,"m":"culture","t":"戏曲常识","b":"京剧：行当生、旦、净、丑；“净”俗称花脸；四大名旦梅兰芳、程砚秋、尚小云、荀慧生。\n昆曲：“百戏之祖”。\n黄梅戏：安徽；越剧：浙江；豫剧：河南。\n五声音阶：宫、商、角、徵、羽。","s":"教材通行表述（参考中国政府网）"},{"i":317,"m":"culture","t":"古代建筑与水利","b":"故宫：明清皇宫，又称紫禁城。赵州桥：隋代李春，现存最早的大型敞肩石拱桥。\n都江堰：战国李冰父子，无坝引水。\n京杭大运河：世界最长人工运河。\n天坛：明清皇帝祭天场所。","s":"教材通行表述（参考中国政府网）"},{"i":318,"m":"culture","t":"中国世界遗产","b":"故宫、长城、莫高窟、秦始皇陵及兵马俑、泰山等较早列入世界遗产。\n2024年7月27日，北京中轴线列入《世界遗产名录》。\n对比：文化遗产、自然遗产、文化和自然双遗产三类。","s":"新华网"},{"i":319,"m":"culture","t":"中国国土基本数据","b":"陆地面积约960万平方千米，居世界第三。\n省级行政区34个：23省、5个自治区、4个直辖市、2个特别行政区。\n四大直辖市：北京、天津、上海、重庆。\n陆地邻国14个。","s":"中国政府网"},{"i":320,"m":"culture","t":"河流湖泊之最","b":"最长河：长江（约6300千米）。第二：黄河（约5464千米）。\n最大淡水湖：鄱阳湖（江西）。最大咸水湖：青海湖。\n最大岛屿：台湾岛；第二：海南岛。\n内海：渤海。","s":"教材通行表述（参考中国政府网）"},{"i":321,"m":"culture","t":"山脉与五岳","b":"世界最高峰：珠穆朗玛峰，高程8848.86米（2020年公布）。\n五岳：东岳泰山、西岳华山、南岳衡山、北岳恒山、中岳嵩山。\n横断山脉、昆仑山、天山、秦岭是重要山脉。\n秦岭是长江与黄河流域的分水岭。","s":"中国政府网"},{"i":322,"m":"culture","t":"秦岭淮河线与地势","b":"秦岭—淮河一线：我国南北方分界线。\n南方：亚热带季风气候，水田，稻作；北方：温带季风气候，旱地，小麦。\n地势三级阶梯：西高东低，第一级青藏高原。\n四大高原：青藏、内蒙古、黄土、云贵。","s":"教材通行表述（参考中国政府网）"},{"i":323,"m":"culture","t":"世界地理常识","b":"七大洲：亚洲最大、大洋洲最小。四大洋：太平洋最大。\n世界最长河流：尼罗河（常用表述）。最大沙漠：撒哈拉。\n最深海沟：马里亚纳海沟，位于太平洋。\n赤道是0°纬线，本初子午线是0°经线。","s":"教材通行表述（参考中国政府网）"},{"i":324,"m":"culture","t":"时间与经纬度","b":"北京时间采用东八区区时（东经120°）。\n全球24个时区；东早西晚。\n本初子午线经过英国格林尼治天文台。\n昼夜长短：夏至北半球白昼最长，冬至最短。","s":"教材通行表述（参考中国政府网）"},{"i":325,"m":"culture","t":"物理常识","b":"光速约3×10⁸米/秒。声音不能在真空中传播；光可以。\n牛顿第一定律：惯性定律。\n大气压随海拔升高而降低。\n对比：声速（空气中约340米/秒）远小于光速，所以先见闪电后闻雷声。","s":"教材通行表述（参考中国政府网）"},{"i":326,"m":"culture","t":"化学常识","b":"水：H₂O。空气中氮气约78%，氧气约21%。\npH小于7为酸性，等于7中性，大于7碱性。\n二氧化碳是主要温室气体。\n钢是铁碳合金；食盐主要成分氯化钠。","s":"教材通行表述（参考中国政府网）"},{"i":327,"m":"culture","t":"生物与人体","b":"光合作用：吸收二氧化碳，释放氧气。成年人骨头206块。\n人体最大器官：皮肤。遗传物质：DNA。\n血型：ABO型。\n呼吸系统：肺是气体交换的场所；小肠是消化吸收的主要器官。","s":"教材通行表述（参考中国政府网）"},{"i":328,"m":"culture","t":"缺乏营养与疾病","b":"缺碘：甲状腺肿（大脖子病）。缺铁：缺铁性贫血。\n缺钙：儿童佝偻病，老人骨质疏松。\n缺维生素A：夜盲症。缺维生素C：坏血病。缺维生素D：佝偻病。\n口诀：碘脖铁血，钙骨，A夜C坏。","s":"教材通行表述（参考中国政府网）"},{"i":329,"m":"culture","t":"能源分类","b":"一次能源：直接从自然界获得，如煤、石油、天然气、太阳能、风能、水能。\n二次能源：由一次能源加工得到，如电力、汽油。\n可再生：太阳能、风能、水能、生物质能；不可再生：煤、石油、天然气、铀。","s":"教材通行表述（参考中国政府网）"},{"i":330,"m":"culture","t":"双碳目标","b":"2020年习近平在联合国大会宣布：二氧化碳排放力争2030年前达到峰值（碳达峰），努力争取2060年前实现碳中和。\n口诀：三零达峰，六零中和。\n路径：发展新能源、节能降耗、植树造林。","s":"中国政府网"},{"i":331,"m":"culture","t":"环保与重要日期","b":"植树节3月12日；世界水日3月22日；地球日4月22日；世界环境日6月5日。\n劳动节5月1日；青年节5月4日；护士节5月12日。\n教师节9月10日；国庆10月1日；记者节11月8日；消防宣传日11月9日。","s":"教材通行表述（参考中国政府网）"},{"i":332,"m":"culture","t":"常用报警电话","b":"110：报警；119：火警；120：急救；122：交通事故报警。\n12315：消费者投诉举报；12345：政务服务便民热线。\n12348：法律援助；12388：监察机关举报。\n口诀：幺幺零警，幺幺九火，幺二零医。","s":"中国政府网"},{"i":333,"m":"culture","t":"心肺复苏与急救","b":"判断意识，呼叫120，开始胸外按压。\n按压位置：胸骨下半段；频率每分钟100至120次；深度5至6厘米。\n成人按压与人工呼吸比例30:2。\nAED（自动体外除颤器）可在急救中使用。","s":"教材通行表述（参考中国政府网）"},{"i":334,"m":"culture","t":"防火与逃生","b":"火灾逃生：低姿势，湿毛巾捂口鼻，沿安全出口走，不乘电梯。\n燃气泄漏：先关阀门、开窗通风，不开关电器、不用明火。\n电器着火：先断电再灭火，不能用水。\n口诀：关阀通风，不碰开关。","s":"中国政府网"},{"i":335,"m":"culture","t":"食品安全常识","b":"发芽的土豆含龙葵素，不宜食用。\n四季豆未煮熟易中毒。\n腌制不久的咸菜含较多亚硝酸盐。\n对比：冷藏不等于杀菌；买食品看保质期、生产日期、QS或SC标志。","s":"中国政府网"},{"i":336,"m":"culture","t":"航天里程碑","b":"东方红一号：1970年4月24日，我国第一颗人造卫星。\n神舟五号：2003年，杨利伟，我国首次载人航天飞行。\n嫦娥一号：2007年绕月。嫦娥五号：2020年月球采样返回。\n嫦娥六号：2024年，人类首次月背采样返回。","s":"中国载人航天工程网"},{"i":337,"m":"culture","t":"空间站与神舟","b":"天宫空间站2022年建成，基本构型为三舱“T”字。\n神舟二十号：2025年4月24日发射。神舟二十一号：2025年10月31日发射升空。\n天舟货运飞船负责补给。\n口诀：天和问天梦天，三舱成T。","s":"中国载人航天工程网"},{"i":338,"m":"culture","t":"深空探测","b":"天问一号：2020年发射，2021年祝融号着陆火星。\n嫦娥四号：2019年人类首次月背软着陆。\n天问二号：2025年5月29日发射，目标是近地小行星2016HO3（卡莫奥阿莱瓦），任务为探测并采样返回。","s":"国家航天局"},{"i":339,"m":"culture","t":"北斗与量子","b":"北斗三号全球卫星导航系统：2020年建成并开通。\n“墨子号”量子科学实验卫星：2016年发射。\n“九章”：光量子计算原型机；“祖冲之号”：超导量子计算原型机。\n对比：北斗是中国自主，GPS属美国。","s":"新华网"},{"i":340,"m":"culture","t":"国之重器","b":"“蛟龙号”载人深潜器；“奋斗者”号：2020年坐底马里亚纳海沟，深度10909米。\nFAST“中国天眼”：贵州，世界最大单口径射电望远镜。\n华龙一号：自主三代核电技术。\n白鹤滩水电站、三峡工程：水电重器。","s":"新华网"},{"i":341,"m":"culture","t":"福建舰与航母","b":"辽宁舰：2012年入列；山东舰：2019年入列；福建舰：2025年11月5日在海南三亚入列。\n福建舰是我国第三艘航母，也是首艘电磁弹射型航母，常规动力。\n人民海军由此进入三航母时代。","s":"新华网"},{"i":342,"m":"culture","t":"人工智能+行动","b":"国务院2025年8月26日印发《关于深入实施“人工智能+”行动的意见》。\n目标：到2027年，率先实现人工智能与六大重点领域广泛深度融合，新一代智能终端、智能体等应用普及率超70%。\n重点：科学技术、产业发展、消费提质、民生福祉、治理能力、全球合作。","s":"中国政府网"},{"i":343,"m":"culture","t":"科学家与荣誉","b":"袁隆平：杂交水稻，“共和国勋章”获得者。\n屠呦呦：青蒿素，2015年诺贝尔生理学或医学奖。\n钱学森、邓稼先：“两弹一星”元勋。\n华罗庚：数学家。李四光：地质学家。","s":"新华网"},{"i":344,"m":"culture","t":"世界近现代史","b":"文艺复兴：14至16世纪，发源于意大利。\n工业革命：18世纪60年代起源于英国，瓦特改良蒸汽机。\n美国独立宣言1776；法国大革命1789。\n一战1914至1918；二战1939至1945；联合国1945年成立。","s":"教材通行表述（参考中国政府网）"},{"i":345,"m":"culture","t":"联合国与国际组织","b":"联合国总部在纽约。安理会五个常任理事国：中国、美国、俄罗斯、英国、法国。\n世界卫生组织总部在日内瓦。\n上海合作组织、金砖机制是我国积极参与的多边合作。\n联合国成立日：10月24日。","s":"中国政府网"},{"i":346,"m":"culture","t":"干支与生肖","b":"干支纪年：天干十、地支十二，六十年一个轮回（甲子）。\n十二生肖：鼠牛虎兔龙蛇马羊猴鸡狗猪。\n十二时辰：子丑寅卯辰巳午未申酉戌亥，一个时辰两小时。\n子时：23点到1点。","s":"教材通行表述（参考中国政府网）"},{"i":347,"m":"culture","t":"汉字与书体","b":"汉字演变：甲骨文、金文、篆书（大篆、小篆）、隶书、楷书、行书、草书。\n小篆：秦统一文字所用。\n隶书：汉代通行。\n六书：象形、指事、会意、形声、转注、假借。","s":"教材通行表述（参考中国政府网）"},{"i":348,"m":"exam","t":"时间怎么分","b":"发卷先通览一遍题型和题量。判断题最快，单选每题不超过 50 秒，多选放慢。卡住的题先标记跳过，最后回来补。留 10 分钟涂卡和检查。","s":""},{"i":349,"m":"exam","t":"单选怎么蒙","b":"选最全面、最稳妥、最贴近官方表述的那项。带「所有」「一切」「必须」「唯一」「完全」这类绝对词的选项多半是错的。","s":""},{"i":350,"m":"exam","t":"多选怎么下手","b":"多选错一个往往整题不得分，宁少勿滥。有把握的选，拿不准的不选。四个选项都对的情况真题里很常见，别因为「不可能全对」就硬删一个。","s":""},{"i":351,"m":"exam","t":"判断题陷阱","b":"看清偷换概念：根本制度和根本政治制度、制定和修改年份、处罚和强制、请示和报告。一个字不对就是错。","s":""},{"i":352,"m":"exam","t":"不设合格线意味着什么","b":"笔试 100 分，不设合格线，按 1:3 进面，笔试面试各占 50%。多对一题就是总成绩多 0.5 分，每题都值得争，不会的也别空着。","s":""}],"plan":[{"d":"2026-11-05","lab":"11/05 周四","tag":"上手 + 法律","hours":"今晚 1.5 小时","tasks":["Safari 打开链接，添加到主屏幕","学：法律知识点读一遍","练：法律模块刷一遍","睡前背 10 张卡"],"goal":"法律正确率摸底，记住 818 和八类重罪"},{"d":"2026-11-06","lab":"11/06 周五","tag":"政治理论","hours":"约 2 小时","tasks":["学：政治理论知识点读一遍","练：政治理论模块刷一遍","错题本清一遍","背 10 张卡"],"goal":"三大规律、二十大和三中全会表述分得清"},{"d":"2026-11-07","lab":"11/07 周六","tag":"经济 + 公文","hours":"2-2.5 小时","tasks":["学：经济、管理与公文知识点","练：经济、管理与公文两个模块","背：请示和报告的区别默述一遍","错题本清一遍"],"goal":"财政政策和货币政策分得清，15 种公文能列出来"},{"d":"2026-11-08","lab":"11/08 周日","tag":"人文 + 真题","hours":"2-2.5 小时","tasks":["练：人文科技模块","练：往年真题挑两套做","错题本清一遍","背 10 张卡"],"goal":"摸清盐城本地出题风格"},{"d":"2026-11-09","lab":"11/09 周一","tag":"时政①","hours":"约 2 小时","tasks":["学：时政知识点全部读一遍","练：时政模块刷一遍","练：往年真题再做两套"],"goal":"四中全会、十五五、九三阅兵这些大事能说出时间和要点"},{"d":"2026-11-10","lab":"11/10 周二","tag":"省情县情 + 二刷","hours":"2-2.5 小时","tasks":["学：省情县情知识点","练：省情县情模块","练：没做过的题清一遍","错题本清一遍"],"goal":"射阳的面积、人口、产业、荣誉记住"},{"d":"2026-11-11","lab":"11/11 周三","tag":"模拟考①","hours":"约 2.5 小时","tasks":["考：完整模拟考一场，严格计时","交卷后逐题看错题","练：时政模块二刷"],"goal":"知道自己的真实得分线"},{"d":"2026-11-12","lab":"11/12 周四","tag":"模拟考② + 清零","hours":"2.5-3 小时","tasks":["考：再考一场","练：多选专项刷一遍","错题本清到 10 道以内"],"goal":"模拟分比第一场高，多选不乱选"},{"d":"2026-11-13","lab":"11/13 周五","tag":"领准考证","hours":"1 小时以内","tasks":["9:00-16:00 到人力资源服务产业园一楼领准考证","考：考场策略读一遍","考：考前清单逐项打勾","背：没记住的卡片过一遍","23 点前睡"],"goal":"两证和文具备齐"},{"d":"2026-11-14","lab":"11/14 周六","tag":"考试日","hours":"考前 30 分钟","tasks":["背 10 张卡热身","提前 30 分钟到考点","按考场策略答题，不空题"],"goal":"稳定发挥"}],"checklist":["11 月 13 日 9:00-16:00 到江苏射阳人力资源服务产业园一楼领准考证","准考证（核对考场地址和开考时间）","身份证（有效期内的原件）","2B 铅笔两支、橡皮","黑色签字笔两支","非智能手表（手机进考场要关机上交）","前一晚定好闹钟，提前 30 分钟到考点"]}</script>

function esc(s){return String(s==null?'':s).replace(/[&<>"']/g,function(c){return{'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]})}
function para(s){return String(s||'').split(/\n+/).filter(Boolean).map(function(p){return'<p>'+esc(p)+'</p>'}).join('')}
function ymd(d){return d.getFullYear()+'-'+String(d.getMonth()+1).padStart(2,'0')+'-'+String(d.getDate()).padStart(2,'0')}

function shuffle(a){a=a.slice();for(var i=a.length-1;i>0;i--){var j=Math.random()*(i+1)|0,t=a[i];a[i]=a[j];a[j]=t}return a}
function pct(x){return x==null?'—':Math.round(x*100)+'%'}
var tt;function toast(m){var t=$('#toast');t.textContent=m;t.classList.add('show');clearTimeout(tt);tt=setTimeout(function(){t.classList.remove('show')},2200)}

/* ---------- 统计 ---------- */
function qState(id){if(S.wb[id])return'w';return S.r[id]?'ok':''}
function modStats(k){var n=0,done=0,c=0,w=0,wb=0;QS.forEach(function(q){if(q.m!==k)return;n++;var r=S.r[q.i];if(r){done++;c+=r.c;w+=r.w}if(S.wb[q.i])wb++});return{n:n,done:done,acc:(c+w)?c/(c+w):null,wb:wb}}
function kpStats(k){var n=0,got=0;KPS.forEach(function(x){if(x.m!==k)return;n++;if(S.kp[x.i]===2)got++});return{n:n,got:got}}
function record(id,ok){
  var r=S.r[id]||{c:0,w:0,k:0};
  if(ok){r.c++;r.k++}else{r.w++;r.k=0}
  r.l=ok?1:0;r.t=Date.now();
  var GAP=[0,1,2,4,7,15];r.b=ok?Math.min((r.b||0)+1,5):1;r.due=r.t+GAP[r.b]*864e5;S.r[id]=r;
  var moved=false;
  if(!ok)S.wb[id]=1;else if(S.wb[id]&&r.k>=2){delete S.wb[id];moved=true}
  var d=today();S.day[d]=(S.day[d]||0)+1;save();return moved;
}
function streak(){var n=0,d=new Date();if(!S.day[ymd(d)])d.setDate(d.getDate()-1);while(S.day[ymd(d)]){n++;d.setDate(d.getDate()-1)}return n}
function wbIds(){return Object.keys(S.wb).map(Number).filter(function(i){return QI.has(i)})}
function favIds(){return Object.keys(S.fav).map(Number).filter(function(i){return QI.has(i)})}
function todayPlan(){var t=today();for(var i=0;i<PLAN.length;i++)if(PLAN[i].d===t)return PLAN[i];if(t<PLAN[0].d)return PLAN[0];return null}

function startSession(title,ids,opt){
  opt=opt||{};
  if(!ids.length){toast('这一组没有题');return}
  sess={kind:'p',title:title,ids:ids,i:opt.i||0,pick:{},done:{},track:opt.track!==false};
  if(sess.track){S.last={title:title,ids:ids,i:sess.i};save()}
  openOv();drawQ();
}
function curQ(){var ids=sess.kind==='k'?S.mock.ids:sess.ids;return QI.get(ids[sess.i])}
function lab(q,l){return q.t==='j'?(l==='A'?'√':'×'):l}
function drawQ(){
  var mock=sess.kind==='k',ids=mock?S.mock.ids:sess.ids,q=curQ();
  var pick=(mock?S.mock.pick:sess.pick)[q.i]||'',res=mock?null:sess.done[q.i];
  var opts=q.o.map(function(o,k){
    var l=L[k],cls='';
    if(res){if(q.a.indexOf(l)>=0)cls='right';else if(pick.indexOf(l)>=0)cls='bad'}
    else if(pick.indexOf(l)>=0)cls='on';
    return'<button class="opt '+cls+'" data-act="pick" data-l="'+l+'"'+(res?' aria-disabled="true"':'')+' aria-pressed="'+(pick.indexOf(l)>=0)+'"><span class="bb" aria-hidden="true">'+lab(q,l)+'</span><span class="ot">'+esc(o)+'</span></button>';
  }).join('');
  var right=mock?'<span id="timer">'+fmt(S.mock.start+S.mock.dur-Date.now())+'</span>':(sess.i+1)+' / '+ids.length;
  var h=head(mock?'模拟考 第 '+(sess.i+1)+' / '+ids.length+' 题':sess.title,right)+'<div class="ob">';
  h+='<div class="chips"><span class="chip">'+esc(MOD[q.m].name)+'</span><span class="chip">'+TYPE[q.t]+'</span>'+(q.m==='zt'?'<span class="chip zt">真题 '+esc(q.s)+'</span>':'')+(!mock&&S.wb[q.i]?'<span class="chip zt">错题本里</span>':'')+'</div>';
  h+='<p class="stem">'+esc(q.q)+'</p>';
  if(q.t==='m')h+='<p class="hint">多选题，可以选两个或以上'+(mock?'':'，选完点「确认」')+'</p>';
  h+='<div role="group" aria-label="选项">'+opts+'</div>';
  if(!mock&&q.t==='m'&&!res)h+='<button class="pri" data-act="confirm"'+(pick?'':' disabled style="opacity:.4"')+'>确认答案</button>';
  if(res){
    h+='<div class="fb '+(res.ok?'ok':'no')+'" role="status"><p class="fbh">'+(res.ok?'答对了':'答错了，正确答案 '+q.a.split('').map(function(l){return lab(q,l)}).join(''))+'</p>'+
      (res.moved?'<p class="sub">连续答对两次，已移出错题本。</p>':'')+para(q.e)+'</div>';
  }
  if(mock){
    h+='<div class="qnav"><button data-act="prev"'+(sess.i?'':' disabled')+'>上一题</button><button data-act="msheet">答题卡</button><button class="nx" data-act="next">'+(sess.i<ids.length-1?'下一题':'去交卷')+'</button></div>';
  }else{
    h+='<div class="qnav"><button data-act="prev"'+(sess.i?'':' disabled')+'>上一题</button><button class="fav" data-act="fav" aria-pressed="'+(!!S.fav[q.i])+'">'+(S.fav[q.i]?'已收藏':'收藏')+'</button><button class="nx" data-act="next">'+(sess.i<ids.length-1?(res?'下一题':'跳过'):'看结果')+'</button></div>';
  }
  ov.innerHTML=h+'</div>';
}
ACT.pick=function(d){
  if(!sess)return;var q=curQ(),l=d.l;
  if(sess.kind==='k'){
    var mp=S.mock.pick,p=mp[q.i]||'';
    if(q.t==='m'){p=p.indexOf(l)>=0?p.replace(l,''):p+l;mp[q.i]=p.split('').sort().join('')}else mp[q.i]=l;
    if(!mp[q.i])delete mp[q.i];
    save();drawQ();return;
  }
  if(sess.done[q.i])return;
  if(q.t==='m'){var pp=sess.pick[q.i]||'';pp=pp.indexOf(l)>=0?pp.replace(l,''):pp+l;sess.pick[q.i]=pp.split('').sort().join('');drawQ()}
  else{sess.pick[q.i]=l;judge(q)}
};
ACT.confirm=function(){var q=curQ();if(sess.pick[q.i])judge(q)};
function judge(q){var ok=sess.pick[q.i]===q.a;sess.done[q.i]={ok:ok,moved:record(q.i,ok)};drawQ()}
function setI(i){sess.i=i;if(sess.kind==='p'&&sess.track&&S.last){S.last.i=i;save()}drawQ();ov.scrollTop=0}
ACT.prev=function(){if(sess.i>0)setI(sess.i-1)};
ACT.next=function(){
  var n=(sess.kind==='k'?S.mock.ids:sess.ids).length;
  if(sess.i<n-1)setI(sess.i+1);else if(sess.kind==='p')summary();else mockSheet();
};
ACT.fav=function(){var q=curQ();if(S.fav[q.i])delete S.fav[q.i];else S.fav[q.i]=1;save();drawQ();toast(S.fav[q.i]?'已收藏':'已取消收藏')};
function summary(){
  var done=sess.ids.filter(function(id){return sess.done[id]}),right=done.filter(function(id){return sess.done[id].ok}).length;
  sess.redo=done.filter(function(id){return!sess.done[id].ok});
  if(sess.track){S.last=null;save()}
  ov.innerHTML=head(sess.title)+'<div class="ob"><h2>这一组做完了</h2><p class="big">'+right+' / '+done.length+'</p><p class="sub">共 '+sess.ids.length+' 题，作答 '+done.length+'，答对 '+right+'。答错的已进错题本。</p>'+
    (sess.redo.length?'<button class="pri" data-act="redo">把这 '+sess.redo.length+' 道错题再做一遍</button>':'')+
    '<button class="sec" data-act="frag">再来碎片 10 题</button><button class="sec" data-act="close">回去</button></div>';
  ov.scrollTop=0;
}
ACT.redo=function(){startSession('本组错题重做',shuffle(sess.redo),{track:false})};

function fragIds(n){
  var wb=shuffle(wbIds()),un=shuffle(QS.filter(function(q){return!S.r[q.i]}).map(function(q){return q.i}));
  var out=wb.slice(0,3);
  un.forEach(function(i){if(out.length<n&&out.indexOf(i)<0)out.push(i)});
  shuffle(QS.map(function(q){return q.i})).forEach(function(i){if(out.length<n&&out.indexOf(i)<0)out.push(i)});
  return shuffle(out);
}
function dueIds(){var n=Date.now();return QS.filter(function(q){var r=S.r[q.i];return r&&r.due&&r.due<=n}).map(function(q){return q.i})}
ACT.due=function(){var a=dueIds();if(!a.length){toast('今天没有到期的复习题');return}startSession('到期复习',shuffle(a))};
ACT.frag=function(){startSession('碎片 10 题',fragIds(10))};
ACT.wrong=function(){var a=wbIds();if(!a.length){toast('错题本是空的，先去刷几组');return}startSession('错题本',shuffle(a))};
ACT.favs=function(){startSession('收藏',favIds())};
ACT.unseen=function(){startSession('没做过的',shuffle(QS.filter(function(q){return!S.r[q.i]}).map(function(q){return q.i})))};
ACT.multi=function(){startSession('多选专项',shuffle(QS.filter(function(q){return q.t==='m'}).map(function(q){return q.i})))};
ACT.tf=function(){startSession('判断专项',shuffle(QS.filter(function(q){return q.t==='j'}).map(function(q){return q.i})))};
ACT.mod=function(d){
  var ids=QS.filter(function(q){return q.m===d.k}).map(function(q){return q.i});
  var i=ids.findIndex(function(id){return!S.r[id]});
  startSession(MOD[d.k].name,ids,{i:i<0?0:i});
};
ACT.zt=function(d){var ids=QS.filter(function(q){return q.m==='zt'&&q.s===d.s}).map(function(q){return q.i});var i=ids.findIndex(function(id){return!S.r[id]});startSession('真题 '+d.s,ids,{i:i<0?0:i})};
ACT.cont=function(){var l=S.last;if(!l)return;var ids=l.ids.filter(function(i){return QI.has(i)});startSession(l.title,ids,{i:Math.min(l.i,ids.length-1)})};
ACT.qone=function(d){startSession('搜索结果',[+d.i],{track:false})};

/* 知识点 */
function kpCard(x){var got=S.kp[x.i]===2;return'<article class="kp"><h3>'+esc(x.t)+'</h3>'+para(x.b)+(x.s?'<p class="src">'+esc(x.s)+'</p>':'')+'<button class="mini" data-act="kpmark" data-i="'+x.i+'" aria-pressed="'+got+'">'+(got?'已记住':'标为记住')+'</button></article>'}
ACT.kplist=function(d){
  var ks=KPS.filter(function(x){return x.m===d.k}),st=kpStats(d.k);
  sess={kind:'l'};
  ov.innerHTML=head(MOD[d.k].name)+'<div class="ob"><p class="sub">'+st.n+' 个知识点，记住 '+st.got+'。</p><button class="pri" data-act="flash" data-k="'+d.k+'">开始背，没记住的先来</button>'+ks.map(kpCard).join('')+'</div>';
  openOv();
};
ACT.kpone=function(d){var x=KI.get(+d.i);sess={kind:'l'};ov.innerHTML=head(MOD[x.m].name)+'<div class="ob">'+kpCard(x)+'</div>';openOv()};
ACT.kpmark=function(d,b){var i=+d.i,got=S.kp[i]===2;S.kp[i]=got?1:2;save();b.setAttribute('aria-pressed',String(!got));b.textContent=got?'标为记住':'已记住'};
function startFlash(ids,title){
  var rank=function(i){var s=S.kp[i];return s===1?0:s===2?2:1};
  var order=shuffle(ids).sort(function(a,b){return rank(a)-rank(b)});
  sess={kind:'f',title:title,ids:order,i:0,flip:false,got:0,miss:0};openOv();drawF();
}
function drawF(){
  var x=KI.get(sess.ids[sess.i]);
  var h=head(sess.title,(sess.i+1)+' / '+sess.ids.length)+'<div class="ob"><div class="flash"><span class="chip">'+esc(MOD[x.m].name)+'</span><h2>'+esc(x.t)+'</h2>';
  if(sess.flip)h+='<div class="prose">'+para(x.b)+'</div>'+(x.s?'<p class="src">'+esc(x.s)+'</p>':'')+'<div class="two"><button data-act="fno">没记住</button><button class="pri" data-act="fyes">记住了</button></div>';
  else h+='<p class="sub">先在心里答一遍，再翻面核对。</p><button class="pri" data-act="flip">翻面</button>';
  ov.innerHTML=h+'</div></div>';
}
ACT.flash=function(d){var ids=KPS.filter(function(x){return x.m===d.k}).map(function(x){return x.i});startFlash(ids,'背 '+MOD[d.k].name)};
ACT.flashAll=function(){
  var ids=KPS.filter(function(x){return x.m!=='exam'}).map(function(x){return x.i});
  var rank=function(i){var s=S.kp[i];return s===1?0:s===2?2:1};
  ids=shuffle(ids).sort(function(a,b){return rank(a)-rank(b)}).slice(0,10);
  sess={kind:'f',title:'背 10 张卡',ids:ids,i:0,flip:false,got:0,miss:0};openOv();drawF();
};
ACT.flip=function(){sess.flip=true;drawF()};
function fnext(ok){
  S.kp[sess.ids[sess.i]]=ok?2:1;save();if(ok)sess.got++;else sess.miss++;
  if(sess.i<sess.ids.length-1){sess.i++;sess.flip=false;drawF();ov.scrollTop=0}
  else ov.innerHTML=head(sess.title)+'<div class="ob"><h2>这一轮背完了</h2><p class="big">'+sess.got+' / '+sess.ids.length+'</p><p class="sub">没记住的 '+sess.miss+' 张，下次会先出现。</p><button class="pri" data-act="flashAll">再背 10 张</button><button class="sec" data-act="close">回去</button></div>';
}
ACT.fyes=function(){fnext(true)};ACT.fno=function(){fnext(false)};

/* 模拟考 */
function fmt(ms){var s=Math.max(0,Math.ceil(ms/1000));return Math.floor(s/60)+':'+String(s%60).padStart(2,'0')}
function stopTimer(){if(tick){clearInterval(tick);tick=null}}
function startTimer(){stopTimer();tick=setInterval(function(){if(!S.mock){stopTimer();return}var left=S.mock.start+S.mock.dur-Date.now();if(left<=0){stopTimer();submitMock(true);return}var t=$('#timer');if(t)t.textContent=fmt(left)},1000)}
function composeMock(){
  var by={j:[],s:[],m:[]},rest=[],ids=[];
  shuffle(QS).forEach(function(q){by[q.t].push(q.i)});
  ['j','s','m'].forEach(function(t){ids=ids.concat(by[t].slice(0,MOCK[t]));rest=rest.concat(by[t].slice(MOCK[t]))});
  if(ids.length<MOCK.n)ids=ids.concat(shuffle(rest).slice(0,MOCK.n-ids.length));
  var ord={j:0,s:1,m:2};
  return ids.sort(function(a,b){return ord[QI.get(a).t]-ord[QI.get(b).t]});
}
ACT.mockStart=function(){
  if(S.mock&&!confirm('有一场没交卷的模拟考。放弃它，重新开一场？'))return;
  S.mock={ids:composeMock(),pick:{},start:Date.now(),dur:MOCK.min*60000};save();
  sess={kind:'k',i:0};openOv();drawQ();startTimer();
};
ACT.resume=function(){if(!S.mock)return;if(checkMockExpired())return;sess={kind:'k',i:0};var ids=S.mock.ids,i=ids.findIndex(function(id){return!S.mock.pick[id]});sess.i=i<0?0:i;openOv();drawQ();startTimer()};
function checkMockExpired(){if(S.mock&&Date.now()>=S.mock.start+S.mock.dur){submitMock(true);return true}return false}
function mockSheet(){
  var m=S.mock,secs={j:'判断',s:'单选',m:'多选'},h=head('答题卡','<button data-act="submit">交卷</button>')+'<div class="ob">';
  var un=m.ids.filter(function(id){return!m.pick[id]}).length;
  h+='<p class="sub">已答 '+(m.ids.length-un)+' / '+m.ids.length+'，剩 <span id="timer">'+fmt(m.start+m.dur-Date.now())+'</span>。点题号跳过去。</p>';
  var lastT='';
  m.ids.forEach(function(id,n){var t=QI.get(id).t;if(t!==lastT){if(lastT)h+='</div>';h+='<p class="grid-sec">'+secs[t]+'题</p><div class="grid">';lastT=t}h+='<button class="'+(m.pick[id]?'on':'')+(n===sess.i?' cur':'')+'" data-act="jump" data-n="'+n+'" aria-label="第 '+(n+1)+' 题'+(m.pick[id]?'，已答':'，未答')+'">'+(n+1)+'</button>'});
  h+='</div><button class="pri" data-act="submit">交卷</button></div>';
  ov.innerHTML=h;ov.scrollTop=0;
}
ACT.msheet=mockSheet;
ACT.jump=function(d){setI(+d.n)};
ACT.submit=function(){var m=S.mock;if(!m)return;var un=m.ids.filter(function(id){return!m.pick[id]}).length;if(confirm(un?'还有 '+un+' 题没答，确定交卷？':'确定交卷？'))submitMock(false)};
function submitMock(auto){
  var m=S.mock;if(!m)return;stopTimer();
  var right=0,by={},wrong=[];
  m.ids.forEach(function(id){var q=QI.get(id);if(!q)return;var p=m.pick[id]||'',ok=p===q.a,b=by[q.m]||(by[q.m]=[0,0]);b[1]++;if(ok){right++;b[0]++}else wrong.push(id);if(p)record(id,ok)});
  var used=Math.min(Date.now()-m.start,m.dur),answered=m.ids.filter(function(id){return m.pick[id]}).length;
  var rec={t:Date.now(),n:m.ids.length,right:right,score:Math.round(right/m.ids.length*100),used:used,by:by,answered:answered};
  S.mocks.unshift(rec);S.mocks=S.mocks.slice(0,30);S.mock=null;save();
  sess={kind:'r',wrong:wrong};
  var rows=Object.keys(by).map(function(k){return'<tr><td>'+esc(MOD[k].name)+'</td><td>'+by[k][0]+' / '+by[k][1]+'</td><td>'+pct(by[k][0]/by[k][1])+'</td></tr>'}).join('');
  ov.innerHTML=head('模拟考成绩')+'<div class="ob">'+(auto?'<p class="sub">时间到，已自动交卷。</p>':'')+'<p class="big">'+rec.score+' 分</p><p class="sub">答对 '+right+' / '+rec.n+'，作答 '+answered+'，用时 '+Math.round(used/60000)+' 分钟。</p>'+
    '<h2>各模块</h2><table class="tbl"><thead><tr><th>模块</th><th>答对</th><th>正确率</th></tr></thead><tbody>'+rows+'</tbody></table>'+
    (wrong.length?'<button class="pri" data-act="mockReview">逐题看错题和没答的（'+wrong.length+' 道）</button>':'')+'<button class="sec" data-act="close">回去</button></div>';
  openOv();
}
ACT.mockReview=function(){startSession('模拟考错题',sess.wrong.slice(),{track:false})};

/* 备份 */
ACT.export=function(){sess={kind:'b'};ov.innerHTML=head('导出备份')+'<div class="ob"><p>点「复制」，粘贴到备忘录或发给自己。换入口时用「导入备份」粘回去。</p><textarea id="bk" readonly aria-label="备份内容">'+esc(JSON.stringify(S))+'</textarea><button class="pri" data-act="copy">复制</button></div>';openOv()};
ACT.copy=function(){var t=$('#bk');t.focus();t.select();t.setSelectionRange(0,t.value.length);var ok=function(){toast('已复制，去备忘录粘贴')};if(navigator.clipboard&&navigator.clipboard.writeText)navigator.clipboard.writeText(t.value).then(ok,function(){document.execCommand('copy');ok()});else{document.execCommand('copy');ok()}};
ACT.import=function(){sess={kind:'b'};ov.innerHTML=head('导入备份')+'<div class="ob"><p>把导出的整段内容粘进来。导入会覆盖当前进度。</p><textarea id="im" aria-label="粘贴备份内容"></textarea><button class="pri" data-act="doimport">导入</button></div>';openOv()};
ACT.doimport=function(){try{var o=JSON.parse($('#im').value);if(!o||typeof o!=='object'||!o.r)throw 0;if(!confirm('导入会覆盖这台设备上的当前进度，继续？'))return;S=Object.assign(blank(),o);save();toast('导入成功');ACT.close()}catch(e){toast('这段内容不是有效的备份，请整段复制后再粘贴')}};
ACT.reset=function(){if(confirm('清空全部做题记录、错题本、计划打卡？不能撤销。')&&confirm('再确认一次：真的清空？')){S=blank();S.tip=1;save();render();toast('已清空')}};

document.addEventListener('click',function(e){
  var b=e.target.closest('[data-act]');if(!b||b.disabled)return;
  var f=ACT[b.dataset.act];if(f){e.preventDefault();f(b.dataset,b,e)}
});
document.addEventListener('visibilitychange',function(){if(!document.hidden&&ov.hidden)render()});
if(S.mock&&Date.now()>=S.mock.start+S.mock.dur)submitMock(true);
render();
if('serviceWorker' in navigator&&location.protocol.indexOf('http')===0)navigator.serviceWorker.register('sw.js').catch(function(){});
})();
</script>
</body>
</html>
